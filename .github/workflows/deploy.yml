name: Deploy static site to Pages

on:
  # Запускается при каждом push в основную ветку.
  # Если ваша основная ветка называется не "main" (например, "master"),
  # поменяйте значение ниже.
  push:
    branches: ["main"]

  # Позволяет запустить деплой вручную из вкладки Actions на GitHub
  # (кнопка "Run workflow"), без необходимости делать новый коммит.
  workflow_dispatch:

# Права, необходимые именно для деплоя на Pages через GitHub Actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Не даёт запускать несколько деплоев параллельно (это и было одной
# из причин зависания очереди). cancel-in-progress: false — рекомендация
# самого GitHub, чтобы не прерывать деплой, который уже пишет файлы.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Деплой начинается только если этот шаг зелёный (needs: test ниже).
  # Скриншотные проверки пропускаются (--ignore-snapshots): их эталоны
  # сняты на Windows, а шрифты в Linux рисуются чуть иначе. Всё остальное —
  # JSON, юнит-тесты, golden-данные, поведение в браузере — проверяется.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install test tooling
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Validate JSON
        run: npm run test:json

      - name: Unit tests
        run: npm run test:unit

      # Только информация — частичный перевод не ошибка (фолбэк на
      # английский). Таблица — во вкладке Actions → Summary этого запуска.
      - name: Locale coverage
        continue-on-error: true
        run: python3 tools/locale_coverage.py --markdown --list >> "$GITHUB_STEP_SUMMARY"

      - name: Browser tests
        run: npx playwright test --ignore-snapshots

      # Отчёт с трассировками упавших тестов — во вкладке Actions →
      # этот запуск → Artifacts.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # У сайта нет шага сборки — файлы копируются как есть. Но публикуем
      # только то, что нужно браузеру, а не весь репозиторий (.claude/,
      # tools/, *.md и прочее рабочее окружение наружу не уходят).
      # Добавили новую папку, которую грузит index.html? Допишите её в
      # SITE_PATHS — а в .assetsignore для Cloudflare ничего менять не
      # нужно, там список исключений.
      - name: Assemble site
        env:
          SITE_PATHS: "index.html css js data locales assets"
        run: |
          mkdir _site
          for p in $SITE_PATHS; do cp -r "$p" _site/; done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
