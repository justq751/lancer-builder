/* CORE bonuses live on the summary side — add a quick picker via summary cores section: handled on pilot? 
   We expose CORE selection through a dedicated control: */
/* ============ CORE-БОНУСЫ ============ */
let coreFilter="ALL", coreSearch="";

/* Shared detail-card markup for a CORE bonus, used both when viewing an
   already-selected bonus and when browsing the add-picker. */
function coreCardBody(c){
  const unl=coreBonusUnlocked(c);
  return `${unl?"":`<div class="hint" style="margin-top:2px">Требуется 3+ ранга лицензии на шасси ${esc(c.source)} (сейчас: ${manufacturerRank(c.source)}).</div>`}
    <div class="desc" style="margin-top:10px">${rich(c.effect)}</div>
    ${c.mounted_effect?`<div class="desc" style="margin-top:9px"><b>Если установлено на крепление:</b> ${rich(c.mounted_effect)}</div>`:""}`;
}
function coreCardHTML(c){
  const unl=coreBonusUnlocked(c);
  return `<div class="item static">
    <div class="src" style="background:${srcColor(c.source)}"></div>
    <div class="top"><div class="nm" style="font-size:19px">${esc(c.name)}</div>
      <div class="badge ${unl?'':'lock'}">${unl?esc(c.source):"🔒 "+esc(c.source)+" 3+"}</div></div>
    <div style="margin-top:11px">${coreCardBody(c)}</div>
  </div>`;
}

function renderCore(){
  const d=derived();
  const capped=d.b.core.cap<1;
  $("#tab").innerHTML = sechead("// 08 · CORE-БОНУСЫ","CORE-бонусы",
      capped
        ? "CORE-бонусы открываются с LL3, и затем ещё по одному за каждые 3 уровня лицензий (LL6, LL9…)."
        : `Выбрано ${state.cores.length} из ${d.b.core.cap}. Бонусы конкретного производителя открываются, когда у вас есть 3+ ранга лицензии на любое шасси этого производителя — иначе доступны только бонусы GMS.`)
    + (capped ? "" : `
      <div id="core-selected"></div>
      <div class="filters" id="core-filters" style="margin-top:18px">${["ALL","GMS","IPS-N","SSC","HORUS","HA","EXOTIC"].map(s=>`<button class="chip ${coreFilter===s?'on':''}" data-cf="${s}">${s==="ALL"?"ВСЕ":s}</button>`).join("")}</div>
      <input class="input" id="core-search" placeholder="поиск CORE-бонусов…" style="margin:12px 0 14px" value="${esc(coreSearch)}">
      <div class="grid cards" id="core-list"></div>`);
  if(capped) return;

  $("#core-selected").innerHTML = state.cores.length ? `<div class="mount">` + state.cores.map((id,ci)=>{
    const c=M.core[id];
    return `<div class="slot"><div class="equipped">
      <div class="ei clickable" data-viewcore="${ci}"><div class="en">${esc(c.name)}</div>
        <div class="em">${esc(c.source)}</div></div>
      <button class="xbtn" data-rmcore="${ci}">✕</button>
    </div></div>`;
  }).join("") + `</div>` : `<div class="hint">// CORE-бонусы не выбраны</div>`;

  $$("#core-selected .ei[data-viewcore]").forEach(el=>el.onclick=()=>viewSelectedCore(+el.dataset.viewcore));
  $$("#core-selected .xbtn[data-rmcore]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    state.cores.splice(+b.dataset.rmcore,1); render();
  });

  const drawList=()=>{
    const list=L.core_bonuses
      .filter(c=>!state.cores.includes(c.id))
      .filter(c=>coreFilter==="ALL"||c.source===coreFilter)
      .filter(c=>!coreSearch||(c.name+" "+c.source).toLowerCase().includes(coreSearch.toLowerCase()))
      .sort((a,b)=>(sourceOrder(a.source)-sourceOrder(b.source))||(coreBonusUnlocked(b)-coreBonusUnlocked(a))||a.name.localeCompare(b.name));
    $("#core-list").innerHTML=list.map(c=>{
      const unl=coreBonusUnlocked(c);
      return `<div class="item ${!unl?'locked':''}" data-c="${c.id}">
        <div class="src" style="background:${srcColor(c.source)}"></div>
        <div class="top"><div class="nm">${esc(c.name)}</div>
          <div class="badge ${unl?'':'lock'}">${unl?esc(c.source):"🔒 "+esc(c.source)+" 3+"}</div></div>
      </div>`;
    }).join("")||`<div class="hint">// нет доступных CORE-бонусов по этому запросу</div>`;
    $$("#core-list .item").forEach(it=>it.onclick=()=>openCoreDetail(it.dataset.c));
  };
  $$("#core-filters .chip").forEach(ch=>ch.onclick=()=>{
    coreFilter=ch.dataset.cf;
    $$("#core-filters .chip").forEach(x=>x.classList.toggle("on",x.dataset.cf===coreFilter));
    drawList();
  });
  const input=$("#core-search");
  input.oninput=e=>{coreSearch=e.target.value; drawList();};
  drawList();
}

/* View an already-selected CORE bonus (opened from the slot list) — mirrors
   the pattern used for equipped weapons/systems: no back button, just a remove action. */
function viewSelectedCore(ci){
  const c=M.core[state.cores[ci]];
  modal(c.name, coreCardHTML(c) +
    `<button class="ghostbtn warn" id="core-remove" style="margin-top:16px;width:100%;text-align:center">✕ Убрать этот CORE-бонус</button>`);
  $("#core-remove").onclick=()=>{ state.cores.splice(ci,1); closeModal(); render(); };
}

/* Detail view for a not-yet-selected bonus, opened by clicking a card in the
   on-page list — mirrors openFrame(): the list itself always stays on the
   page, only the "select this one" step happens in a modal. */
function openCoreDetail(id){
  const c=M.core[id], d=derived();
  const full=state.cores.length>=d.b.core.cap;
  const unl=coreBonusUnlocked(c);
  modal(c.name, coreCardHTML(c) +
    `<button class="ghostbtn ${full?'':(unl?'':'warn')}" id="core-select" style="margin-top:16px;width:100%;text-align:center" ${full?"disabled":""}>
      ${full?`⚠ Лимит исчерпан (${state.cores.length}/${d.b.core.cap})`:(unl?"✓ Выбрать этот CORE-бонус":`⚠ Выбрать всё равно (лицензия ${esc(c.source)} не открыта)`)}
    </button>`);
  $("#core-select").onclick=()=>{
    if(full) return;
    state.cores.push(id); closeModal(); render();
  };
}

/* ============ MODAL ============ */
function modal(title,html){
  $("#modal .mhd h3").textContent=title;
  $("#modal .mbd").innerHTML=html;
  $("#modal").classList.add("show");
}
function closeModal(){ $("#modal").classList.remove("show"); }

/* ============ EXPORT / IMPORT ============ */
function exportBuild(){
  const data=JSON.stringify({_app:"lancer-registry",v:1,state},null,2);
  const blob=new Blob([data],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`${(state.pilot.callsign||"pilot").replace(/\s+/g,"_")}_lancer.json`;
  a.click(); URL.revokeObjectURL(a.href);
}
function importBuild(file){
  const r=new FileReader();
  r.onload=()=>{ try{
    const d=JSON.parse(r.result);
    if(!d.state) throw 0;
    Object.assign(state,structuredClone(d.state));
    // ensure mounts align with frame
    if(state.mech.frameId && (!state.mech.mounts||!state.mech.mounts.length)) state.mech.mounts=buildMounts(M.frame[state.mech.frameId]);
    render();
  }catch(e){ alert("Не удалось загрузить файл сборки."); } };
  r.readAsText(file);
}

    ${d.frame?`<h2 style="font-family:Arial">МЕХ — ${esc(dispName(d.frame))} (${esc(d.frame.source)})</h2>
      <p>HP ${d.mech.hp} · Armor ${d.mech.armor} · Evasion ${d.mech.evasion} · E-Def ${d.mech.edef} · Heat ${d.mech.heatcap} · Speed ${d.mech.speed} · Save ${d.mech.save} · SP ${d.sp.used}/${d.sp.cap}</p>
      <p><b>Оружие:</b> ${state.mech.mounts.flatMap(mt=>mt.items.map(id=>"["+tr(mt.type)+"] "+esc(M.weapon[id].name))).join(", ")||"—"}</p>
      <p><b>Системы:</b> ${state.mech.systems.map(id=>esc(M.system[id].name)).join(", ")||"—"}</p>`:""}`;
}

/* ============ TOPBAR WIRING ============ */
function wireTopbar(){
  $("#t-export").onclick=exportBuild;
  $("#t-import").onclick=()=>$("#import-file").click();
  $("#import-file").onchange=e=>{ if(e.target.files[0]) importBuild(e.target.files[0]); e.target.value=""; };
  $("#t-reset").onclick=()=>{ if(confirm("Сбросить всю сборку?")){
    Object.assign(state,{pilot:{name:"",callsign:"",background:"",ll:0},skills:{},talents:{},
      hase:{hull:0,agility:0,systems:0,engineering:0},licenses:{},gear:{armor:null,weapons:[],gear:[]},
      cores:[],mech:{frameId:null,mounts:[],systems:[]}}); activeTab="pilot"; render();
  }};
  $("#modal").onclick=e=>{ if(e.target.id==="modal"||e.target.classList.contains("mclose")) closeModal(); };
}

/* ============ BOOT ============ */
function boot(){
  const lines=["ИНИЦИАЛИЗАЦИЯ COMP/CON…","ЗАГРУЗКА РЕЕСТРА UNION…",
    `СИНХРОНИЗАЦИЯ: ${L.frames.length} ШАССИ · ${L.weapons.length} ОРУЖИЯ · ${L.systems.length} СИСТЕМ`,
    "ДОСТУП РАЗРЕШЁН ▸"];
  const el=$("#boot .blog"); let i=0;
  const tick=()=>{ if(i<lines.length){ el.textContent=lines[i++]; setTimeout(tick,360); }
    else setTimeout(()=>$("#boot").classList.add("done"),320); };
  tick();
}

/* ============ LANGUAGE SWITCH ============ */
function wireLangSwitch(){
  const btn=$("#t-lang");
  if(!btn) return;
  btn.textContent = currentLang==="ru" ? "EN / RU" : "RU / EN";
  btn.onclick = async ()=>{
    const next = currentLang==="ru" ? "en" : "ru";
    btn.disabled = true; btn.textContent="…";
    try{
      L = await fetchAndLocalize(next);
      rebuildIndexes();
      wireLangSwitch();
      render();
    } finally { btn.disabled = false; }
  };
}

/* ============ INIT ============ */
(async function startApp(){
  try{
    L = await fetchAndLocalize(currentLang);
  }catch(e){
    console.error(e);
    return; // loadBaseData() already showed an error message in the DOM
  }
  rebuildIndexes();
  wireTopbar();
  wireLangSwitch();
  render();
  boot();
})();
</script>
