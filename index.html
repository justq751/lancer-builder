      <h3 style="font-family:'Chakra Petch';font-size:16.5px;margin:18px 0 10px;color:${srcColor(src)}">// ${esc(SRC_NAME[src]||src)}</h3>
      <div class="grid cards">${fr.map(f=>{
        const key=licenseKeyFor(f);
        const v=licRank(key);
        const nUnlock = [...L.weapons,...L.systems,...(L.mods||[])].filter(it=>it.license===key && (it.license_level||0)<=v).length;
        return `<div class="item ${v?'sel':''} clickable" data-openlic="${f.id}">
          <div class="src" style="background:${srcColor(src)}"></div>
          <div class="top"><div class="nm">${esc(dispName(f))}</div><div class="badge">${f.mechtype?.map(tr).join(" / ")||""}</div></div>
          <div style="display:flex; gap:12px; align-items:flex-start; margin-top:6px">
            <div style="flex:1; min-width:0">
              <div class="meta">ШАССИ открывается на ранге ${f.license_level} · открыто предметов: ${nUnlock}</div>
              ${f.variant?`<div class="meta" style="color:var(--accent)">↳ общая лицензия с ${esc(f.variant)}</div>`:""}
            </div>
            ${frameImageURL(f)?`<img class="frame-thumb" src="${frameImageURL(f)}" alt="" loading="lazy" onerror="this.remove()">`:""}
          </div>
          <div class="stepper" style="margin-top:11px">
            <button class="stepbtn" data-lic="${esc(key)}" data-d="-1" ${v<=0?"disabled":""}>−</button>
            <span class="pips">${[1,2,3].map(n=>`<span class="pip ${v>=n?'on':''}"></span>`).join("")}</span>
            <button class="stepbtn" data-lic="${esc(key)}" data-d="1" ${(v<3&&remaining>=1)?"":"disabled"}>+</button>
          </div></div>`;
      }).join("")}</div>`).join("");
  $$("#tab .stepbtn[data-lic]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    stepLicense(b.dataset.lic, +b.dataset.d);
    render();
  });
  $$("#tab .item[data-openlic]").forEach(it=>it.onclick=()=>openLicenseDetail(it.dataset.openlic));
}

/* ============ FRAME ============ */
let frameFilter="ALL";
let frameSummaryOpen=true; // collapse state for the "ВЫБРАННОЕ ШАССИ" summary card
/* Traits + CORE system markup, shared by the frame detail modal, the
   selected-frame card on the ШАССИ tab, and the ИТОГ (summary) tab. */
/* Renders one structured action (CORE power sub-action, or eventually a
   weapon's own top-level "actions" entries — same shape) as a proper
   stat-block: name + activation badge, then a stats row ONLY when the
   action actually deals damage or has its own range/burst (a lot of CORE
   actions are pure buffs/utility and have neither — in that case the row
   is simply omitted rather than shown empty), then TRIGGER and EFFECT as
   separate labeled lines. This is what fold_actions() used to flatten away
   into one paragraph; this reads the same source shape without discarding
   the structure. `act.detail` is already locale-overlaid the same way
   weapon on_hit/on_attack are (string or {detail} — see onHitText). */
function actionBlockHTML(act){
  if(!act) return "";
  const av=(act.activation||"").toLowerCase();
  const rangeStr=(act.range||[]).map(r=>`${tr(r.type)} ${r.val}`).join(", ");
  const dmgStr=(act.damage||[]).map(d=>`${d.val} ${tr(d.type)}`).join(", ");
  return `<div class="action-block act-${esc(av)||'free'}">
    <div class="action-head">
      <span class="action-nm">${esc(act.name||"")}</span>
      ${act.activation?`<span class="action-badge">${esc(tr(act.activation))}</span>`:""}
    </div>
    ${(rangeStr||dmgStr)?`<div class="action-stats">
      ${rangeStr?`<span class="action-stat">🎯 ${esc(rangeStr)}</span>`:""}
      ${dmgStr?`<span class="action-stat">💥 ${esc(dmgStr)}</span>`:""}
    </div>`:""}
    ${act.trigger?`<div class="action-row"><span class="action-lbl">Триггер</span>${rich(onHitText(act.trigger))}</div>`:""}
    ${act.detail!==undefined?`<div class="action-row"><span class="action-lbl">Эффект</span>${rich(onHitText(act.detail))}</div>`:""}
  </div>`;
}
function frameTraitsCoreHTML(f){
  const cs=f.core_system;
  const traits=f.traits.map(t=>`<div style="margin-bottom:10px"><b style="font-family:'Chakra Petch'">${esc(t.name)}</b><div class="desc" style="margin-top:3px">${rich(t.description)}</div></div>`).join("");
  let core="";
  if(cs){
    core=`<h3 style="font-family:'Chakra Petch';margin:6px 0 8px;color:var(--accent)">CORE-СИСТЕМА — ${esc(cs.name)}</h3>
      ${cs.description?`<div class="desc" style="margin-bottom:8px">${rich(cs.description)}</div>`:""}`;
    if(cs.passive_name){
      core+=`<div style="margin-bottom:8px"><b>Пассивно — ${esc(cs.passive_name)}:</b></div>`;
      core+=cs.passive_effect?`<span class="desc">${rich(cs.passive_effect)}</span>`:"";
      if(cs.passive_actions&&cs.passive_actions.length) core+=cs.passive_actions.map(actionBlockHTML).join("");
    }
    if(cs.active_name){
      core+=`<div style="margin-bottom:8px; margin-top:12px"><b>CORE-актив — ${esc(cs.active_name)}${cs.activation?` <span class="action-badge">${esc(tr(cs.activation))}</span>`:""}:</b></div>`;
      core+=cs.active_effect?`<span class="desc">${rich(cs.active_effect)}</span>`:"";
      if(cs.active_actions&&cs.active_actions.length) core+=cs.active_actions.map(actionBlockHTML).join("");
    }
  }
  return (traits?`<h3 style="font-family:'Chakra Petch';margin:6px 0 8px">ОСОБЕННОСТИ</h3>${traits}`:"") + core;
}
/* Full frame detail: meta line + description + stat grid + traits/CORE.
   `computed`, if passed, is the fully-derived mech stat object (grit/HASE/
   CORE bonuses already folded in) — used when this is the pilot's actual
   equipped frame, so the numbers here match what's shown elsewhere (HUD,
   ИТОГ). When browsing a frame that ISN'T equipped yet, `computed` is
   omitted and this falls back to the frame's plain base stats, since none
   of those bonuses apply until the frame is actually selected. */
function frameDetailBodyHTML(f, computed, imgUrl, imgSize){
  const statRows = [
    ["structure","hp","armor"],
    ["stress","heatcap"],
    ["evasion","speed"],
    ["edef","tech_attack"],
    ["sensor_range","repcap"],
    ["save","sp"],
  ];
  const vals = computed || f.stats;
  const rowsHTML = statRows.map(keys=>{
    const cols = keys.length===3 ? "cols3" : "cols2";
    return `<div class="statrow-line ${cols}">${keys.map(k=>
      `<div class="stattile row">${statIconHTML(k,"lg")}<span class="k">${esc(L.stat_labels?.[k]||STAT_RU[k][0])}</span><span class="v">${vals[k]}</span></div>`
    ).join("")}</div>`;
  }).join("");
  // Image floats at the top, roughly matched in size to the stat table's
  // height — description text wraps around it, then the stat grid is
  // force-cleared onto its own full-width line below, so it never gets
  // squeezed into the narrow space beside the float. Wrapped in a link to
  // the same hotlinked source so people can open/save the original art.
  const sz = imgSize || 150;
  const imgHTML = imgUrl ? `<a href="${imgUrl}" target="_blank" rel="noopener" title="Открыть источник изображения">
    <img src="${imgUrl}" alt="" loading="lazy" onerror="this.closest('a').remove()"
      style="float:right; width:${sz}px; height:${sz}px; object-fit:contain; margin:0 0 12px 16px; border-radius:8px; background:var(--panel-2); cursor:zoom-in"></a>` : "";
  return `
    ${imgHTML}
    <div class="meta" style="margin-bottom:8px;color:${srcColor(f.source)}">${esc(SRC_NAME[f.source]||f.source)} · ${f.mechtype.map(tr).join(" / ")} · лицензия LL${f.license_level}</div>
    <div class="desc" style="margin-bottom:14px">${rich(f.description)}</div>
    <div class="statrows">${rowsHTML}</div>
    ${frameTraitsCoreHTML(f)}`;
}

function renderFrame(){
  const d=derived();
  $("#tab").innerHTML = sechead("// 06 · ШАССИ","Выбор меха",
    "Выберите рамную платформу (frame). Её базовые статы складываются с вашими мех-навыками и GRIT. Замок означает, что лицензия ещё не открыта — выбрать можно всё, но проверьте требования на вкладке ЛИЦЕНЗИИ.")
    + (d.frame ? `
      <div class="card" style="margin-bottom:20px">
        <div class="head"><span class="lbl"><b>//</b> ВЫБРАННОЕ ШАССИ — ${esc(dispName(d.frame))}</span>
          <span style="display:flex; align-items:center; gap:10px">
            <span class="lbl" style="color:${srcColor(d.frame.source)}">${esc(d.frame.source)}</span>
            <button class="xbtn expand" id="toggle-frame-summary" title="${frameSummaryOpen?'Свернуть':'Развернуть'}" aria-label="${frameSummaryOpen?'Свернуть':'Развернуть'} сводку шасси">${frameSummaryOpen?'⌄':'›'}</button>
          </span></div>

      </div>` : "")
    + `<div class="filters" id="frame-filters">
        ${["ALL","GMS","IPS-N","SSC","HORUS","HA"].map(s=>`<button class="chip ${frameFilter===s?'on':''}" data-ff="${s}">${s==="ALL"?"ВСЕ":s}</button>`).join("")}
       </div><div id="frame-list"></div>`;
  const list=L.frames.filter(f=>frameFilter==="ALL"||f.source===frameFilter);
  // Group by manufacturer (GMS first, then IPS-N/SSC/HORUS/HA in that fixed
  // order) so each source gets its own row instead of interleaving — each
  // group is its own <div class="grid cards">, which is what forces the
  // next manufacturer's frames onto a new line.
  const groups={};
  list.forEach(f=>(groups[f.source]=groups[f.source]||[]).push(f));
  const srcKeys=Object.keys(groups).sort((a,b)=>sourceOrder(a)-sourceOrder(b));
  $("#frame-list").innerHTML=srcKeys.map(src=>{
    const fr=groups[src].sort((a,b)=>(frameUnlocked(b)-frameUnlocked(a))||dispName(a).localeCompare(dispName(b)));
    return `<h3 style="font-family:'Chakra Petch';font-size:16.5px;margin:20px 0 10px;color:${srcColor(src)}">// ${esc(SRC_NAME[src]||src)}</h3>
      <div class="grid cards">${fr.map(f=>{
        const sel=state.mech.frameId===f.id;
        const lk=!frameUnlocked(f);
        const s=f.stats;
        return `<div class="item ${sel?'sel':''} ${lk?'locked':''}" data-frame="${f.id}">
          <div class="src" style="background:${srcColor(f.source)}"></div>
          <div class="top"><div class="nm">${esc(dispName(f))}</div>
            <div class="badge ${lk?'lock':'mfg'}" ${lk?'':`style="--src:${srcColor(f.source)}"`}>${lk?"🔒 LL"+f.license_level:f.source}</div></div>
          <div style="display:flex; gap:12px; align-items:flex-start; margin-top:6px">
            <div style="flex:1; min-width:0">
              <div class="meta">${f.mechtype.map(tr).join(" / ")}</div>
            </div>
            ${frameImageURL(f)?`<img class="frame-thumb lg" src="${frameImageURL(f)}" alt="" loading="lazy" onerror="this.remove()">`:""}
          </div>
          <div class="tags stat-grid" style="margin-top:9px">
            <span class="tag stat">HP ${s.hp}</span><span class="tag stat">УКЛ ${s.evasion}</span>
            <span class="tag stat">БРОНЯ ${s.armor}</span>
            <span class="tag stat sp">SP ${s.sp}</span><span class="tag stat">СКОР ${s.speed}</span>
            <span class="tag stat">РАЗМ ${s.size}</span>
          </div>
          <div class="meta" style="margin-top:9px">КРЕПЛЕНИЯ: ${f.mounts.map(tr).join(" · ")}</div>
          <button class="ghostbtn ${(!sel&&lk)?'warn':''}" data-pickframe="${f.id}" ${sel?"disabled":""}
            style="margin-top:11px; width:100%; text-align:center">${sel?"✓ ВЫБРАНО":(lk?"⚠ ВЫБРАТЬ НАСИЛЬНО":"▶ ВЫБРАТЬ ЭТО ШАССИ")}</button>
        </div>`;
      }).join("")}</div>`;
  }).join("");
  $$("#frame-filters .chip").forEach(c=>c.onclick=()=>{frameFilter=c.dataset.ff; renderFrame();});
  $$("#frame-list .item").forEach(it=>it.onclick=()=>openFrame(it.dataset.frame));
  $$("#frame-list [data-pickframe]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    pickFrame(b.dataset.pickframe);
  });
  const toggleBtn=$("#toggle-frame-summary");
  if(toggleBtn) toggleBtn.onclick=()=>{ frameSummaryOpen=!frameSummaryOpen; renderFrame(); };
}
function openFrame(id){
  const f=M.frame[id];
  const isSel=state.mech.frameId===id;
  const lk=!frameUnlocked(f);
  modal(dispName(f), frameDetailBodyHTML(f, isSel?derived().mech:null, frameImageURL(f), 300));
  const mhd=$("#modal .mhd");
  const btn=document.createElement("button");
  btn.className="toolbtn";
  if(isSel){
    btn.style.borderColor="var(--accent)"; btn.style.color="var(--accent)";
    btn.textContent="✓ ВЫБРАНО";
    btn.disabled=true; btn.style.opacity=".6";
  } else {
    const clr = lk ? "var(--red)" : "var(--accent)";
    btn.style.borderColor=clr; btn.style.color=clr;
    btn.textContent = lk ? "⚠ ВЫБРАТЬ НАСИЛЬНО" : "▶ ВЫБРАТЬ ЭТО ШАССИ";
    // Close first: pickFrame() may need the modal for its own confirmation.
    btn.onclick=()=>{ closeModal(); pickFrame(id); };
  }
  mhd.insertBefore(btn, mhd.querySelector(".mclose"));
}

/* ============ LOADOUT ============ */
function renderLoadout(){
  const d=derived();
  if(!d.frame){
    $("#tab").innerHTML=sechead("// 07 · ВООРУЖЕНИЕ","Снаряжение меха","Сначала выберите шасси на вкладке ШАССИ.")
      +`<div class="nomech" style="padding:40px">// НЕТ АКТИВНОГО ШАССИ</div>`;
    return;
  }
  const over=d.sp.used>d.sp.cap;
  $("#tab").innerHTML = sechead("// 07 · ВООРУЖЕНИЕ",`Снаряжение — ${esc(dispName(d.frame))}`,
    `Установите оружие в крепления и системы в рамках системных очков (SP). Использовано SP: ${d.sp.used} из ${d.sp.cap}.`)
    + (over?`<div class="warnbox">⚠ Превышен лимит системных очков на ${d.sp.used-d.sp.cap} SP.</div>`:"")
    + `<h3 class="subhead" style="margin:6px 0 12px">// КРЕПЛЕНИЯ ОРУЖИЯ</h3>
       <div id="mounts"></div>
       <h3 class="subhead" style="margin:24px 0 6px">// СИСТЕМЫ <span class="mono" style="font-size:12px;color:var(--faint)">(SP ${d.sp.used}/${d.sp.cap})</span></h3>
       <div class="spacer-sm"></div>
       <button class="ghostbtn" id="add-system">+ ДОБАВИТЬ СИСТЕМУ</button>
       <div class="grid" id="syslist" style="margin-top:12px"></div>`;

  // mounts
  $("#mounts").innerHTML = state.mech.mounts.map((mt,mi)=>{
    const isInt = mt.type==="Integrated";
    const sizes=mt.items.map(slot=>M.weapon[slot.id]?.mount);
    const can = isInt ? false : allowedNext(mt.type,sizes).length>0;
    const slots = mt.items.map((slot,wi)=>{
      const w=M.weapon[slot.id];
      const mod = slot.mod ? M.mod[slot.mod] : null;
      const ew = effectiveWeapon(w, mod); // mod's added_tags/range/damage folded in, for display only
      const key=`${mi}:${wi}`, dk=`${mi}-${wi}`, open=eqWeaponExpanded.has(key);
      const row=`<div class="equipped">
        <div class="ei clickable" data-vieww="${key}"><div class="en">${esc(w.name)}</div>
          <div class="em">${tr(w.mount)} · ${tr(w.type)} · ${dmgStr(ew)} · ${rngStr(ew)}${w.sp?` · ${w.sp} SP`:""}</div></div>
        <div style="display:flex;align-items:center;gap:8px">
          <button class="xbtn expand" data-expw="${key}" title="Показать подробности" aria-label="${open?'Свернуть':'Развернуть'} подробности">${open?'⌄':'›'}</button>
          <button class="xbtn" data-rmw="${key}" aria-label="Убрать оружие">✕</button>
        </div>
      </div>`;
      const expand=open?`<div class="expand-detail">${weaponCardBody(ew, dk, eqWeaponProfIdx.get(key)||0)}</div>`:"";

      // mod sub-row: install button if none, else name + expand/remove
      const compatMods = (L.mods||[]).filter(m=>modCompatible(m,w));
      const modOpen = eqModExpanded.has(key);
      let modRow="";
      if(mod){
        const mlk=!unlocked(mod);
        modRow = `<div class="equipped" style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)">
          <div class="ei clickable" data-viewmod="${key}"><div class="en">🔧 ${esc(mod.name)}</div>
            <div class="em">${mlk?`🔒 ${esc(licenseDisplayName(mod.license))} ${mod.license_level}`:`${mod.sp||0} SP`}</div></div>
          <div style="display:flex;align-items:center;gap:8px">
            <button class="xbtn expand" data-expmod="${key}" title="Показать подробности" aria-label="${modOpen?'Свернуть':'Развернуть'} подробности">${modOpen?'⌄':'›'}</button>
            <button class="xbtn" data-rmmod="${key}" aria-label="Убрать мод">✕</button>
          </div>
        </div>${modOpen?`<div class="expand-detail">${modCardBody(mod, dk+"-mod")}</div>`:""}`;
      } else if(compatMods.length){
        modRow = `<button class="ghostbtn block mt-10" data-addmod="${key}">+ УСТАНОВИТЬ МОД</button>`;
      }
      return `<div class="slot">${row}${expand}${modRow}</div>`;
    }).join("");
    const capLine = isInt
      ? `${mt.items.length} / 1 · встроено в шасси`
      : `${mt.items.length} / ${mt.type.includes("/")||mt.type==="Flex"?2:1} · ${allowedNext(mt.type,sizes).map(tr).join("/")||"заполнено"}`;
    const restoreBtn = (isInt && !mt.items.length)
      ? `<div class="slot"><button class="ghostbtn" data-restoreint="${mi}">+ ВОССТАНОВИТЬ ИНТЕГРИРОВАННОЕ ОРУЖИЕ</button></div>` : "";
    return `<div class="mount ${isInt?'integrated':''}">
      <div class="mhead"><span class="mt">${tr(mt.type)}</span>
        <span class="cap">${capLine}</span></div>
      ${slots}
      ${can?`<div class="slot"><button class="ghostbtn" data-addw="${mi}">+ УСТАНОВИТЬ ОРУЖИЕ</button></div>`:""}
      ${restoreBtn}
    </div>`;
  }).join("");
  eqWeaponExpanded.forEach(key=>{
    const [emi,ewi]=key.split(":").map(Number);
    const mnt=state.mech.mounts[emi], slot=mnt && mnt.items[ewi], w=slot && M.weapon[slot.id];
    if(!w){ eqWeaponExpanded.delete(key); return; }
    const ew = effectiveWeapon(w, slot.mod ? M.mod[slot.mod] : null);
    const dk=`${emi}-${ewi}`;
    const tagSet=getMap(eqWeaponTagSets,key,()=>new Set());
    wireTagGlossary(`#wp-tags-${dk}`,`#wp-tagdesc-${dk}`, weaponDisplayTags(ew, eqWeaponProfIdx.get(key)||0), tagSet);
    wireProfileChips(`#wp-profiles-${dk}`, renderLoadout, v=>eqWeaponProfIdx.set(key,v));
  });
  eqModExpanded.forEach(key=>{
    const [emi,ewi]=key.split(":").map(Number);
    const mnt=state.mech.mounts[emi], slot=mnt && mnt.items[ewi], mod=slot && slot.mod && M.mod[slot.mod];
    if(!mod){ eqModExpanded.delete(key); return; }
    const dk=`${emi}-${ewi}-mod`;
    const tagSet=getMap(eqModTagSets,key,()=>new Set());
    wireTagGlossary(`#md-tags-${dk}`,`#md-tagdesc-${dk}`, mod.tags||[], tagSet);
  });

  // systems
  $("#syslist").innerHTML = state.mech.systems.length? state.mech.systems.map((id,si)=>{
    const sy=M.system[id];
    const open=eqSystemExpanded.has(si);
    const row=`<div class="listrow">
      <div class="info clickable" data-views="${si}"><div class="nm">${esc(sy.name)} <span class="tag sp">${sy.sp} SP</span></div>
        <div class="ds">${esc(tr(sy.type))} · ${esc(sy.source)}${sy.effect?" · "+esc(truncateWords(stripHTML(sy.effect),140)):""}</div></div>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="xbtn expand" data-exps="${si}" title="Показать подробности" aria-label="${open?'Свернуть':'Развернуть'} подробности">${open?'⌄':'›'}</button>
        <button class="xbtn" data-rms="${si}" aria-label="Убрать систему">✕</button>
      </div>
    </div>`;
    const expand=open?`<div class="expand-detail">${systemCardBody(sy, String(si))}</div>`:"";
    return `<div class="pickitem">${row}${expand}</div>`;
  }).join("") : `<div class="hint">// систем не установлено</div>`;
  eqSystemExpanded.forEach(si=>{
    const sy=M.system[state.mech.systems[si]];
    if(!sy){ eqSystemExpanded.delete(si); return; }
    const tagSet=getMap(eqSystemTagSets,si,()=>new Set());
    wireTagGlossary(`#sy-tags-${si}`,`#sy-tagdesc-${si}`, sy.tags||[], tagSet);
  });

  $$("#mounts .ghostbtn[data-addw]").forEach(b=>b.onclick=()=>openWeaponPicker(+b.dataset.addw));
  $$("#mounts .ghostbtn[data-restoreint]").forEach(b=>b.onclick=()=>openIntegratedPicker(+b.dataset.restoreint));
  $$("#mounts .xbtn[data-rmw]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const key=b.dataset.rmw, [mi,wi]=key.split(":").map(Number);
    state.mech.mounts[mi].items.splice(wi,1);
    eqWeaponExpanded.delete(key); eqWeaponTagSets.delete(key); eqWeaponProfIdx.delete(key);
    eqModExpanded.delete(key); eqModTagSets.delete(key);
    render();
  });
  $$("#mounts .xbtn[data-expw]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const key=b.dataset.expw;
    if(eqWeaponExpanded.has(key)) eqWeaponExpanded.delete(key); else eqWeaponExpanded.add(key);
    renderLoadout();
  });
  $$("#mounts .ei[data-vieww]").forEach(el=>el.onclick=()=>{
    const [mi,wi]=el.dataset.vieww.split(":").map(Number);
    viewEquippedWeapon(mi,wi);
  });
  $$("#mounts .ghostbtn[data-addmod]").forEach(b=>b.onclick=()=>{
    const [mi,wi]=b.dataset.addmod.split(":").map(Number);
    openModPicker(mi,wi);
  });
  $$("#mounts .ei[data-viewmod]").forEach(el=>el.onclick=()=>{
    const [mi,wi]=el.dataset.viewmod.split(":").map(Number);
    viewEquippedMod(mi,wi);
  });
  $$("#mounts .xbtn[data-expmod]").forEach(b=>b.onclick=e=>{

/* Strips HTML tags for a plain-text preview, then truncates at a word

const stripHTML = html => String(html || "").replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
const truncateWords = (str, max) => {
  if (str.length <= max) return str;

/* Wires click handlers on .glossary tag chips inside `tagsSel` so clicking

   array used to render the chips, in the same order (data-tgi is the index). */
let tagOpenSet=new Set();
function wireTagGlossary(tagsSel, boxSel, rawTags, tagSet){
  tagSet = tagSet || tagOpenSet;

  const draw=()=>{

const rngStr=w=>(w.range||[]).map(x=>`${tr(x.type)} ${x.val}`).join(", ")||"—";

   charge/die value. profileViewIdx is purely a *display* toggle for
   browsing those stages inside the card; it isn't part of the saved build. */
let profileViewIdx=0;
const profDmgStr = p => (p.damage||[]).map(x=>x.type?`${x.val} ${tr(x.type)}`:`${x.val}`).join(", ")||"—";
const profRngStr = p => (p.range||[]).map(x=>x.type?`${tr(x.type)} ${x.val}`:`${x.val}`).join(", ")||"—";
function wireProfileChips(sel, redraw, setIdx){

/* `uid`, when given, namespaces the internal element ids (so several of
   these can be expanded on the same page at once — e.g. several equipped
   weapons in the loadout tab) and `curProfIdx` lets the caller supply its
   own per-instance "which stage is shown" value instead of the shared

/* Combines base weapon tags with the active profile's own tags (some
   multi-stage weapons, like the Leviathan HAC, only carry certain tags in
   specific modes) into one array — used for both rendering the chips and
   as the `rawTags` index base for wireTagGlossary, so data-tgi stays
   consistent between the two. */
/* Merges a mod's added_tags/added_range/added_damage onto a weapon for
   DISPLAY purposes only — returns a new object, never mutates M.weapon[id]
   (the same base weapon may be equipped elsewhere unmodified). This is the
   "simple, mechanically apply-able" half of a mod's effect; anything more
   involved (on_hit, reroll/reposition mechanics, etc.) stays as text the

   in this app — nothing here simulates dice or turn-order logic. */
function effectiveWeapon(w, mod){
  if(!mod) return w;
  return {
    ...w,
    tags: [...(w.tags||[]), ...(mod.added_tags||[])],
    range: mod.added_range?.length ? [...(w.range||[]), ...mod.added_range] : (w.range||[]),
    damage: mod.added_damage?.length ? [...(w.damage||[]), ...mod.added_damage] : (w.damage||[]),

}
function weaponDisplayTags(w, curProfIdx){
  const hasProfiles = w.profiles && w.profiles.length;
  if(!hasProfiles) return w.tags||[];
  const idx = Math.min(curProfIdx!=null?curProfIdx:profileViewIdx, w.profiles.length-1);

/* Default unarmored pilot stats (Lancer core rules) — Armor-type pilot_gear
   overrides some of these via its bonuses[] array. Each bonus entry has an
   id (pilot_armor/pilot_hp/pilot_evasion/pilot_edef/pilot_speed), a val,
   and sometimes replace:true (the value REPLACES the base stat rather than
   adding to it — used for Evasion/E-Defense/Speed, since hardsuits set a
   fixed value rather than stacking). HP never replaces, only adds (shown
   as a "+N" bonus rather than an absolute total, matching the reference
   layout). A handful of items (e.g. the Madrigal boarding carapace) use a
   formula string like "7 + {grit}" instead of a plain number — those are
   shown as-is rather than evaluated, since this card has no pilot context. */
const PILOT_BASE_STATS = {armor:0, evasion:10, edef:10, speed:4};
const PILOT_BONUS_KEY = {pilot_armor:"armor", pilot_hp:"hp", pilot_evasion:"evasion", pilot_edef:"edef", pilot_speed:"speed"};
function pilotGearStatValues(g){
  const out = {...PILOT_BASE_STATS, hp:0};
  (g.bonuses||[]).forEach(b=>{
    const key = PILOT_BONUS_KEY[b.id];
    if(!key) return;
    if(key==="hp"){ out.hp = (typeof b.val==="number" && typeof out.hp==="number") ? out.hp+b.val : b.val; return; }
    if(b.replace) out[key] = b.val;
    else out[key] = (typeof b.val==="number" && typeof out[key]==="number") ? out[key]+b.val : b.val;

}

/* Restores a frame's integrated weapon after it was removed from its
   Integrated mount. Uses the exact same list→detail flow as the normal
   weapon picker (view toggle, inline expand, tag glossary, profile
   switching all work identically) — the only difference is the list
   contains exactly one weapon: the one built into this frame. */
/* Pilot gear picker — one shared function for all three slot kinds (armor/
   weapon/gear), filtered by pilot_gear's own "type" field. No license gate
   (pilot loadout isn't license-restricted in Lancer) and no profiles, so
   this is simpler than openWeaponPicker: just a searchable list -> install.
   `slotKind` is "Armor"|"Weapon"|"Gear"; `onInstall(id)` does the actual
   state write for whichever of the three arrays/slot it came from. */
function openPilotGearPicker(slotKind, onInstall){
  pgExpanded=null;
  let pgSearch="";

  const install=id=>{ onInstall(id); closeModal(); render(); };

  const drawDetail=(id)=>{
    const g=M.gear[id];
    setModalBody(
      `<button class="ghostbtn mb-14" id="pg-back">← Назад к списку</button>`
      + pilotGearCardHTML(g) +
      `<button class="ghostbtn block mt-16" id="pg-install">✓ Установить это снаряжение</button>`);
    wireTagGlossary("#pg-tags", "#pg-tagdesc", g.tags||[]);
    $("#pg-back").onclick=drawList;
    $("#pg-install").onclick=()=>install(g.id);
  };

  const drawList=(keepScroll)=>{
    const mbd=$("#modal .mbd");
    const savedScroll = keepScroll ? mbd.scrollTop : null;
    const list=L.pilot_gear.filter(g=>g.type===slotKind && !(g.tags||[]).includes("Exotic Gear"))
      .filter(g=>!pgSearch||(g.name+" "+(g.tags||[]).map(trTag).join(" ")).toLowerCase().includes(pgSearch.toLowerCase()))
      .sort((a,b)=>a.name.localeCompare(b.name));
    const label = slotKind==="Armor"?"броню":slotKind==="Weapon"?"оружие":"снаряжение";
    $("#modal .mhd h3").textContent=`Установить ${label}`;
    setModalBody(
      `<input class="input" id="pg-search" placeholder="поиск…" style="margin-bottom:14px" value="${esc(pgSearch)}">
       <div class="grid" id="pg-list" style="gap:8px"></div>`, keepScroll);
    $("#pg-list").innerHTML=list.map(g=>{
      const open=pgExpanded===g.id;
      const hasArmorStats = g.type==="Armor" && g.bonuses && g.bonuses.length;
      const hint = g.damage||g.range ? `${dmgStr(g)} · ${rngStr(g)}` : hasArmorStats ? pilotGearStatsInlineHTML(g) : tr(g.type);
      const row=`<div class="listrow clickable ${open?'open':''}" data-g="${g.id}">
        <div class="info"><div class="nm">${esc(g.name)}</div><div class="ds">${hint}</div></div>
        <span class="chevron">${open?'⌄':'›'}</span>
      </div>`;
      const expand=open?`<div class="expand-detail">${pilotGearCardBody(g)}
        <button class="ghostbtn block mt-14" id="pg-install-inline">✓ Установить это снаряжение</button></div>`:"";
      return `<div class="pickitem">${row}${expand}</div>`;
    }).join("")||`<div class="hint">// нет подходящего снаряжения</div>`;
    if(savedScroll!==null) mbd.scrollTop=savedScroll;

    const input=$("#pg-search");
    input.oninput=e=>{pgSearch=e.target.value; drawList(true); $("#pg-search").focus();};
    if(pgSearch) input.setSelectionRange(input.value.length,input.value.length);

    $$("#pg-list .listrow").forEach(it=>it.onclick=()=>{
      const id=it.dataset.g;
      pgExpanded = pgExpanded===id?null:id;
      drawList(true);
    });
    if(pgExpanded){
      const g=M.gear[pgExpanded];
      wireTagGlossary("#pg-tags", "#pg-tagdesc", g.tags||[]);
      $("#pg-install-inline").onclick=()=>install(g.id);
    }
  };

  modal("", "");
  drawList();
}

/* Mod picker for one equipped weapon slot — list of mods whose allowed_types
   includes this weapon's type and whose restricted_sizes doesn't exclude
   its mount. Flat inline-expand list (mods have no profiles/stances to
   switch between, so the fuller weapon-picker machinery isn't needed). */
let mpFilter="ALL", mpSearch="", mpExpanded=null;
function openModPicker(mi, wi){
  const slot=state.mech.mounts[mi].items[wi], w=M.weapon[slot.id];
  mpFilter="ALL"; mpSearch=""; mpExpanded=null;

  const install=id=>{ slot.mod=id; closeModal(); render(); };

  const drawDetail=(id)=>{
    const m=M.mod[id], lk=!unlocked(m);
    tagOpenSet=new Set();
    $("#modal .mhd h3").textContent=m.name;
    setModalBody(
      `<button class="ghostbtn mb-14" id="mp-back">← Назад к списку</button>`
      + modCardHTML(m) +
      `<button class="ghostbtn ${lk?'warn':''} block mt-16" id="mp-install">
        ${lk?"⚠ Установить всё равно (лицензия не открыта)":"✓ Установить этот мод"}
      </button>`);
    wireTagGlossary("#md-tags", "#md-tagdesc", m.tags||[]);
    $("#mp-back").onclick=drawList;
    $("#mp-install").onclick=()=>install(m.id);
  };

  const drawList=(keepScroll)=>{
    const mbd=$("#modal .mbd");
    const savedScroll = keepScroll ? mbd.scrollTop : null;
    const list=(L.mods||[]).filter(m=>modCompatible(m,w))
      .filter(m=>mpFilter==="ALL"?m.source!=="EXOTIC":m.source===mpFilter)
      .filter(m=>!mpSearch||(m.name+" "+m.source+" "+(m.tags||[]).map(trTag).join(" ")).toLowerCase().includes(mpSearch.toLowerCase()))

    $("#modal .mhd h3").textContent=`Установить мод · ${esc(w.name)}`;
    setModalBody(
      `<div class="hint" style="margin-bottom:10px">Совместимо с типом: ${tr(w.type)}</div>
       ${viewToggleHTML()}
       <div class="filters">${["ALL","GMS","IPS-N","SSC","HORUS","HA","EXOTIC"].map(s=>`<button class="chip ${mpFilter===s?'on':''}" data-mpf="${s}">${s==="ALL"?"ВСЕ":s}</button>`).join("")}</div>
       <input class="input" id="mp-search" placeholder="поиск модов…" style="margin-bottom:14px" value="${esc(mpSearch)}">
       <div class="grid" id="mp-list" style="gap:8px"></div>`, keepScroll);
    $("#mp-list").innerHTML=list.map(m=>{
      const lk=!unlocked(m);
      const open=pickerViewMode==="inline" && mpExpanded===m.id;
      const row=`<div class="listrow clickable ${lk?'locked':''} ${open?'open':''}" data-m="${m.id}">
        <div class="info"><div class="nm">${esc(m.name)}</div>
          <div class="ds">${esc(m.source)} · ${m.sp||0} SP</div></div>
        <div style="display:flex; align-items:center; gap:8px">
          ${m.license_level>0?`<span class="rowbadge ${lk?'lock':'unlocked'}">${lk?'🔒':'🔓'} ${esc(licenseDisplayName(m.license))} ${m.license_level}</span>`:""}
          <span class="chevron">${open?'⌄':'›'}</span>
        </div>
      </div>`;
      const expand=open?`<div class="expand-detail">${modCardBody(m)}
        <button class="ghostbtn ${lk?'warn':''} block mt-14" id="mp-install-inline">
          ${lk?"⚠ Установить всё равно (лицензия не открыта)":"✓ Установить этот мод"}
        </button></div>`:"";
      return `<div class="pickitem">${row}${expand}</div>`;
    }).join("")||`<div class="hint">// нет модов, совместимых с этим оружием</div>`;
    if(savedScroll!==null) mbd.scrollTop=savedScroll;

    wireViewToggle(drawList);
    $$(".modal .chip[data-mpf]").forEach(c=>c.onclick=()=>{mpFilter=c.dataset.mpf; drawList();});
    const input=$("#mp-search");
    input.oninput=e=>{mpSearch=e.target.value; drawList(); $("#mp-search").focus();};
    if(mpSearch) input.setSelectionRange(input.value.length,input.value.length);

    $$("#mp-list .listrow").forEach(it=>it.onclick=()=>{
      const id=it.dataset.m;
      if(pickerViewMode==="card"){ drawDetail(id); return; }
      mpExpanded = mpExpanded===id?null:id;
      drawList(true);
    });
    if(pickerViewMode==="inline" && mpExpanded){
      const m=M.mod[mpExpanded];
      wireTagGlossary("#md-tags", "#md-tagdesc", m.tags||[]);
      $("#mp-install-inline").onclick=()=>install(m.id);
    }
  };

  modal(`Установить мод · ${w.name}`, "");
  drawList();
}

/* Detail view for an already-installed mod — opened by clicking the mod

    `<button class="ghostbtn warn block mt-16" id="md-remove">✕ Убрать этот мод</button>`);

/* Full-card modal view for an already-installed weapon — opened by clicking
   the equipped row itself. The separate accordion toggle button (next to ✕)

   full-screen look with the same tag glossary / profile switching. */
function viewEquippedWeapon(mi, wi){
  const slot=state.mech.mounts[mi].items[wi];
  const w=M.weapon[slot.id];
  const ew=effectiveWeapon(w, slot.mod ? M.mod[slot.mod] : null);
  tagOpenSet=new Set(); profileViewIdx=0;
  const draw=()=>{
    modal(w.name, weaponCardHTML(ew) +

/* system picker — same inline/card toggle as weapons, but installing a
   system does NOT close the modal (per request): the list just refreshes
   (the newly-installed system drops out, since it's now in state.mech.systems),
   so several systems can be added in one sitting. */

    state.mech.systems.push(id);
    syExpanded=null;
    render();    // updates the loadout tab/HUD (SP counters) behind the modal
    drawList();  // refresh the picker itself; installed item drops out of the list

    $("#modal .mhd h3").textContent=s.name;

      `<button class="ghostbtn mb-14" id="sy-back">← Назад к списку</button>`

      .sort((a,b)=>(sourceOrder(a.source)-sourceOrder(b.source))||(unlocked(b)-unlocked(a))||a.name.localeCompare(b.name));

       <input class="input" id="sy-search" placeholder="поиск систем…" style="margin-bottom:14px" value="${esc(sySearch)}">
       <div class="grid" id="sy-list" style="gap:8px"></div>`, keepScroll);

      const lk=!unlocked(s);

        <div class="info"><div class="nm">${esc(s.name)}</div>
          <div class="ds">${esc(tr(s.type))} · ${s.sp} SP</div></div>
        <div style="display:flex; align-items:center; gap:8px">
          ${s.license_level>0?`<span class="rowbadge ${lk?'lock':'unlocked'}">${lk?'🔒':'🔓'} ${esc(licenseDisplayName(s.license))} ${s.license_level}</span>`:""}
          <span class="chevron">${open?'⌄':'›'}</span>
        </div>
      </div>`;
      const expand=open?`<div class="expand-detail">${systemCardBody(s)}
        <button class="ghostbtn block mt-14" id="sy-install-inline">
          ${lk?"⚠ Установить всё равно (лицензия не открыта)":"✓ Установить эту систему"}
        </button></div>`:"";
      return `<div class="pickitem">${row}${expand}</div>`;

/* ============ SUMMARY ============ */
function renderSummary(){
  const d=derived(); const p=state.pilot;
  const skills=Object.entries(state.skills).map(([id,v])=>`<li><span class="mk">+${v}</span> ${esc(skillInfo(id)?.name||id)}</li>`).join("")||"<li class='hint'>—</li>";
  const tals=Object.entries(state.talents).map(([id,v])=>`<li><span class="mk">${["I","II","III"][v-1]}</span> ${esc(M.talent[id]?.name||id)}</li>`).join("")||"<li class='hint'>—</li>";
  const cores=state.cores.map(id=>`<li><span class="mk">◆</span> ${esc(M.core[id]?.name||id)}</li>`).join("")||"<li class='hint'>—</li>";
  const hase=HASE.map(h=>`<div class="kv"><span class="k">${h.ru}</span><span>${state.hase[h.k]}</span></div>`).join("");
  let mechBlock=`<div class="hint">// шасси не выбрано</div>`;
  if(d.frame){
    const wlist=state.mech.mounts.flatMap(mt=>mt.items.map(slot=>{
      const w=M.weapon[slot.id], ew=effectiveWeapon(w, slot.mod?M.mod[slot.mod]:null);
      const modTag=slot.mod?` <span class="hint">+ ${esc(M.mod[slot.mod]?.name||"")}</span>`:"";

let coreFilter="ALL", coreSearch="";

/* Shared detail-card markup for a CORE bonus, used both when viewing an

function renderCore(){
  const d=derived();
  const capped=d.b.core.cap<1;
  $("#tab").innerHTML = sechead("// 08 · CORE-БОНУСЫ","CORE-бонусы",
      capped
        ? "CORE-бонусы открываются с LL3, и затем ещё по одному за каждые 3 уровня лицензий (LL6, LL9…)."
        : `Выбрано ${state.cores.length} из ${d.b.core.cap}. Бонусы конкретного производителя открываются, когда у вас есть 3+ ранга лицензии на любое шасси этого производителя — иначе доступны только бонусы GMS.`)
    + (capped ? "" : `
      <div id="core-selected"></div>
      <div class="filters" id="core-filters" style="margin-top:18px">${["ALL","GMS","IPS-N","SSC","HORUS","HA","EXOTIC"].map(s=>`<button class="chip ${coreFilter===s?'on':''}" data-cf="${s}">${s==="ALL"?"ВСЕ":s}</button>`).join("")}</div>
      <input class="input" id="core-search" placeholder="поиск CORE-бонусов…" style="margin:12px 0 14px" value="${esc(coreSearch)}">
      <div id="core-list"></div>`);
  if(capped) return;

  $("#core-selected").innerHTML = state.cores.length ? `<div class="mount">` + state.cores.map((id,ci)=>{
    const c=M.core[id];
    return `<div class="slot">
      <div class="equipped">
        <div class="ei clickable" data-viewcore="${ci}"><div class="en">${esc(c.name)}</div>
          <div class="em">${esc(c.source)}</div></div>
        <button class="xbtn" data-rmcore="${ci}" aria-label="Убрать CORE-бонус">✕</button>
      </div>
      <div style="margin-top:10px">${coreCardBody(c)}</div>
    </div>`;
  }).join("") + `</div>` : `<div class="hint">// CORE-бонусы не выбраны</div>`;

  $$("#core-selected .ei[data-viewcore]").forEach(el=>el.onclick=()=>viewSelectedCore(+el.dataset.viewcore));
  $$("#core-selected .xbtn[data-rmcore]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    state.cores.splice(+b.dataset.rmcore,1); render();
  });

  const drawList=()=>{
    const list=L.core_bonuses
      .filter(c=>!state.cores.includes(c.id))
      .filter(c=>coreFilter==="ALL"||c.source===coreFilter)
      .filter(c=>!coreSearch||(c.name+" "+c.source).toLowerCase().includes(coreSearch.toLowerCase()));
    // Group by manufacturer (GMS first, then IPS-N/SSC/HORUS/HA/EXOTIC in
    // that fixed order) — same layout as ШАССИ/ЛИЦЕНЗИИ: each source is its
    // own <div class="grid cards">, which is what forces the next
    // manufacturer's bonuses onto a new row instead of interleaving.
    const groups={};
    list.forEach(c=>(groups[c.source]=groups[c.source]||[]).push(c));
    const srcKeys=Object.keys(groups).sort((a,b)=>sourceOrder(a)-sourceOrder(b));
    const dNow=derived();
    const slotsFull=state.cores.length>=dNow.b.core.cap;
    $("#core-list").innerHTML = srcKeys.length ? srcKeys.map(src=>{
      const fr=groups[src].sort((a,b)=>(coreBonusUnlocked(b)-coreBonusUnlocked(a))||a.name.localeCompare(b.name));
      return `<h3 style="font-family:'Chakra Petch';font-size:16.5px;margin:20px 0 10px;color:${srcColor(src)}">// ${esc(SRC_NAME[src]||src)}</h3>
        <div class="grid cards">${fr.map(c=>{
          const unl=coreBonusUnlocked(c);
          const terse=(L.core_terse?.[c.id]?.[currentLang])||(L.core_terse?.[c.id]?.en)||"";
          return `<div class="item ${!unl?'locked':''}" data-c="${c.id}">
            <div class="src" style="background:${srcColor(c.source)}"></div>
            <div class="top"><div class="nm">${esc(c.name)}</div>
              <div class="badge ${unl?'mfg':'lock'}" ${unl?`style="--src:${srcColor(c.source)}"`:''}>${unl?esc(c.source):"🔒 "+esc(c.source)+" 3+"}</div></div>
            ${terse?`<div class="desc" style="margin-top:8px">${esc(terse)}</div>`:""}
            <button class="ghostbtn ${slotsFull?'':(unl?'':'warn')}" data-pickcore="${c.id}" ${slotsFull?"disabled":""}
              style="margin-top:11px; width:100%; text-align:center">${slotsFull?`⚠ Лимит исчерпан (${state.cores.length}/${dNow.b.core.cap})`:(unl?"✓ Выбрать этот CORE-бонус":"⚠ Выбрать всё равно")}</button>
          </div>`;
        }).join("")}</div>`;
    }).join("") : `<div class="hint">// нет доступных CORE-бонусов по этому запросу</div>`;
    $$("#core-list .item").forEach(it=>it.onclick=()=>openCoreDetail(it.dataset.c));
    $$("#core-list [data-pickcore]").forEach(b=>b.onclick=e=>{
      e.stopPropagation();
      const id=b.dataset.pickcore, dd=derived();
      if(state.cores.length>=dd.b.core.cap) return;
      state.cores.push(id); render();
    });
  };
  $$("#core-filters .chip").forEach(ch=>ch.onclick=()=>{
    coreFilter=ch.dataset.cf;
    $$("#core-filters .chip").forEach(x=>x.classList.toggle("on",x.dataset.cf===coreFilter));
    drawList();
  });
  const input=$("#core-search");
  input.oninput=e=>{coreSearch=e.target.value; drawList();};
  drawList();
}

/* ============ MODAL ============ */
/* Every place that redraws the modal body (picker lists, "back to list",
   detail views, profile-chip re-renders, etc.) must reset scroll — not just
   the initial modal() call. Those redraws bypass modal() and write to
   .mbd.innerHTML directly (see openWeaponPicker/openSystemPicker/
   openModPicker/viewLicenseItemPreview), so scroll position from whatever
   was previously shown there would otherwise carry over. Use this instead
   of touching #modal .mbd innerHTML by hand. */
/* keepScroll=true means the CALLER is handling scroll capture/restore
   itself (see drawList() in the pickers — it saves mbd.scrollTop before
   calling this, then restores it after the list is fully populated, since
   restoring too early — before the real rows exist — gets clamped back to
   ~0 by the browser). In that case this function must not touch scroll at
   all, including the deferred rAF reset in resetModalScroll(): that reset
   fires on the *next frame*, i.e. after the caller's restore, and would
   silently undo it. Only genuine navigation (no keepScroll) gets the full
   reset treatment. */
function setModalBody(html, keepScroll){
  const mbd=$("#modal .mbd");
  mbd.innerHTML=html;
  if(!keepScroll) resetModalScroll();
}
/* Plain synchronous scrollTop=0 isn't always enough: openFrame() etc. still
   mutate .mhd (inserting the "ВЫБРАТЬ..." button) *after* modal()/
   setModalBody() already ran, and floated portrait images can resize the
   layout once they finish loading — either can nudge scroll back down a
   moment later, including via the browser's own scroll-anchoring trying to
   "helpfully" preserve visual position across that layout shift. Resetting
   again on the next frame (after all of that has settled) closes both
   gaps; overflow-anchor:none on the containers (see CSS) belts-and-braces
   it by turning off anchoring for these two entirely. */
function resetModalScroll(){
  const mbd=$("#modal .mbd"), mo=$("#modal");
  mbd.scrollTop=0; mo.scrollTop=0;
  requestAnimationFrame(()=>{ mbd.scrollTop=0; mo.scrollTop=0; });
}
let modalReturnFocus=null;
function modal(title,html){
  const mhd=$("#modal .mhd");
  // Reset the header to just [h3, close button] on every open — openFrame(),
  // openLicenseDetail() etc. inject extra buttons (e.g. "ВЫБРАТЬ ЭТО ШАССИ")
  // directly into .mhd, and since the modal's DOM persists between opens
  // (only toggled via a CSS class), those buttons would otherwise pile up
  // one per open instead of being replaced.
  [...mhd.children].forEach(el=>{
    if(el.tagName!=="H3" && !el.classList.contains("mclose")) el.remove();
  });
  mhd.querySelector("h3").textContent=title;
  setModalBody(html);
  modalReturnFocus=document.activeElement;
  $("#modal").classList.add("show");
  const panel=$("#modal .panel");
  const focusable=panel.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
  (focusable[0]||panel).focus();
}
function closeModal(){
  $("#modal").classList.remove("show");
  $("#modal .panel").classList.remove("narrow");
  if(modalReturnFocus){ modalReturnFocus.focus(); modalReturnFocus=null; }
}

/* ============ DIALOGS ============ */
/* Confirmation for anything that destroys work. It replaces confirm(), which
   could neither name what disappears nor look like it belongs to this
   product. Actions run least-destructive first — that ordering is also the
   focus order, since modal() focuses the first control. Escape, the close
   button and Отмена all cancel. */
function confirmDialog({title, lead, losses, actions}){
  const list=(losses&&losses.length)
    ? `<ul class="losslist ${losses.length>8?"scroll":""}">${losses.map(t=>
        typeof t==="string" ? `<li>${esc(t)}</li>` : `<li class="${t.kind||""}">${esc(t.text)}</li>`
      ).join("")}</ul>` : "";
  modal(title, `<div class="dialog">
    <p>${rich(lead)}</p>
    ${list}
    <div class="dialog-actions">
      ${actions.map((a,i)=>`<button class="ghostbtn ${a.danger?"warn":""}" data-act="${i}">${esc(a.label)}</button>`).join("")}
      <button class="ghostbtn" data-act="cancel">Отмена</button>
    </div>
  </div>`);
  $("#modal .panel").classList.add("narrow");
  $$("#modal [data-act]").forEach(b=>{
    b.onclick=()=>{
      const k=b.dataset.act;
      closeModal();
      if(k!=="cancel") actions[+k].run();
    };
  });
}
/* Non-destructive report: something already happened, the user only needs to
   know what. Same shell as confirmDialog so the two read as one component. */
function notice(title, lead, items, kind){
  const cls = kind==="plain" ? "plain" : "drop";
  const list=(items&&items.length)
    ? `<ul class="losslist ${items.length>8?"scroll":""}">${items.map(t=>`<li class="${cls}">${esc(t)}</li>`).join("")}</ul>` : "";
  modal(title, `<div class="dialog">
    <p>${rich(lead)}</p>
    ${list}
    <div class="dialog-actions"><button class="ghostbtn" data-act="ok">Понятно</button></div>
  </div>`);
  $("#modal .panel").classList.add("narrow");
  $("#modal [data-act=ok]").onclick=closeModal;
}
function reportDropped(title, dropped){
  notice(title,
    `Часть сборки не удалось восстановить: этих записей нет в загруженных данных. Обычно это значит, что сборка сделана с другим набором контент-паков или в другой версии реестра. Остальное на месте.`,
    dropped);
}
document.addEventListener("keydown", e=>{
  if(!$("#modal").classList.contains("show")) return;
  if(e.key==="Escape"){ closeModal(); return; }
  if(e.key==="Tab"){
    const panel=$("#modal .panel");
    const focusable=[...panel.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')]
      .filter(el=>!el.disabled && el.offsetParent!==null);
    if(!focusable.length) return;
    const first=focusable[0], last=focusable[focusable.length-1];
    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
});

/* ============ EXPORT / IMPORT ============ */
function exportBuild(){
  const data=JSON.stringify({_app:"lancer-registry",v:1,state},null,2);
  const blob=new Blob([data],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`${(state.pilot.callsign||"pilot").replace(/\s+/g,"_")}_lancer.json`;
  a.click(); URL.revokeObjectURL(a.href);
}
function importBuild(file){
  const r=new FileReader();
  r.onerror=()=>notice("Файл не прочитан",
    "Браузер не смог прочитать этот файл. Проверьте, что он не удалён и не открыт в другой программе.");
  r.onload=()=>{
    let d=null;
    try{ d=JSON.parse(r.result); }catch(e){ d=null; }
    if(!d || typeof d!=="object" || !d.state){
      notice("Файл не распознан",
        "Это не файл сборки реестра. Загрузите файл, который выгружает кнопка <b>⬇ СОХРАНИТЬ</b> — обычно это что-то вроде <b>ПОЗЫВНОЙ_lancer.json</b>.");
      return;
    }
    const apply=()=>{
      const dropped=applyBuildState(d.state);
      activeTab="pilot";
      render();
      if(dropped.length) reportDropped("Сборка загружена частично", dropped);
    };
    // Overwriting an empty build costs nothing; overwriting real work does.
    if(buildIsEmpty()){ apply(); return; }
    confirmDialog({
      title:"Загрузка сборки",
      lead:"Загруженная сборка заменит текущую. Текущая сборка не сохранится нигде, кроме уже выгруженных файлов.",
      losses:buildLossSummary(),
      actions:[
        {label:"⬇ Сначала выгрузить текущую", run:exportBuild},
        {label:"⬆ Заменить сборку", danger:true, run:apply},
      ],
    });
  };
  r.readAsText(file);
}

/* ============ SHEET VIEW ============
   A deck of reference cards. The editor answers "what can I take"; this
   answers "what does the thing I took do", mid-combat, without a single
   control that could change the build. Mechanics only — flavour and
   descriptions stay in the editor, where there is time to read them. */
const shDmg = w => (w.damage||[]).map(x=>`${x.val} ${trTag(x.type)}`).join(" + ");
const shRng = w => (w.range||[]).map(x=>`${tr(x.type)} ${x.val}`).join(" · ");
const shTags = tags => (tags||[]).length
  ? `<div class="row">${tags.map(t=>`<span class="tag">${esc(trTag(t))}</span>`).join("")}</div>` : "";
function shEff(label, html){
  return html ? `<div class="eff"><b>${label}</b>${rich(html)}</div>` : "";
}
function shKey(k, v){ return `<span class="keystat"><span class="k">${k}</span>${esc(String(v))}</span>`; }

/* Every rule the build breaks. The app already knows all of this — tabWarn(),
   unlocked() and talentRankCap() have known it for eight tabs — the sheet is
   simply where it finally gets said out loud. */
function buildViolations(){
  const d=derived(), out=[];
  const over=(b,label)=>{ if(b.used>b.cap) out.push(`${label}: ${(+b.used.toFixed(1))} из ${b.cap}`); };
  over(d.b.skill,"Перебор навыков");
  over(d.b.talent,"Перебор талантов");
  over(d.b.hase,"Перебор мех-навыков");
  over(d.b.license,"Перебор лицензий");
  if(d.b.core.cap>0 && state.cores.length>d.b.core.cap)
    out.push(`Перебор CORE-бонусов: ${state.cores.length} из ${d.b.core.cap}`);
  if(d.mech && d.sp.used>d.sp.cap)
    out.push(`Перебор системных очков: ${d.sp.used} из ${d.sp.cap} SP`);
  const cap=talentRankCap(d.ll);
  Object.entries(state.talents).forEach(([id,v])=>{
    if(v>cap && M.talent[id]) out.push(`${M.talent[id].name}: ранг ${["I","II","III"][v-1]} выше доступного на LL${d.ll}`);
  });
  if(d.frame && !frameUnlocked(d.frame)) out.push(`Шасси ${dispName(d.frame)} — лицензия не открыта`);
  (state.mech.mounts||[]).forEach(mt=>(mt.items||[]).forEach(s=>{
    const w=M.weapon[s.id];
    if(w && !unlocked(w)) out.push(`${w.name} — лицензия не открыта`);
    const md=s.mod&&M.mod[s.mod];
    if(md && !unlocked(md)) out.push(`${md.name} — лицензия не открыта`);
  }));
  (state.mech.systems||[]).forEach(id=>{
    const sy=M.system[id];
    if(sy && !unlocked(sy)) out.push(`${sy.name} — лицензия не открыта`);
  });
  return out;
}

const SHEET_STATS=["hp","armor","evasion","edef","heatcap","speed","size","save","sensor_range","tech_attack","repcap"];
function statStripHTML(d){
  const cells=SHEET_STATS.map(k=>{
    const base=d.frame&&d.frame.stats?d.frame.stats[k]:null;
    const up = base!=null && d.mech[k]!==base;
    return `<div class="cell ${up?"up":""}"><span class="k">${esc(L.stat_labels?.[k]||STAT_RU[k][0])}</span>
      <span class="v">${esc(String(d.mech[k]))}</span></div>`;
  }).join("");
  const sp=`<div class="cell"><span class="k">SP</span><span class="v">${d.sp.used}/${d.sp.cap}</span></div>`;
  return `<div class="statstrip">${cells}${sp}</div>`;
}

  const head=`

    <div class="dossier">
      <h1 class="dossier-id">
        <span class="cs">${esc(p.callsign||"БЕЗЫМЯННЫЙ")}</span>
        <span class="nm">${esc(p.name||"имя не задано")}${bg?" · "+esc(bg.name):""}</span>
        <span class="ll">LL${d.ll} · GRIT +${d.grit}</span>
      </h1>
      ${d.frame?`<div class="dossier-frame">ШАССИ <b>${esc(dispName(d.frame))}</b> · ${esc(SRC_NAME[d.frame.source]||d.frame.source)} · ${d.frame.mechtype.map(tr).join(" / ")}</div>
        ${statStripHTML(d)}`:`<div class="dossier-frame">ШАССИ НЕ ВЫБРАНО</div>`}
      <div class="stamp ${viol.length?"dev":""}">
        <span>${viol.length?"⚠":"✓"}</span>
        <div class="body">${viol.length?`ДОПУСК: С ОТКЛОНЕНИЯМИ (${viol.length})
          <ul>${viol.map(v=>`<li>${esc(v)}</li>`).join("")}</ul>`:"ДОПУСК ПОДТВЕРЖДЁН — сборка в пределах правил"}</div>
      </div>
    </div>`;

  const weaponCards=[];
  (state.mech.mounts||[]).forEach(mt=>(mt.items||[]).forEach(s=>{
    const w=M.weapon[s.id];
    if(w) weaponCards.push(weaponCardHTML(w, mt.type, s.mod?M.mod[s.mod]:null));
  }));

  const skillLines=Object.entries(state.skills).map(([id,v])=>{
    const s=skillInfo(id); return s?`${esc(s.name)} +${v}`:null;
  }).filter(Boolean);
  const haseLines=HASE.filter(h=>state.hase[h.k]).map(h=>`${h.ru} ${state.hase[h.k]} — ${h.eff}`);
  const pilotCard=(skillLines.length||haseLines.length)?`<article class="dcard">
    <div class="src" style="background:var(--accent)"></div>
    <div class="hd"><span class="nm">Пилот и мех-навыки</span><span class="slot">СВОДКА</span></div>
    ${haseLines.length?`<div class="eff"><b>МЕХ-НАВЫКИ</b>${haseLines.map(esc).join("<br>")}</div>`:""}
    ${skillLines.length?`<div class="eff"><b>ТРИГГЕРЫ НАВЫКОВ</b>${skillLines.join(" · ")}</div>`:""}
  </article>`:"";

  const body = (!d.frame && !skillLines.length && !haseLines.length && !state.gear.armor)
    ? `<div class="sheet-empty">// СБОРКА ПУСТА<br>вернитесь в редактор и начните с уровня лицензии</div>`
    : deckSection("ВООРУЖЕНИЕ", weaponCards)
      + deckSection("СИСТЕМЫ", (state.mech.systems||[]).map(id=>M.system[id]?systemCardHTML(M.system[id]):null))
      + deckSection("CORE", [d.frame?coreSystemCardHTML(d.frame):null, ...state.cores.map(coreBonusCardHTML)])
      + deckSection("ТАЛАНТЫ", Object.entries(state.talents).map(([id,v])=>talentCardHTML(id,v)))
      + deckSection("СНАРЯЖЕНИЕ ПИЛОТА", [state.gear.armor, ...state.gear.weapons, ...state.gear.gear].map(gearCardHTML))
      + deckSection("ПИЛОТ", [pilotCard]);

  $("#sheet").innerHTML = head + body;
}

/* ---- share link ---- */
const SHARE_V = 1;
const b64uEnc = bytes => {
  let s=""; const CH=0x8000;
  for(let i=0;i<bytes.length;i+=CH) s+=String.fromCharCode.apply(null, bytes.subarray(i,i+CH));
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
};
const b64uDec = str => {
  const t=str.replace(/-/g,"+").replace(/_/g,"/");
  const bin=atob(t + "=".repeat((4 - t.length%4) % 4));
  return Uint8Array.from(bin, c=>c.charCodeAt(0));
};
/* Only ids and numbers travel: empty fields are omitted entirely, so a
   typical build compresses to well under a kilobyte and survives being
   pasted into any messenger. */
function packBuild(){
  const p=state.pilot, o={v:SHARE_V};
  if(p.name) o.n=p.name;
  if(p.callsign) o.c=p.callsign;
  if(p.background) o.b=p.background;
  if(p.ll) o.l=p.ll;
  if(Object.keys(state.skills).length) o.s=state.skills;
  if(state.customSkills.length) o.cs=state.customSkills.map(x=>[x.id,x.name,x.description||""]);
  if(Object.keys(state.talents).length) o.t=state.talents;
  const h=HASE.map(x=>state.hase[x.k]);
  if(h.some(Boolean)) o.h=h;
  const lic=Object.entries(state.licenses).filter(([,v])=>v);
  if(lic.length) o.lc=Object.fromEntries(lic);
  if(state.gear.armor) o.ga=state.gear.armor;
  if(state.gear.weapons.length) o.gw=state.gear.weapons;
  if(state.gear.gear.length) o.gg=state.gear.gear;
  if(state.cores.length) o.cb=state.cores;
  if(state.mech.frameId){
    o.f=state.mech.frameId;
    o.m=(state.mech.mounts||[]).map(mt=>[mt.type,(mt.items||[]).map(s=>s.mod?[s.id,s.mod]:[s.id])]);
    if(state.mech.systems.length) o.sy=state.mech.systems;
  }
  return o;
}
function unpackBuild(o){
  if(!o || typeof o!=="object") return null;
  return {
    pilot:{name:o.n||"", callsign:o.c||"", background:o.b||"", ll:o.l||0},
    skills:o.s||{},
    customSkills:(o.cs||[]).map(a=>({id:a[0], name:a[1], description:a[2]||""})),
    talents:o.t||{},
    hase:HASE.reduce((acc,x,i)=>{ acc[x.k]=(o.h&&o.h[i])||0; return acc; },{}),
    licenses:o.lc||{},
    gear:{armor:o.ga||null, weapons:o.gw||[], gear:o.gg||[]},
    cores:o.cb||[],
    mech:{
      frameId:o.f||null,
      mounts:(o.m||[]).map(a=>({type:a[0], items:(a[1]||[]).map(s=>({id:s[0], mod:s[1]||null}))})),
      systems:o.sy||[],
    },
  };
}
/* deflate-raw ships in every current browser and needs no library, which is
   what keeps this project build-step-free. The "u" prefix is the honest
   fallback for anything that lacks it. */
async function encodeShare(){
  const bytes=new TextEncoder().encode(JSON.stringify(packBuild()));
  if(typeof CompressionStream==="function"){
    try{
      const stream=new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));
      const buf=await new Response(stream).arrayBuffer();
      return "z"+b64uEnc(new Uint8Array(buf));
    }catch(e){ console.warn("[Lancer Registry] сжатие недоступно, ссылка будет длиннее:", e); }
  }
  return "u"+b64uEnc(bytes);
}
async function decodeShare(payload){
  const flag=payload[0], body=b64uDec(payload.slice(1));
  let bytes=body;
  if(flag==="z"){
    if(typeof DecompressionStream!=="function") throw new Error("DecompressionStream не поддерживается");
    const stream=new Blob([body]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    bytes=new Uint8Array(await new Response(stream).arrayBuffer());
  } else if(flag!=="u") throw new Error("неизвестный формат ссылки");
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function shareSheetLink(){
  try{
    const payload=await encodeShare();
    const url=`${location.origin}${location.pathname}?s=${payload}`;
    let copied=false;
    try{ await navigator.clipboard.writeText(url); copied=true; }catch(e){ copied=false; }
    notice("Ссылка на лист",
      copied ? "Ссылка скопирована. Открывший её увидит только лист — его собственная сборка не пострадает."
             : "Скопируйте ссылку вручную. Открывший её увидит только лист — его собственная сборка не пострадает.",
      [url], "plain");
  }catch(e){
    console.error(e);
    notice("Ссылку собрать не удалось", "Не получилось упаковать сборку в адрес. Выгрузите её файлом кнопкой <b>⬇ СОХРАНИТЬ</b>.");
  }
}
/* Reads ?s=… once at startup. A shared build is read-only by construction:
   sheetSource stays "shared", which is what stops saveBuildNow() from
   overwriting the reader's own work. */
async function consumeShareLink(){
  const m=/[?&]s=([^&]+)/.exec(location.search);
  if(!m) return null;
  history.replaceState(null, "", location.pathname);
  try{
    const raw=await decodeShare(decodeURIComponent(m[1]));
    const built=unpackBuild(raw);
    if(!built) throw new Error("пустая сборка");
    const dropped=applyBuildState(built);
    sheetSource="shared";
    viewMode="sheet";
    return {dropped};
  }catch(e){
    console.error("[Lancer Registry] ссылка не прочитана:", e);
    return {failed:true};
  }
}
function setViewMode(mode){
  viewMode = mode==="sheet" ? "sheet" : "build";
  if(sheetSource!=="shared"){
    try{ localStorage.setItem("view_mode", viewMode); }catch(e){}
  }
  window.scrollTo({top:0});
  render();
}
/* Leaving a shared sheet is not "switching tabs": the build on screen was
   never the reader's. Dropping it and restoring their own autosave is the
   only exit that cannot lose someone's work. */
function exitSheet(){
  if(sheetSource==="shared"){
    sheetSource="own";
    Object.assign(state, defaultState());
    const saved=loadSavedBuild();
    if(saved){
      applyBuildState(saved.state);
      lastSaveAt = saved.savedAt ? new Date(saved.savedAt) : null;
      if(isNaN(lastSaveAt)) lastSaveAt=null;
    }
    renderSaveState();
  }
  setViewMode("build");
}
function syncModeChrome(){
  const sheet=viewMode==="sheet";
  const foreign=sheetSource==="shared";
  document.body.classList.toggle("sheetmode", sheet);
  $("#sheet").hidden=!sheet;
  $("#t-sheet").textContent = sheet ? (foreign?"◀ МОЯ СБОРКА":"◀ РЕДАКТОР") : "▤ ЛИСТ";
  $("#t-link").hidden=!sheet;
  $("#t-print").hidden=!sheet;
  // Nothing that changes the build belongs beside a read-only sheet. Export
  // stays: writing the file out is how a GM keeps someone else's build.
  ["#t-import","#t-reset"].forEach(sel=>{ $(sel).hidden=sheet; });
}

/* ============ TOPBAR WIRING ============ */
function wireTopbar(){
  $("#t-export").onclick=exportBuild;
  $("#t-import").onclick=()=>$("#import-file").click();
  $("#import-file").onchange=e=>{ const f=e.target.files[0]; e.target.value=""; if(f) importBuild(f); };
  $("#t-reset").onclick=()=>{
    if(buildIsEmpty()){
      notice("Сбрасывать нечего", "Сборка и так пуста.");
      return;
    }
    confirmDialog({
      title:"Сброс сборки",
      lead:"Сброс очистит всё и перезапишет автосохранение в этом браузере. Отменить это будет нельзя.",
      losses:buildLossSummary(),
      actions:[
        {label:"⬇ Сначала выгрузить в файл", run:exportBuild},
        {label:"⟲ Сбросить всё", danger:true, run:()=>{
          Object.assign(state, defaultState());
          activeTab="pilot";
          render();
        }},
      ],
    });
  };
  $("#modal").onclick=e=>{ if(e.target.id==="modal"||e.target.classList.contains("mclose")) closeModal(); };
  $("#t-sheet").onclick=()=>{ if(viewMode==="sheet") exitSheet(); else setViewMode("sheet"); };
  $("#t-link").onclick=shareSheetLink;
  $("#t-print").onclick=()=>window.print();
}

/* ============ BOOT ============ */
function boot(onDone){
  const lines=["ИНИЦИАЛИЗАЦИЯ COMP/CON…","ЗАГРУЗКА РЕЕСТРА UNION…",
    `СИНХРОНИЗАЦИЯ: ${L.frames.length} ШАССИ · ${L.weapons.length} ОРУЖИЯ · ${L.systems.length} СИСТЕМ`,
    "ДОСТУП РАЗРЕШЁН ▸"];
  const el=$("#boot .blog"); let i=0;
  const tick=()=>{ if(i<lines.length){ el.textContent=lines[i++]; setTimeout(tick,360); }
    else setTimeout(()=>{
      $("#boot").classList.add("done");
      // The overlay sits at z-index 200, above the modal — anything that has
      // to be said about the restored build waits until it has faded out.
      if(onDone) setTimeout(onDone, 520);
    },320); };
  tick();
}

/* ============ LANGUAGE SWITCH ============ */
function wireLangSwitch(){
  const btn=$("#t-lang");
  if(!btn) return;
  btn.textContent = currentLang==="ru" ? "EN / RU" : "RU / EN";
  btn.onclick = async ()=>{
    const next = currentLang==="ru" ? "en" : "ru";
    btn.disabled = true; btn.textContent="…";
    try{
      L = await fetchAndLocalize(next);
      rebuildIndexes();
      wireLangSwitch();
      render();
    } finally { btn.disabled = false; }
  };
}

/* ============ INIT ============ */
(async function startApp(){
  try{
    L = await fetchAndLocalize(currentLang);
  }catch(e){
    console.error(e);
    return; // loadBaseData() already showed an error message in the DOM
  }
  rebuildIndexes();

  // A share link wins over the stored build: the reader asked to see that
  // one, and their own work stays untouched in localStorage meanwhile.
  let restoreReport=null, linkFailed=false;
  const shared=await consumeShareLink();
  if(shared){
    if(shared.failed) linkFailed=true;
    else if(shared.dropped.length) restoreReport=shared.dropped;
  } else {
    // Restore before the first render, so the app never flashes an empty
    // build over work that is actually still there.
    const saved=loadSavedBuild();
    if(saved){
      const dropped=applyBuildState(saved.state);
      lastSaveAt = saved.savedAt ? new Date(saved.savedAt) : null;
      if(isNaN(lastSaveAt)) lastSaveAt=null;
      if(dropped.length) restoreReport=dropped;
    }
  }

  wireTopbar();
  wireLangSwitch();
  render();
  renderSaveState();
  boot(()=>{
    if(linkFailed) notice("Ссылка не прочитана",
      "Адрес повреждён или собран другой версией реестра. Попросите прислать ссылку заново или файл сборки.");
    else if(restoreReport) reportDropped(sheetSource==="shared"?"Сборка открыта частично":"Сборка восстановлена частично", restoreReport);
  });
})();
