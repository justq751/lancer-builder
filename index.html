<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="page.title">LANCER // РЕЕСТР — конструктор меха и пилота</title>
<meta name="description" data-i18n-attr="content:page.description" content="Конструктор пилота и меха для настольной ролевой игры Lancer. Данные: massif-press/lancer-data.">
<!-- The loader runs from scripts at the end of <body>, so nothing would be
     requested until they are fetched and executed. These four files are
     1.5MB of the 2.2MB payload and are always needed; starting them during
     parse overlaps network with parsing instead of queueing behind it. The
     rest are small enough to ride the same wave. -->
<link rel="preload" as="fetch" type="application/json" href="data/lancer-data.json" crossorigin>
<link rel="preload" as="fetch" type="application/json" href="locales/ru/systems.json" crossorigin>
<link rel="preload" as="fetch" type="application/json" href="locales/ru/frames.json" crossorigin>
<link rel="preload" as="fetch" type="application/json" href="locales/ru/talents.json" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/sheet.css">
</head>
<body>

<div id="boot">
  <div class="ring"></div>
  <div class="blog">…</div>
  <div class="ttl">LANCER · UNION REGISTRY</div>
</div>

<a class="skip" href="#tab" data-i18n="a11y.skip">Skip to content</a>

<header class="topbar">
  <div class="brand">
    <span class="sig mono">//</span>
    <span class="name">LANCER <b data-i18n="brand.name">REGISTRY</b></span>
    <span class="ver mono">COMP/CON v1</span>
  </div>
  <div class="spacer"></div>
  <span class="savestate" id="savestate" aria-live="polite"></span>
  <button class="toolbtn mode" id="t-sheet">▤ SHEET</button>
  <!-- Wide screens: the menu is display:contents, so its buttons sit in the
       header row as before. Narrow (≤1020px): it is a popover behind ⋯ — the
       header is one row and the rare actions stop costing a screen row. -->
  <button class="toolbtn more" id="t-more" popovertarget="more-menu" data-i18n-attr="aria-label:topbar.more" aria-label="More actions">⋯</button>
  <div class="moremenu" id="more-menu" popover>
    <button class="toolbtn" id="t-link" hidden><span>🔗 <span data-i18n="topbar.link">LINK</span></span></button>
    <button class="toolbtn" id="t-print" hidden><span>🖨 <span data-i18n="topbar.print">PRINT</span></span></button>
    <!-- Shows the state (RU, EN, or "RU · EN" = interface · data); opens the
         panel with the two independent settings (ADR 0005). -->
    <button class="toolbtn" id="t-lang" popovertarget="lang-panel">RU</button>
    <div class="langpanel" id="lang-panel" popover>
      <div class="lp-hd mono"><b>//</b> <span data-i18n="lang.title">LANGUAGE</span></div>
      <fieldset class="langrow" id="lang-ui">
        <legend data-i18n="lang.ui">INTERFACE</legend>
        <label><input type="radio" name="ui-lang" value="ru"><span>RU · <span lang="ru" data-i18n="lang.native.ru"></span></span></label>
        <label><input type="radio" name="ui-lang" value="en"><span>EN · <span lang="en" data-i18n="lang.native.en">English</span></span></label>
      </fieldset>
      <fieldset class="langrow" id="lang-data">
        <legend data-i18n="lang.data">GAME DATA</legend>
        <label><input type="radio" name="data-lang" value="ru"><span>RU · <span lang="ru" data-i18n="lang.native.ru"></span></span></label>
        <label><input type="radio" name="data-lang" value="en"><span>EN · <span lang="en" data-i18n="lang.native.en">English</span></span></label>
      </fieldset>
      <p class="hint" data-i18n="lang.data_hint"></p>
    </div>
    <button class="toolbtn" id="t-import"><span>⬆ <span data-i18n="topbar.import">LOAD</span></span></button>
    <button class="toolbtn" id="t-export"><span>⬇ <span data-i18n="topbar.export">SAVE</span></span></button>
    <button class="toolbtn warn" id="t-reset"><span>⟲ <span data-i18n="topbar.reset">RESET</span></span></button>
  </div>
  <input type="file" id="import-file" accept="application/json" hidden>
</header>

<div class="shell">
  <!-- Wide screens: the sticky sidebar. Narrow: a bottom sheet (popover)
       opened from the budget ledger in the dock. -->
  <aside class="hud" id="hud" popover data-i18n-attr="aria-label:hud.aria" aria-label="Pilot registry"></aside>
  <main>
    <!-- The editor's one h1 (the sheet has its own: the callsign). Read by
         screen readers as the page's title; the tab's h2 follows it. -->
    <h1 class="sr" data-i18n="a11y.editor_h1">Pilot and mech build editor</h1>
    <!-- Wide screens: display:contents — the tab row heads the content as
         before. Narrow: fixed to the bottom, in thumb reach, with the budget
         ledger above it. -->
    <div class="dock" id="dock">
      <button class="ledger" id="ledger" popovertarget="hud" aria-controls="hud"></button>
      <nav class="tabs" id="tabs" role="tablist"></nav>
    </div>
    <div id="tab" class="section show" role="tabpanel" tabindex="-1"></div>
  </main>
</div>

<div id="sheet" class="sheetview" tabindex="-1" hidden></div>

<div id="print-sheet" style="display:none"></div>

<div class="modal" id="modal">
  <div class="panel" role="dialog" aria-modal="true">
    <div class="mhd"><h3></h3><button class="toolbtn mclose"><span>✕ <span data-i18n="common.close">CLOSE</span></span></button></div>
    <div class="mbd"></div>
  </div>
</div>

<!-- Single global stat-glossary tooltip, kept as a direct child of <body>
     (outside every panel/card). Any tooltip nested inside a card can end up
     clipped or out-stacked by that card's own rendering context in some
     browsers even with position:fixed, if an ancestor sets a property that
     creates a new containing block (filter/transform/etc.) — living at the
     top level sidesteps that class of bug entirely. See wireStatTooltips(). -->
<div class="stattip-box" id="global-stattip" popover="manual"></div>

<!-- Plain (non-module) scripts sharing one global scope, executed in this
     order — it is the order the code had as one inline script, and later files
     use top-level names from earlier ones. Add a file in its place in this
     list, and to SITE_PATHS-covered folders only (css/, js/). js/core/ holds
     the DOM-free logic that tests/unit/ loads under Node. -->
<script src="js/core/i18n.js"></script>
<script src="js/core/build.js"></script>
<script src="js/core/rules.js"></script>
<script src="js/core/share.js"></script>
<script src="js/i18n-loader.js"></script>
<script src="js/app/base.js"></script>
<script src="js/app/state.js"></script>
<script src="js/app/license-ui.js"></script>
<script src="js/app/frame-swap.js"></script>
<script src="js/app/render.js"></script>
<script src="js/tabs/pilot.js"></script>
<script src="js/tabs/skills.js"></script>
<script src="js/tabs/talents.js"></script>
<script src="js/tabs/hase.js"></script>
<script src="js/tabs/licenses.js"></script>
<script src="js/tabs/frame.js"></script>
<script src="js/tabs/loadout.js"></script>
<script src="js/ui/pickers.js"></script>
<script src="js/tabs/summary.js"></script>
<script src="js/tabs/core.js"></script>
<script src="js/ui/modal.js"></script>
<script src="js/app/transfer.js"></script>
<script src="js/sheet.js"></script>
<script src="js/print.js"></script>
<script src="js/main.js"></script>
</body>
</html>
