<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LANCER // РЕЕСТР — конструктор меха и пилота</title>
<meta name="description" content="Конструктор пилота и меха для настольной ролевой игры Lancer. Данные: massif-press/lancer-data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>/* ============ LANCER // REGISTRY ============ */
:root{
  --bg:#080b11;
  --bg-grid:#0b0f17;
  --panel:#0f141d;
  --panel-2:#161d28;
  --panel-3:#1c2532;
  --line:#243040;
  --line-bright:#36485e;
  --ink:#dbe4f0;
  --mute:#7d8ca0;
  --faint:#54637a;
  --accent:#37e0c0;      /* COMP/CON teal */
  --accent-deep:#0f4f45;
  --accent-glow:rgba(55,224,192,.16);
  --amber:#f4a93a;       /* warning / over-budget */
  --amber-glow:rgba(244,169,58,.14);
  --red:#e5604f;
  --gms:#d8c160; --ipsn:#3f8fd6; --ssc:#52b585; --horus:#9d6fdd; --ha:#d8604c; --exotic:#e8398a;
  --shadow:0 18px 50px -20px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Inter",system-ui,sans-serif; font-size:15px; line-height:1.55;
  background-image:
    linear-gradient(var(--bg-grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"Chakra Petch",sans-serif; font-weight:600; letter-spacing:.02em; margin:0}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
a{color:var(--accent)}
button{font-family:inherit; cursor:pointer}
::selection{background:var(--accent); color:#04130f}

/* ---- boot overlay ---- */
#boot{position:fixed; inset:0; z-index:200; background:var(--bg);
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:18px;
  transition:opacity .5s ease; font-family:"JetBrains Mono",monospace}
#boot.done{opacity:0; pointer-events:none}
#boot .ring{width:54px;height:54px;border:2px solid var(--line);border-top-color:var(--accent);
  border-radius:50%; animation:spin .8s linear infinite}
#boot .blog{color:var(--accent); font-size:12.5px; min-height:1.4em; letter-spacing:.06em}
#boot .ttl{color:var(--faint); font-size:11px; letter-spacing:.4em}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- header ---- */
.topbar{position:sticky; top:0; z-index:60; backdrop-filter:blur(8px);
  background:linear-gradient(180deg,rgba(8,11,17,.96),rgba(8,11,17,.82));
  border-bottom:1px solid var(--line); padding:11px clamp(14px,3vw,30px);
  display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.brand{display:flex; align-items:baseline; gap:11px}
.brand .sig{font-family:"JetBrains Mono",monospace; color:var(--accent); font-size:13px; letter-spacing:.12em}
.brand .name{font-family:"Chakra Petch"; font-size:19px; letter-spacing:.06em}
.brand .name b{color:var(--accent)}
.brand .ver{font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--faint);
  border:1px solid var(--line); padding:1px 6px; border-radius:3px; align-self:center}
.topbar .spacer{flex:1}
.toolbtn{background:var(--panel-2); border:1px solid var(--line); color:var(--ink);
  font-family:"JetBrains Mono",monospace; font-size:11.5px; letter-spacing:.05em;
  padding:7px 12px; border-radius:5px; display:inline-flex; gap:7px; align-items:center; transition:.15s}
.toolbtn:hover{border-color:var(--accent); color:var(--accent); box-shadow:0 0 0 1px var(--accent-glow)}
.toolbtn.warn:hover{border-color:var(--amber); color:var(--amber); box-shadow:none}

/* ---- layout ---- */
.shell{display:grid; grid-template-columns:312px 1fr; gap:clamp(14px,2.2vw,28px);
  max-width:1380px; margin:0 auto; padding:clamp(16px,2.5vw,30px)}
@media(max-width:940px){.shell{grid-template-columns:1fr}}

/* ---- HUD sidebar ---- */
.hud{position:sticky; top:78px; align-self:start; display:flex; flex-direction:column; gap:14px;
  max-height:calc(100vh - 96px); overflow:auto; padding-right:2px}
@media(max-width:940px){.hud{position:static; max-height:none}}
.hud::-webkit-scrollbar{width:7px}
.hud::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px}

.card{position:relative; background:
    linear-gradient(180deg,var(--panel),var(--panel) 38px,var(--bg-grid) 38px,var(--panel));
  background:var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow)}
.card::before,.card::after{content:""; position:absolute; width:9px; height:9px; pointer-events:none}
.card::before{top:-1px; left:-1px; border-top:2px solid var(--accent); border-left:2px solid var(--accent); border-radius:2px 0 0 0}
.card::after{bottom:-1px; right:-1px; border-bottom:2px solid var(--accent); border-right:2px solid var(--accent); border-radius:0 0 2px 0}
.card .head{display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:10px 14px; border-bottom:1px solid var(--line)}
.card .head .lbl{font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.16em; color:var(--mute)}
.card .head .lbl b{color:var(--accent); font-weight:400}
.card .body{padding:14px}

.hud .pid{font-family:"Chakra Petch"; font-size:21px; line-height:1.15}
.hud .pid small{display:block; font-family:"JetBrains Mono",monospace; font-size:11px;
  color:var(--accent); letter-spacing:.12em; margin-top:3px}
.hud .ll{margin-top:12px; display:flex; align-items:center; gap:10px}
.hud .ll .big{font-family:"Chakra Petch"; font-size:30px; color:var(--accent); line-height:1}
.hud .ll .meta{font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--faint); letter-spacing:.08em}

/* budget rows */
.budget{display:flex; flex-direction:column; gap:9px}
.brow{display:grid; grid-template-columns:1fr auto; gap:4px 8px; align-items:center}
.brow .nm{font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--mute); letter-spacing:.04em}
.brow .val{font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--ink)}
.brow .val.over{color:var(--amber)}
.brow .bar{grid-column:1/3; height:4px; background:var(--panel-3); border-radius:3px; overflow:hidden}
.brow .bar i{display:block; height:100%; background:var(--accent); border-radius:3px; transition:width .25s}
.brow .bar i.over{background:var(--amber)}

/* mech stat grid in HUD */
.statgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:7px}
.stat{position:relative; background:var(--bg-grid); border:1px solid var(--line); border-radius:5px;
  padding:7px 6px 6px; text-align:center}
.stat .k{font-family:"JetBrains Mono",monospace; font-size:8.5px; letter-spacing:.07em; color:var(--faint); display:block; min-height:2.2em}
.stat .v{font-family:"Chakra Petch"; font-size:19px; color:var(--ink); line-height:1}
.stat.hl .v{color:var(--accent)}
.hud .nomech{font-family:"JetBrains Mono",monospace; font-size:11.5px; color:var(--faint); text-align:center; padding:14px 4px; letter-spacing:.05em}

/* stat glossary tooltip (hover icon, compcon.app-style) */
.stattip{position:relative; display:inline-block; margin-left:3px; width:10px; height:10px; line-height:10px;
  font-size:9px; font-family:"JetBrains Mono",monospace; color:var(--faint); cursor:help; vertical-align:middle}
.stattip:hover{color:var(--accent)}
.stattip-box{display:none; position:absolute; left:50%; bottom:135%; transform:translateX(-50%);
  width:220px; max-width:62vw; background:var(--panel-2); border:1px solid var(--line-bright); border-radius:8px;
  padding:10px 12px; font-family:"Inter",sans-serif; font-size:11.5px; line-height:1.45; color:var(--ink);
  text-align:left; text-transform:none; z-index:300; box-shadow:0 10px 28px rgba(0,0,0,.45); letter-spacing:normal; font-weight:400}
.stattip-box b{display:block; margin-bottom:4px; color:var(--accent); font-family:"Chakra Petch"; font-size:12.5px; font-weight:500}
.stattip:hover .stattip-box{display:block}

/* ---- tabs ---- */
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px}
.tab{background:var(--panel); border:1px solid var(--line); color:var(--mute);
  font-family:"JetBrains Mono",monospace; font-size:11.5px; letter-spacing:.05em;
  padding:9px 13px; border-radius:6px; display:flex; align-items:center; gap:8px; transition:.15s}
.tab .ix{color:var(--faint); font-size:10px}
.tab:hover{color:var(--ink); border-color:var(--line-bright)}
.tab.active{color:var(--accent); border-color:var(--accent); background:var(--panel-2);
  box-shadow:inset 0 0 0 1px var(--accent-glow)}
.tab.active .ix{color:var(--accent)}
.tab .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.tab .dot.warn{background:var(--amber)}

/* ---- section ---- */
.section{display:none}
.section.show{display:block; animation:fade .3s ease}
@keyframes fade{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}
.sechead{margin-bottom:16px}
.sechead .mk{font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--accent); letter-spacing:.16em}
.sechead h2{font-size:25px; margin-top:3px}
.sechead p{color:var(--mute); font-size:13.5px; margin:6px 0 0; max-width:62ch}

/* form fields */
.field{margin-bottom:14px}
.field>label{display:block; font-family:"JetBrains Mono",monospace; font-size:11px;
  letter-spacing:.1em; color:var(--mute); margin-bottom:6px}
.input,select,textarea{width:100%; background:var(--bg-grid); border:1px solid var(--line);
  color:var(--ink); border-radius:6px; padding:9px 11px; font-family:inherit; font-size:14px; transition:.15s}
.input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow)}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}

/* LL slider */
.llpick{display:flex; align-items:center; gap:14px; background:var(--bg-grid);
  border:1px solid var(--line); border-radius:8px; padding:14px 16px}
.llpick input[type=range]{flex:1; accent-color:var(--accent)}
.llpick .num{font-family:"Chakra Petch"; font-size:34px; color:var(--accent); min-width:54px; text-align:center}
.llpick .lab{font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--faint); letter-spacing:.08em}

/* generic item card grid */
.grid{display:grid; gap:12px}
.grid.cards{grid-template-columns:repeat(auto-fill,minmax(252px,1fr))}
.item{position:relative; background:var(--panel); border:1px solid var(--line);
  border-radius:8px; padding:13px 14px; transition:.15s; cursor:pointer}
.item:hover{border-color:var(--line-bright)}
.item.sel{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent-glow)}
.item.locked{opacity:.78}
.item.static{cursor:default}
.item.static:hover{border-color:var(--line)}
.item .src{position:absolute; top:0; left:0; bottom:0; width:3px; border-radius:8px 0 0 8px}
.item .top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px}
.item .nm{font-family:"Chakra Petch"; font-size:16px; line-height:1.2}
.item .badge{font-family:"JetBrains Mono",monospace; font-size:9.5px; letter-spacing:.06em;
  color:var(--mute); border:1px solid var(--line); padding:2px 6px; border-radius:4px; white-space:nowrap}
.item .badge.lock{color:var(--amber); border-color:var(--amber)}
.item .tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:9px}
.tag{font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.03em;
  color:var(--accent); background:var(--accent-deep); border-radius:4px; padding:2px 6px}
.tag.sp{color:var(--amber); background:var(--amber-glow)}
.tag.dmg{color:#ffcaa0; background:rgba(229,96,79,.16)}
.tag.rng{color:#a9c9ff; background:rgba(63,143,214,.16)}
.tag.glossary{cursor:pointer; border-bottom:1px dotted currentColor; transition:.12s}
.tag.glossary:hover{filter:brightness(1.25)}
.tag.glossary.open{outline:1px solid currentColor}
.tagdesc{background:var(--panel-2); border:1px solid var(--line-bright); border-radius:7px;
  padding:10px 12px; margin-top:9px; font-size:12.5px; color:var(--mute)}
.tagdesc b{color:var(--ink); font-family:"Chakra Petch"; font-size:13px}
.item .desc{color:var(--mute); font-size:12.5px; margin-top:9px}
.item .meta{font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--faint);
  letter-spacing:.05em; margin-top:8px; display:flex; gap:10px; flex-wrap:wrap}

/* stepper for skills/talents/hase */
.stepper{display:flex; align-items:center; gap:8px}
.stepbtn{width:30px; height:30px; border-radius:6px; background:var(--panel-2);
  border:1px solid var(--line); color:var(--ink); font-size:17px; line-height:1; display:grid; place-items:center; transition:.12s}
.stepbtn:hover{border-color:var(--accent); color:var(--accent)}
.stepbtn:disabled{opacity:.32; cursor:not-allowed; border-color:var(--line); color:var(--faint)}
.stepval{font-family:"Chakra Petch"; font-size:18px; min-width:48px; text-align:center; color:var(--accent)}
.pips{display:flex; gap:3px}
.pip{width:13px;height:6px;border-radius:2px;background:var(--panel-3); border:1px solid var(--line)}
.pip.on{background:var(--accent); border-color:var(--accent)}

.listrow{display:flex; justify-content:space-between; align-items:center; gap:14px;
  background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px}
.listrow .info{min-width:0}
.listrow .info .nm{font-family:"Chakra Petch"; font-size:16px}
.listrow .info .ds{color:var(--mute); font-size:12.5px; margin-top:3px}
.listrow.maxed{border-color:var(--accent)}
.listrow.clickable{cursor:pointer; transition:.12s}
.listrow.clickable:hover{border-color:var(--line-bright); background:var(--panel-2)}
.listrow.locked{opacity:.68}
.rowbadge{font-family:"JetBrains Mono",monospace; font-size:9.5px; letter-spacing:.06em;
  color:var(--mute); border:1px solid var(--line); padding:2px 6px; border-radius:4px; white-space:nowrap; flex-shrink:0}
.rowbadge.lock{color:var(--amber); border-color:var(--amber)}
.chevron{color:var(--faint); font-size:18px; flex-shrink:0; font-family:"Chakra Petch"}
.viewtoggle{display:flex; gap:8px; margin-bottom:12px}
.profiles{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:11px}
.pickitem{display:block}
.listrow.open{border-color:var(--accent); border-bottom-left-radius:0; border-bottom-right-radius:0}
.expand-detail{background:var(--panel-2); border:1px solid var(--accent); border-top:0;
  border-radius:0 0 8px 8px; padding:14px; margin-top:-1px}

/* talent rank descriptions */
.rankbox{margin-top:10px; display:flex; flex-direction:column; gap:7px}
.rankline{display:flex; gap:9px; font-size:12.5px; color:var(--faint); transition:.15s}
.rankline .rk{font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--faint);
  border:1px solid var(--line); border-radius:4px; padding:1px 6px; height:fit-content}
.rankline.active{color:var(--ink)}
.rankline.active .rk{color:var(--accent); border-color:var(--accent)}

/* mount blocks */
.mount{background:var(--panel); border:1px solid var(--line); border-radius:9px; margin-bottom:14px; overflow:hidden}
.mount.integrated{border-color:var(--line-bright)}
.mount .mhead{display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:11px 14px; background:var(--panel-2); border-bottom:1px solid var(--line)}
.mount .mhead .mt{font-family:"Chakra Petch"; font-size:16px}
.mount .mhead .cap{font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--faint); letter-spacing:.06em}
.mount .slot{padding:10px 14px; border-bottom:1px dashed var(--line)}
.mount .slot:last-child{border-bottom:0}
.equipped{display:flex; align-items:center; justify-content:space-between; gap:12px}
.equipped .ei{min-width:0}
.equipped .ei.clickable{cursor:pointer; border-radius:6px; padding:4px 6px; margin:-4px -6px; transition:.12s}
.equipped .ei.clickable:hover{background:var(--panel-3)}
.listrow .info.clickable{cursor:pointer; border-radius:6px; padding:2px 4px; margin:-2px -4px; transition:.12s}
.listrow .info.clickable:hover{background:var(--panel-3)}
.equipped .ei .en{font-family:"Chakra Petch"; font-size:15px}
.equipped .ei .em{font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--faint); margin-top:2px}
.empty-slot{display:flex; align-items:center; gap:10px; color:var(--faint);
  font-family:"JetBrains Mono",monospace; font-size:12px; letter-spacing:.04em}

.ghostbtn{background:transparent; border:1px dashed var(--line-bright); color:var(--accent);
  font-family:"JetBrains Mono",monospace; font-size:11.5px; letter-spacing:.05em;
  padding:7px 12px; border-radius:6px; transition:.15s}
.ghostbtn:hover{border-style:solid; box-shadow:0 0 0 3px var(--accent-glow)}
.ghostbtn.warn{border-color:var(--red); color:var(--red)}
.ghostbtn.warn:hover{box-shadow:0 0 0 3px rgba(229,96,79,.22)}
.xbtn{background:var(--panel-2); border:1px solid var(--line); color:var(--mute);
  width:28px;height:28px; border-radius:6px; font-size:14px; transition:.12s}
.xbtn:hover{border-color:var(--red); color:var(--red)}
.xbtn.expand:hover{border-color:var(--accent); color:var(--accent)}

/* filters */
.filters{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:16px; align-items:center}
.chip{background:var(--panel); border:1px solid var(--line); color:var(--mute);
  font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.04em; padding:6px 11px;
  border-radius:20px; transition:.15s}
.chip:hover{color:var(--ink)}
.chip.on{color:#06140f; background:var(--accent); border-color:var(--accent); font-weight:600}
.searchwrap{flex:1; min-width:160px}

/* modal */
.modal{position:fixed; inset:0; z-index:120; display:none; align-items:flex-start; justify-content:center;
  background:rgba(4,6,10,.74); backdrop-filter:blur(3px); padding:5vh 16px; overflow:auto}
.modal.show{display:flex}
.modal .panel{background:var(--panel); border:1px solid var(--line-bright); border-radius:10px;
  width:min(760px,100%); box-shadow:var(--shadow)}
.modal .mhd{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line)}
.modal .mhd h3{font-size:18px}
.modal .mbd{padding:14px 16px; max-height:64vh; overflow:auto}

/* summary sheet */
.sheet{display:grid; grid-template-columns:1fr 1fr; gap:16px}
@media(max-width:760px){.sheet{grid-template-columns:1fr}}
.sheet .full{grid-column:1/-1}
.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13.5px}
.kv .k{font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--mute); letter-spacing:.04em}
.sheet h3{font-family:"Chakra Petch"; font-size:17px; margin-bottom:10px;
  padding-bottom:7px; border-bottom:1px solid var(--line)}
.sheet h3 .hash{color:var(--accent); font-family:"JetBrains Mono",monospace; font-size:13px}
.minilist{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:6px}
.minilist li{font-size:13px; display:flex; gap:8px}
.minilist li .mk{color:var(--accent); font-family:"JetBrains Mono",monospace}
.warnbox{background:var(--amber-glow); border:1px solid var(--amber); border-radius:8px;
  padding:11px 14px; color:var(--amber); font-size:12.5px; font-family:"JetBrains Mono",monospace; margin-bottom:14px}

.hint{color:var(--faint); font-size:12px; font-family:"JetBrains Mono",monospace; letter-spacing:.03em}
.spacer-sm{height:8px}
details.note{margin-top:6px}
details.note summary{cursor:pointer; color:var(--accent); font-family:"JetBrains Mono",monospace; font-size:11.5px}
details.note .body{color:var(--mute); font-size:12.5px; margin-top:7px}
details.note .body ul{margin:5px 0; padding-left:18px}

/* print */
@media print{
  body{background:#fff; color:#000}
  .topbar,.hud,.tabs,#boot,.filters,.toolbtn{display:none!important}
  .shell{grid-template-columns:1fr; max-width:none; padding:0}
  .section{display:none!important}
  #print-sheet{display:block!important}
}
</style>
</head>
<body>

<div id="boot">
  <div class="ring"></div>
  <div class="blog">ИНИЦИАЛИЗАЦИЯ…</div>
  <div class="ttl">LANCER · UNION REGISTRY</div>
</div>

<header class="topbar">
  <div class="brand">
    <span class="sig mono">//</span>
    <span class="name">LANCER <b>РЕЕСТР</b></span>
    <span class="ver mono">COMP/CON v1</span>
  </div>

<script>
/* =================================================================
   LANCER // REGISTRY — I18N DATA LOADER
   -----------------------------------------------------------------
   Loads the canonical (English) game data from data/lancer-data.json
   and, if a translation exists, overlays it with locales/<lang>/*.json.

   IMPORTANT — why some fields are never translated in-place:
   A few fields double as *logic keys*, not just display text:
     - frame.name is used to key licenses (state.licenses[frame.name])
       and to match weapons/systems to their unlocking frame
       (item.license === frame.name). Translating it would silently
       break license unlocking, so it is intentionally left in English.
     - mount/type/source/tags/mechtype values (e.g. "Main", "Rifle",
       "GMS", "Reliable 2") are compared literally elsewhere in the
       app logic (mount-matching, filters, source colors). These are
       NEVER mutated on the data objects — they are translated only
       at render time via tr()/trTag(), defined below, using the
       shared locales/<lang>/enums.json dictionary.
   Everything else (description, effect, detail, terse, trait/rank
   text, core system text, on_hit/on_attack/on_crit) is pure prose
   and is safely overlaid in place.
   ================================================================= */

let ENUMS = null;                 // parsed locales/<lang>/enums.json
let currentLang = localStorage.getItem("lancer_lang") || "ru";

const LOCALE_CATEGORY_FILES = [
  "enums", "frames", "weapons", "systems", "talents",
  "skills", "core_bonuses", "pilot_gear", "backgrounds", "manufacturers", "tags", "glossary"
];

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error("HTTP " + r.status + " for " + url);
  return r.json();
}

/* Additional community/official content packs merged into the core data.
   Each pack file is pre-normalized (see tools/normalize_pack.py) into the
   same flat shape as data/lancer-data.json, so no renderer changes are
   needed. Packs only cover categories the app already has a UI for
   (frames/weapons/systems/talents/pilot_gear) — pack categories with no
   app support (e.g. reserves, environments) are intentionally omitted;
   see README. */
const CONTENT_PACKS = ["data/packs/osr-data.json", "data/packs/wallflower-data.json"];

async function loadBaseData() {
  try {
    const core = await fetchJSON("data/lancer-data.json");
    core.tags = await fetchJSON("data/tags.json").catch(e => { console.warn("tags.json failed to load:", e); return []; });
    core.glossary = await fetchJSON("data/glossary.json").catch(e => { console.warn("glossary.json failed to load:", e); return {}; });
    const packs = await Promise.all(
      CONTENT_PACKS.map(p => fetchJSON(p).catch(e => { console.warn("Pack failed to load:", p, e); return null; }))
    );
    for (const pack of packs) {
      if (!pack) continue;
      for (const cat of ["frames", "weapons", "systems", "talents", "pilot_gear"]) {
        if (pack[cat] && pack[cat].length) core[cat] = (core[cat] || []).concat(pack[cat]);
      }
    }
    return core;
  } catch (e) {
    document.body.innerHTML =
      "<div style='padding:40px;font-family:monospace;color:#e5604f'>" +
      "Не удалось загрузить data/lancer-data.json.<br><br>" +
      "Если вы открыли index.html прямо из файловой системы (file://), " +
      "браузер блокирует fetch() локальных файлов. Запустите локальный сервер, например:<br><br>" +
      "<code>python3 -m http.server</code><br><br>" +
      "…в папке проекта и откройте http://localhost:8000/ — подробнее в README.md." +
      "</div>";
    throw e;
  }
}

async function loadLocaleFiles(lang) {
  if (lang === "en") return null; // base data already IS the English text
  const out = {};
  await Promise.all(LOCALE_CATEGORY_FILES.map(async (name) => {
    try { out[name] = await fetchJSON(`locales/${lang}/${name}.json`); }
    catch (e) { out[name] = {}; }
  }));
  return out;
}

/* pick the translation if present & non-empty, otherwise keep the English original */
function pickText(original, pair) {
  if (pair && typeof pair.ru === "string" && pair.ru.trim()) return pair.ru;
  return original;
}

function overlayKeyedPairs(items, overlayMap, fields, opts = {}) {
  items.forEach(item => {
    const t = overlayMap[item.id];
    if (!t) return;
    fields.forEach(f => {
      if (opts.skip && opts.skip.includes(f)) return;
      if (t[f] !== undefined) item[f] = pickText(item[f], t[f]);
    });
  });
}

function overlayNamedSublist(list, overlayNamedMap) {
  (list || []).forEach(sub => {
    const t = (overlayNamedMap || {})[sub.name];
    if (!t) return;
    if (t.name) sub.name = pickText(sub.name, t.name);
    if (t.description !== undefined) sub.description = pickText(sub.description, t.description);
  });
}

/* weapons: on_hit/on_attack/on_crit can be null | string | {detail,...} */
function overlayOnField(item, key, pair) {
  const val = item[key];
  if (val == null || !pair) return;
  const translated = pickText(typeof val === "string" ? val : val.detail, pair);
  if (typeof val === "string") item[key] = translated;
  else item[key] = { ...val, detail: translated };
}

function localizeData(base, locale) {
  const L = JSON.parse(JSON.stringify(base)); // deep clone, never mutate the fetched base
  if (!locale) return L; // "en" — nothing to overlay, English IS the source data

  // frames: fr.name stays English — it's a logic key (state.licenses[fr.name],
  // item.license === fr.name for unlocking). We instead populate fr.display_name
  // with the translation, purely for rendering; see dispName() and its call sites.
  const frOverlay = locale.frames || {};
  L.frames.forEach(fr => {
    fr.display_name = fr.name; // default: no translation yet -> show the English name
    const t = frOverlay[fr.id];
    if (!t) return;
    if (t.name) fr.display_name = pickText(fr.name, t.name);
    if (t.description !== undefined) fr.description = pickText(fr.description, t.description);
    overlayNamedSublist(fr.traits, t.traits);
    if (fr.core_system && t.core_system) {
      const cs = fr.core_system, tcs = t.core_system;
      ["name", "description", "passive_name", "passive_effect", "active_name", "active_effect"]
        .forEach(k => { if (tcs[k] !== undefined) cs[k] = pickText(cs[k], tcs[k]); });
    }
  });

  overlayKeyedPairs(L.weapons, locale.weapons || {}, ["name", "effect"]);
  (locale.weapons ? L.weapons : []).forEach(w => {
    const t = (locale.weapons || {})[w.id];
    if (!t) return;
    overlayOnField(w, "on_hit", t.on_hit);
    overlayOnField(w, "on_attack", t.on_attack);
    overlayOnField(w, "on_crit", t.on_crit);
    if (w.profiles && t.profiles) {
      w.profiles.forEach(p => {
        const tp = t.profiles[p.name];
        if (!tp) return;
        if (tp.name) p.name = pickText(p.name, tp.name);
        if (p.effect !== undefined && tp.effect) p.effect = pickText(p.effect, tp.effect);
      });
    }
  });

  overlayKeyedPairs(L.systems, locale.systems || {}, ["name", "effect", "description"]);

  const talOverlay = locale.talents || {};
  L.talents.forEach(tl => {
    const t = talOverlay[tl.id];
    if (!t) return;
    if (t.name) tl.name = pickText(tl.name, t.name);
    if (t.terse !== undefined) tl.terse = pickText(tl.terse, t.terse);
    if (t.description !== undefined) tl.description = pickText(tl.description, t.description);
    overlayNamedSublist(tl.ranks, t.ranks);
  });

  overlayKeyedPairs(L.skills, locale.skills || {}, ["name", "description", "detail"]);
  overlayKeyedPairs(L.core_bonuses, locale.core_bonuses || {}, ["name", "effect", "mounted_effect"]);
  overlayKeyedPairs(L.pilot_gear, locale.pilot_gear || {}, ["name", "description"]);
  overlayKeyedPairs(L.backgrounds, locale.backgrounds || {}, ["name", "description"]);
  overlayKeyedPairs(L.manufacturers || [], (locale.manufacturers || {}), ["name", "description"]);
  overlayKeyedPairs(L.tags || [], (locale.tags || {}), ["name", "description"]);

  // glossary: a dict keyed by our internal stat key (hp/armor/...), not an
  // array with .id like everything else — overlay it directly.
  if (L.glossary && locale.glossary) {
    for (const key in L.glossary) {
      const t = locale.glossary[key];
      if (!t) continue;
      if (t.name) L.glossary[key].name = pickText(L.glossary[key].name, t.name);
      if (t.description !== undefined) L.glossary[key].description = pickText(L.glossary[key].description, t.description);
    }
  }

  return L;
}

/* ---- enum / tag translation used ONLY at render time (see comment above) ---- */
function tr(word) {
  if (currentLang === "en" || !ENUMS || word == null) return word;
  for (const catKey in ENUMS) {
    if (catKey === "_comment") continue;
    const cat = ENUMS[catKey];
    if (cat[word]) return cat[word][currentLang] || word;
  }
  return word;
}
function trTag(tag) {
  if (currentLang === "en" || !ENUMS || tag == null) return tag;
  const dict = ENUMS.tag_words || {};
  if (dict[tag]) return dict[tag][currentLang] || tag;
  // "N/Round", "N/Turn" — number comes first, word comes after the slash
  const slashM = String(tag).match(/^([\d./+-]+)\/(\w+)$/);
  if (slashM) {
    const word = slashM[2];
    const wordT = dict[word] ? (dict[word][currentLang] || word) : tr(word);
    return slashM[1] + "/" + wordT;
  }
  const m = String(tag).match(/^(.+?)(\s+[\w./+-]+)?(\s*\([^)]*\))?$/);
  if (!m) return tag;
  const base = m[1].trim(), num = m[2] || "", paren = (m[3] || "").trim();
  const baseT = dict[base] ? (dict[base][currentLang] || base) : tr(base);
  const parenT = paren && dict[paren] ? " " + (dict[paren][currentLang] || paren) : (paren ? " " + paren : "");
  return (baseT + num + parenT);
}

/* Display-only translated frame name. frame.name itself is NEVER used here —
   it must stay English everywhere else (license keys / matching), see
   localizeData() above. Falls back to the English name if untranslated. */
const dispName = f => (f && (f.display_name || f.name)) || "";

/* Fetches everything needed for `lang` and returns the ready-to-use L object. */
/* Bump this string whenever index.html changes — printed on load so you can
   verify in the browser console (F12) that the deployed copy is current,
   instead of guessing whether a cached/older file is being served. */
const APP_BUILD = "2026-07-05-leviathan-cannon-fix";
console.log("[Lancer Registry] build:", APP_BUILD);

async function fetchAndLocalize(lang) {
  const [base, locale] = await Promise.all([loadBaseData(), loadLocaleFiles(lang)]);
  ENUMS = locale ? locale.enums : null;
  currentLang = lang;
  localStorage.setItem("lancer_lang", lang);
  return localizeData(base, locale);
}
</script>


<script>/* =================== LANCER // REGISTRY =================== */
let L = null; // populated asynchronously, see startApp() at the bottom of this file
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rich = s => s==null?"":String(s); // dataset html is trusted (<br><ul><li><b>)

/* lookup maps (rebuilt once L is loaded/localized — see rebuildIndexes()) */
const byId = arr => Object.fromEntries(arr.map(x=>[x.id,x]));
let M = {};
let eqWeaponExpanded=new Set(), eqSystemExpanded=new Set(); // sets of "mi:wi" / system-index currently expanded inline
const eqWeaponTagSets=new Map(), eqWeaponProfIdx=new Map(); // per-item tag/profile-stage state, keyed the same way
const eqSystemTagSets=new Map();
function getMap(map,key,fallback){ if(!map.has(key)) map.set(key,fallback()); return map.get(key); }
let TAGS = {}, TAG_PATTERNS = [];
function rebuildIndexes(){
  M = {
    frame: byId(L.frames), weapon: byId(L.weapons), system: byId(L.systems),
    talent: byId(L.talents), skill: byId(L.skills), core: byId(L.core_bonuses),
    gear: byId(L.pilot_gear), bg: byId(L.backgrounds),
  };
  TAGS = byId(L.tags || []);
  TAG_PATTERNS = (L.tags || []).map(t => ({ id: t.id, re: tagTemplateToRegex(t.name) }));
}

/* Turns a tag glossary name template (e.g. "Reliable {VAL}", "{VAL}/Round",
   "Heat {VAL} (Self)") into a regex that matches a rendered tag string
   (e.g. "Reliable 2") and captures the value. Works for the current
   language's template too, since translators keep the "{VAL}" token as-is. */
function tagTemplateToRegex(tpl){
  const OPT = "\u0001", REQ = "\u0002";
  // "<space>{VAL}" -> optional numeric group (legacy data sometimes omits
  // the implicit "1", e.g. bare "Accurate" instead of "Accurate 1")
  let t = String(tpl).replace(/\s\{VAL\}/g, OPT);
  t = t.replace(/\{VAL\}/g, REQ); // any remaining {VAL} (e.g. "{VAL}/Round") stays mandatory
  t = t.replace(/[.*+?^${}()|[\]\\/]/g, "\\$&");
  // value can be a plain number OR dice notation like "1d6+2"
  t = t.split(OPT).join("(?:\\s+([\\w./+-]+))?");
  t = t.split(REQ).join("([\\w./+-]+)");
  return new RegExp("^" + t + "$", "i");
}

/* Looks up the glossary entry for a rendered tag string (in whatever
   language is currently active) and returns {name, description} with
   "{VAL}" substituted (defaulting to "1" if the tag string omitted the
   number), or null if no glossary entry matches. */
function describeTag(displayTag){
  if(!displayTag || !TAG_PATTERNS) return null;
  for(const {id, re} of TAG_PATTERNS){
    const m = String(displayTag).match(re);
    if(!m) continue;
    const t = TAGS[id]; if(!t) continue;
    const val = m[1] || "1";
    return {
      name: String(t.name).replace(/\{VAL\}/g, val),
      description: String(t.description).replace(/\{VAL\}/g, val),
    };
  }
  return null;
}
const SRC = {GMS:"var(--gms)","IPS-N":"var(--ipsn)",SSC:"var(--ssc)",HORUS:"var(--horus)",HA:"var(--ha)",EXOTIC:"var(--exotic)"};
const SRC_NAME_EN = {GMS:"GENERAL MASSIVE SYSTEMS","IPS-N":"IPS-NORTHSTAR",SSC:"SMITH-SHIMANO CORPRO",HORUS:"HORUS",HA:"HARRISON ARMORY",EXOTIC:"EXOTIC / UNKNOWN ORIGIN"};
/* SRC_NAME[code] now returns the localized manufacturer name (via enums.json/source_names),
   falling back to English automatically — every other call site (SRC_NAME[x.source]) is untouched. */
const SRC_NAME = new Proxy({}, { get: (_,k) => tr(SRC_NAME_EN[k] || k) });
const srcColor = s => SRC[s]||"var(--line-bright)";

/* RU stat labels */
const STAT_RU = {
  hp:["ОЗ","Очки здоровья"], armor:["БРОНЯ","Armor"], structure:["СТРУКТ.","Structure"],
  stress:["СТРЕСС","Reactor Stress"], heatcap:["ТЕПЛО","Heat Cap"], repcap:["РЕМОНТ","Repair Cap"],
  evasion:["УКЛОН","Evasion"], edef:["Э-ЗАЩ","E-Defense"], speed:["СКОР.","Speed"],
  sensor_range:["СЕНСОР","Sensors"], tech_attack:["ТЕХ-АТК","Tech Attack"], save:["СПАС.","Save"],
  size:["РАЗМЕР","Size"], sp:["SP","System Points"],
};
/* Stat glossary — from massif-press/lancer-data/lib/glossary.json (data/glossary.json),
   translated via locales/<lang>/glossary.json like everything else. Powers
   the hover-tooltip icon next to each stat label (compcon.app-style). */
function statKeyHTML(k){
  const g = L && L.glossary && L.glossary[k];
  if(!g) return STAT_RU[k][0];
  return `${STAT_RU[k][0]}<span class="stattip">ⓘ<span class="stattip-box"><b>${esc(g.name)}</b><br>${g.description}</span></span>`;
}
const HASE = [
  {k:"hull",      ru:"КОРПУС",   en:"HULL",        eff:"+2 HP · +1 Ремонт за 2 ранга"},
  {k:"agility",   ru:"ЛОВКОСТЬ", en:"AGILITY",     eff:"+1 Уклонение · +1 Скорость за 2 ранга"},
  {k:"systems",   ru:"СИСТЕМЫ",  en:"SYSTEMS",     eff:"+1 Э-Защита · +1 Тех-атака · +1 SP за 2 ранга"},
  {k:"engineering",ru:"ИНЖЕНЕРИЯ",en:"ENGINEERING",eff:"+1 Теплоёмкость · +1 к лимит. системам за 2 ранга"},
];

/* ---------------- STATE ---------------- */
const state = {
  pilot:{ name:"", callsign:"", background:"", ll:0 },
  skills:{},        // id -> 0/2/4/6
  talents:{},       // id -> 1..3
  hase:{hull:0,agility:0,systems:0,engineering:0},
  licenses:{},      // frameName -> 0..3
  gear:{ armor:null, weapons:[], gear:[] },
  cores:[],         // core bonus ids
  mech:{ frameId:null, mounts:[], systems:[] },
};
let activeTab = "pilot";

/* ---------------- DERIVED ---------------- */
/* Systems whose effect grants a flat, always-on bonus to a mech stat
   (as opposed to a conditional/reactive bonus, or a bonus to a deployed
   object rather than the mech itself — those stay as descriptive text only,
   since this app doesn't track live combat state). Scanned across the full
   core dataset + all content packs; currently only Personalizations
   qualifies. Extend this map if new content adds more. */
const SYSTEM_STAT_BONUSES = {
  "ms_personalizations": {hp: 2},
};
function systemStatBonusTotal(stat){
  return state.mech.systems.reduce((sum,id)=>{
    const b=SYSTEM_STAT_BONUSES[id];
    return sum + (b && b[stat] ? b[stat] : 0);
  }, 0);
}

function derived(){
  const ll = state.pilot.ll;
  const grit = Math.ceil(ll/2);
  const b = {
    skill:{cap:4+ll}, talent:{cap:3+ll}, hase:{cap:2+ll},
    license:{cap:ll}, core:{cap:Math.floor(ll/3)}
  };
  b.skill.used   = Object.values(state.skills).reduce((a,v)=>a+v/2,0);
  b.talent.used  = Object.values(state.talents).reduce((a,v)=>a+v,0);
  b.hase.used    = Object.values(state.hase).reduce((a,v)=>a+v,0);
  b.license.used = Object.values(state.licenses).reduce((a,v)=>a+v,0);
  b.core.used    = state.cores.length;

  const {hull,agility,systems,engineering} = state.hase;
  const f = state.mech.frameId ? M.frame[state.mech.frameId] : null;
  let mech=null, sp={cap:0,used:0};
  if(f){
    const s=f.stats;
    mech = {
      size:s.size, structure:s.structure, stress:s.stress, armor:s.armor,
      hp:s.hp+grit+2*hull+systemStatBonusTotal("hp"),
      repcap:s.repcap+Math.floor(hull/2),
      evasion:s.evasion+agility,
      speed:s.speed+Math.floor(agility/2),
      edef:s.edef+systems,
      tech_attack:s.tech_attack+systems,
      heatcap:s.heatcap+engineering,
      sensor_range:s.sensor_range,
      save:s.save+grit,
      sp:s.sp+Math.floor(systems/2),
      limited_bonus:Math.floor(engineering/2),
      attack:grit,
    };
    sp.cap = mech.sp;
    let used=0;
    state.mech.systems.forEach(id=>{ const sy=M.system[id]; if(sy) used+=sy.sp||0; });
    state.mech.mounts.forEach(mt=>mt.items.forEach(id=>{ const w=M.weapon[id]; if(w) used+=w.sp||0; }));
    sp.used=used;
  }
  return {ll,grit,b,mech,sp,frame:f};
}

/* license helpers */
const licRank = name => state.licenses[name]||0;
/* GMS first, then the rest of the manufacturers grouped together in this
   fixed order, unknown sources last — used to sort weapon/system lists so
   items from the same manufacturer stay together instead of interleaving. */
const SOURCE_ORDER = ["GMS","IPS-N","SSC","HORUS","HA","EXOTIC"];
const sourceOrder = src => { const i=SOURCE_ORDER.indexOf(src); return i<0?999:i; };
/* Highest license rank the pilot has invested among all frames of a given
   manufacturer (e.g. rank 2 in "Minotaur" and rank 2 in "Genghis" both count
   toward HORUS/HA respectively, but neither reaches the 3 needed to unlock
   that manufacturer's CORE Bonuses). GMS has no such requirement. */
function manufacturerRank(source){
  const ranks = L.frames.filter(f=>f.source===source).map(f=>licRank(f.name));
  return ranks.length ? Math.max(...ranks) : 0;
}
function coreBonusUnlocked(c){
  return c.source==="GMS" || manufacturerRank(c.source)>=3;
}
function unlocked(item){
  if(item.source==="GMS"||item.license==="GMS"||(item.license_level||0)===0) return true;
  return licRank(item.license) >= (item.license_level||0);
}
function frameUnlocked(f){
  if(f.source==="GMS"||f.license_level===0) return true;
  return licRank(f.name) >= f.license_level;
}

/* ---------------- MOUNTS ---------------- */
function allowedNext(type,sizes){
  const n=sizes.length;
  if(type==="Main")  return n<1?["Main","Auxiliary"]:[];
  if(type==="Heavy") return n<1?["Heavy","Main","Auxiliary","Superheavy"]:[];
  if(type==="Aux/Aux") return n<2?["Auxiliary"]:[];
  if(type==="Flex"){
    if(n>=2||sizes.includes("Main")) return [];
    return n===1?["Auxiliary"]:["Main","Auxiliary"];
  }
  if(type==="Main/Aux"){
    const r=[]; if(!sizes.includes("Main")) r.push("Main");
    if(sizes.filter(s=>s==="Auxiliary").length<1) r.push("Auxiliary"); return r;
  }
  return [];
}
function buildMounts(frame){
  const mounts = frame.mounts.map(t=>({type:t,items:[]}));
  const iw = FRAME_INTEGRATED_WEAPON[frame.id];
  if(iw) mounts.push({type:"Integrated", items:[iw]});
  return mounts;
}
/* Frames whose CORE system is (or includes) a built-in weapon that doesn't
   occupy a normal mount slot — e.g. Raleigh's M35 Mjolnir, Barbarossa's
   Apocalypse Rail. These get an automatic "Integrated" mount, pre-filled;
   if removed, it can only be restored via openIntegratedPicker() (below),
   never filled with anything else. */
const FRAME_INTEGRATED_WEAPON = {
  "mf_lancaster": "mw_lancaster_integrated",
  "mf_raleigh": "mw_raleigh_integrated",
  "mf_barbarossa": "mw_barbarossa_integrated",
  "mf_sherman": "mw_sherman_integrated",
  "mf_tokugawa_alt_enkidu": "mw_tokugawa_alt_enkidu_integrated",
};

/* ---------------- RENDER ROOT ---------------- */
function render(){ renderHUD(); renderTab(); renderTabBar(); }

function setState(fn){ fn(); render(); }

/* ============ HUD ============ */
function bar(b,label){
  const over=b.used>b.cap;
  const pct=Math.min(100,b.cap?b.used/b.cap*100:0);
  return `<div class="brow">
    <span class="nm">${label}</span>
    <span class="val ${over?'over':''}">${(+b.used.toFixed(1))} / ${b.cap}</span>
    <span class="bar"><i class="${over?'over':''}" style="width:${pct}%"></i></span>
  </div>`;
}
function renderHUD(){
  const d=derived(); const p=state.pilot;
  const stats = d.mech ? `
    <div class="statgrid">
      ${["hp","evasion","edef","heatcap","speed","armor","sensor_range","tech_attack","save","repcap","size","sp"].map(k=>{
        const hl=["hp","evasion","sp"].includes(k)?"hl":"";
        return `<div class="stat ${hl}"><span class="k">${statKeyHTML(k)}</span><span class="v">${d.mech[k]}</span></div>`;
      }).join("")}
    </div>
    <div class="brow" style="margin-top:10px">
      ${bar(d.sp,"СИСТ. ОЧКИ (SP)")}
    </div>`
    : `<div class="nomech">// ШАССИ НЕ ВЫБРАНО<br>откройте вкладку ШАССИ</div>`;

  $("#hud").innerHTML = `
  <div class="card">
    <div class="head"><span class="lbl"><b>//</b> РЕЕСТР ПИЛОТА</span></div>
    <div class="body">
      <div class="pid">${esc(p.callsign||"БЕЗЫМЯННЫЙ")}
        <small>${esc(p.name||"имя не задано")}${p.background?" · "+esc(M.bg[p.background]?.name||""):""}</small></div>
      <div class="ll">
        <span class="big">LL${d.ll}</span>
        <span class="meta">GRIT +${d.grit}<br>лицензионный уровень</span>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="head"><span class="lbl"><b>//</b> БЮДЖЕТ ПОСТРОЕНИЯ</span></div>
    <div class="body"><div class="budget">
      ${bar(d.b.skill,"НАВЫКИ")}
      ${bar(d.b.talent,"ТАЛАНТЫ")}
      ${bar(d.b.hase,"МЕХ-НАВЫКИ")}
      ${bar(d.b.license,"ЛИЦЕНЗИИ")}
      ${bar(d.b.core,"CORE-БОНУСЫ")}
    </div></div>
  </div>
  <div class="card">
    <div class="head"><span class="lbl"><b>//</b> СВОДКА МЕХА</span>
      ${d.frame?`<span class="lbl" style="color:${srcColor(d.frame.source)}">${esc(dispName(d.frame))}</span>`:""}</div>
    <div class="body">${stats}</div>
  </div>`;
}

/* ============ TAB BAR ============ */
const TABS=[
  ["pilot","ПИЛОТ"],["skills","НАВЫКИ"],["talents","ТАЛАНТЫ"],["hase","МЕХ-НАВЫКИ"],
  ["licenses","ЛИЦЕНЗИИ"],["frame","ШАССИ"],["loadout","ВООРУЖЕНИЕ"],["core","CORE"],["summary","ИТОГ"]
];
function tabWarn(id){
  const d=derived();
  if(id==="skills")   return d.b.skill.used>d.b.skill.cap;
  if(id==="talents")  return d.b.talent.used>d.b.talent.cap;
  if(id==="hase")     return d.b.hase.used>d.b.hase.cap;
  if(id==="licenses") return d.b.license.used>d.b.license.cap;
  if(id==="loadout")  return d.mech && d.sp.used>d.sp.cap;
  if(id==="core")     return d.b.core.cap>0 && state.cores.length>d.b.core.cap;
  return false;
}
function renderTabBar(){
  $("#tabs").innerHTML = TABS.map(([id,nm],i)=>{
    const warn=tabWarn(id);
    return `<button class="tab ${activeTab===id?'active':''}" data-tab="${id}">
      <span class="ix mono">${String(i+1).padStart(2,"0")}</span>${nm}
      ${warn?'<span class="dot warn"></span>':''}</button>`;
  }).join("");
  $$("#tabs .tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab; render(); window.scrollTo({top:0,behavior:"smooth"});});
}

/* ============ TAB ROUTER ============ */
function renderTab(){
  const fn={pilot:renderPilot,skills:renderSkills,talents:renderTalents,hase:renderHase,
    licenses:renderLicenses,frame:renderFrame,loadout:renderLoadout,core:renderCore,summary:renderSummary}[activeTab];
  $("#tab").innerHTML=""; fn();
}
function sechead(mk,h,p){ return `<div class="sechead"><div class="mk">${mk}</div><h2>${h}</h2><p>${p}</p></div>`; }

/* ============ PILOT ============ */
function renderPilot(){
  const p=state.pilot;
  const bgOpts = `<option value="">— не выбрано —</option>`+L.backgrounds
    .map(b=>`<option value="${b.id}" ${p.background===b.id?"selected":""}>${esc(b.name)}</option>`).join("");
  $("#tab").innerHTML = sechead("// 01 · ИДЕНТИФИКАЦИЯ","Пилот","Базовые данные пилота. Лицензионный уровень (LL) задаёт весь бюджет построения — поднимайте его, чтобы открыть больше навыков, талантов и снаряжения.")
   + `<div class="row2">
        <div class="field"><label>ИМЯ ПИЛОТА</label>
          <input class="input" id="f-name" value="${esc(p.name)}" placeholder="напр. Кейт Аояма"></div>
        <div class="field"><label>ПОЗЫВНОЙ</label>
          <input class="input" id="f-call" value="${esc(p.callsign)}" placeholder="напр. RONIN"></div>
      </div>
      <div class="field"><label>ПРОИСХОЖДЕНИЕ (BACKGROUND)</label>
        <select id="f-bg">${bgOpts}</select>
        <div id="bg-desc" class="hint" style="margin-top:8px"></div></div>
      <div class="field"><label>ЛИЦЕНЗИОННЫЙ УРОВЕНЬ — LL ${p.ll}</label>
        <div class="llpick">
          <span class="num">${p.ll}</span>
          <div style="flex:1">
            <input type="range" id="f-ll" min="0" max="12" value="${p.ll}">
            <div class="lab" style="display:flex;justify-content:space-between;margin-top:4px">
              <span>LL0 · новобранец</span><span>LL12 · ветеран</span></div>
          </div>
          <div class="lab" style="text-align:right">GRIT<br><b style="color:var(--accent);font-size:20px">+${Math.ceil(p.ll/2)}</b></div>
        </div></div>
      <details class="note"><summary>Как считается бюджет?</summary><div class="body">
        На каждом LL вы получаете: <b>+1</b> очко навыков, талантов, мех-навыков и лицензий. GRIT = LL ÷ 2 (округление вверх) и добавляется к HP меха, спасброску и атакам. CORE-бонус выдаётся на каждом чётном уровне.
        <ul><li>Очки навыков: 4 + LL</li><li>Очки талантов: 3 + LL</li><li>Мех-навыки: 2 + LL</li><li>Лицензии: LL</li><li>CORE-бонусы: LL ÷ 2 (вниз)</li></ul>
      </div></details>`;

  $("#f-name").oninput=e=>{state.pilot.name=e.target.value; renderHUD();};
  $("#f-call").oninput=e=>{state.pilot.callsign=e.target.value; renderHUD();};
  const bgDesc=()=>{ const b=M.bg[state.pilot.background]; $("#bg-desc").innerHTML=b?rich(b.description):""; };
  $("#f-bg").onchange=e=>{state.pilot.background=e.target.value; bgDesc(); renderHUD();};
  bgDesc();
  const ll=$("#f-ll");
  ll.oninput=e=>{ state.pilot.ll=+e.target.value;
    $$(".llpick .num").forEach(n=>n.textContent=e.target.value);
    $$(".llpick .lab b").forEach(b=>b.textContent="+"+Math.ceil(state.pilot.ll/2));
    $(".field>label").textContent=`ЛИЦЕНЗИОННЫЙ УРОВЕНЬ — LL ${e.target.value}`;
    renderHUD(); renderTabBar(); };
  ll.onchange=()=>render();
}

/* ============ SKILLS ============ */
function renderSkills(){
  const d=derived();
  const over=d.b.skill.used>d.b.skill.cap;
  $("#tab").innerHTML = sechead("// 02 · ТРИГГЕРЫ","Навыки пилота",
    `Распределите очки между триггерами навыков. Каждый шаг даёт +2 (максимум +6 на триггер). Потрачено ${(+d.b.skill.used)} из ${d.b.skill.cap}.`)
    + (over?`<div class="warnbox">⚠ Превышен бюджет навыков на ${d.b.skill.used-d.b.skill.cap}. Уменьшите ранги.</div>`:"")
    + `<div class="grid" id="skill-list"></div>`;
  $("#skill-list").innerHTML = L.skills.map(s=>{
    const v=state.skills[s.id]||0;
    const remaining=d.b.skill.cap-d.b.skill.used;
    const canInc=v<6 && remaining>=1;
    return `<div class="listrow ${v===6?'maxed':''}">
      <div class="info"><div class="nm">${esc(s.name)}</div><div class="ds">${rich(s.description)}</div></div>
      <div class="stepper">
        <button class="stepbtn" data-sk="${s.id}" data-d="-1" ${v<=0?"disabled":""}>−</button>
        <span class="stepval">${v?"+"+v:"—"}</span>
        <button class="stepbtn" data-sk="${s.id}" data-d="1" ${canInc?"":"disabled"}>+</button>
      </div></div>`;
  }).join("");
  $$("#skill-list .stepbtn").forEach(b=>b.onclick=()=>{
    const id=b.dataset.sk, dir=+b.dataset.d;
    let v=(state.skills[id]||0)+dir*2; v=Math.max(0,Math.min(6,v));
    if(v===0) delete state.skills[id]; else state.skills[id]=v;
    render();
  });
}

/* ============ TALENTS ============ */

  const over=d.b.talent.used>d.b.talent.cap;
  $("#tab").innerHTML = sechead("// 03 · ПОДГОТОВКА","Таланты",
    `Каждый ранг таланта стоит 1 очко (макс. ранг 3). Потрачено ${d.b.talent.used} из ${d.b.talent.cap}.`)
    + (over?`<div class="warnbox">⚠ Превышен бюджет талантов на ${d.b.talent.used-d.b.talent.cap}.</div>`:"")

  const remaining=d.b.talent.cap-d.b.talent.used;

      <span class="rk">${["I","II","III"][i]}</span><div><b>${esc(r.name)}</b><div style="margin-top:2px">${rich(r.description)}</div></div></div>`).join("");

      <div class="rankbox">${ranks}</div>

/* ============ LICENSES ============ */
function stepLicense(name, dir){
  const v=Math.max(0,Math.min(3,(state.licenses[name]||0)+dir));
  if(v===0) delete state.licenses[name]; else state.licenses[name]=v;
}

/* What a rank of this frame's license unlocks: the frame print itself (at
   f.license_level) and any weapons/systems tied to it at that exact rank. */
function licenseRanksHTML(f){
  const items=[...L.weapons,...L.systems].filter(it=>it.license===f.name);
  const byRank={1:[],2:[],3:[]};
  items.forEach(it=>{ const r=it.license_level||1; if(byRank[r]) byRank[r].push(it); });
  const line=it=>it.mount
    ? `<li><span class="mk">⚔</span> ${esc(it.name)} <span class="hint">${tr(it.mount)} · ${dmgStr(it)}</span></li>`
    : `<li><span class="mk">⚙</span> ${esc(it.name)} <span class="hint">${it.sp} SP</span></li>`;
  return [1,2,3].map(rank=>{
    const frameHere = f.license_level===rank;
    const list = byRank[rank];
    if(!frameHere && !list.length) return "";
    return `<div style="margin-bottom:14px">
      <h4 style="font-family:'Chakra Petch';font-size:14px;margin-bottom:6px;color:var(--accent)">РАНГ ${rank}</h4>
      ${frameHere?`<div class="desc" style="margin-bottom:6px">🔓 Открывает само шасси <b>${esc(dispName(f))}</b>.</div>`:""}
      ${list.length?`<ul class="minilist">${list.map(line).join("")}</ul>`:""}
    </div>`;
  }).join("") || `<div class="hint">На эту лицензию не привязано ни оружия, ни систем — только шасси.</div>`;
}
function openLicenseDetail(fid){
  const f=M.frame[fid], v=licRank(f.name), d=derived();
  const remaining=d.b.license.cap-d.b.license.used;
  modal(dispName(f), `
    <div class="meta" style="margin-bottom:14px;color:${srcColor(f.source)}">${esc(SRC_NAME[f.source]||f.source)} · ${f.mechtype?.map(tr).join(" / ")||""}</div>
    <div class="stepper" style="margin-bottom:18px">
      <button class="stepbtn" id="lic-minus" ${v<=0?"disabled":""}>−</button>
      <span class="pips">${[1,2,3].map(n=>`<span class="pip ${v>=n?'on':''}"></span>`).join("")}</span>
      <button class="stepbtn" id="lic-plus" ${(v<3&&remaining>=1)?"":"disabled"}>+</button>
      <span class="hint" style="margin-left:10px">ранг ${v}/3</span>
    </div>
    ${licenseRanksHTML(f)}`);
  $("#lic-minus").onclick=()=>{ stepLicense(f.name,-1); render(); openLicenseDetail(fid); };
  $("#lic-plus").onclick=()=>{ stepLicense(f.name,1); render(); openLicenseDetail(fid); };
}

function renderLicenses(){
  const d=derived();
  const over=d.b.license.used>d.b.license.cap;
  const remaining=d.b.license.cap-d.b.license.used;
  const licFrames=L.frames.filter(f=>f.source!=="GMS");
  // group by manufacturer
  const groups={};
  licFrames.forEach(f=>(groups[f.source]=groups[f.source]||[]).push(f));
  $("#tab").innerHTML = sechead("// 05 · ЛИЦЕНЗИИ","Лицензии производителей",
    `Тратьте очки лицензий, чтобы открывать шасси, оружие и системы производителей. Каждый ранг лицензии = 1 очко (макс. 3). GMS доступен бесплатно. Потрачено ${d.b.license.used} из ${d.b.license.cap}. Кликните по карточке, чтобы увидеть, что открывает каждый ранг.`)
    + (over?`<div class="warnbox">⚠ Превышено очков лицензий на ${d.b.license.used-d.b.license.cap}.</div>`:"")
    + Object.entries(groups).map(([src,fr])=>`
      <h3 style="font-family:'Chakra Petch';font-size:15px;margin:18px 0 10px;color:${srcColor(src)}">// ${esc(SRC_NAME[src]||src)}</h3>
      <div class="grid cards">${fr.map(f=>{
        const v=licRank(f.name);
        const nUnlock = [...L.weapons,...L.systems].filter(it=>it.license===f.name && (it.license_level||0)<=v).length;
        return `<div class="item ${v?'sel':''} clickable" data-openlic="${f.id}">
          <div class="src" style="background:${srcColor(src)}"></div>
          <div class="top"><div class="nm">${esc(dispName(f))}</div><div class="badge">${f.mechtype?.map(tr).join(" / ")||""}</div></div>
          <div class="meta">ШАССИ открывается на ранге ${f.license_level} · открыто предметов: ${nUnlock}</div>
          <div class="stepper" style="margin-top:11px">
            <button class="stepbtn" data-lic="${esc(f.name)}" data-d="-1" ${v<=0?"disabled":""}>−</button>
            <span class="pips">${[1,2,3].map(n=>`<span class="pip ${v>=n?'on':''}"></span>`).join("")}</span>
            <button class="stepbtn" data-lic="${esc(f.name)}" data-d="1" ${(v<3&&remaining>=1)?"":"disabled"}>+</button>
          </div></div>`;
      }).join("")}</div>`).join("");
  $$("#tab .stepbtn[data-lic]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    stepLicense(b.dataset.lic, +b.dataset.d);
    render();
  });
  $$("#tab .item[data-openlic]").forEach(it=>it.onclick=()=>openLicenseDetail(it.dataset.openlic));
}

/* ============ FRAME ============ */
let frameFilter="ALL";
/* Traits + CORE system markup, shared by the frame detail modal, the
   selected-frame card on the ШАССИ tab, and the ИТОГ (summary) tab. */
function frameTraitsCoreHTML(f){
  const cs=f.core_system;
  const traits=f.traits.map(t=>`<div style="margin-bottom:10px"><b style="font-family:'Chakra Petch'">${esc(t.name)}</b><div class="desc" style="margin-top:3px">${rich(t.description)}</div></div>`).join("");
  const core = cs?`<h3 style="font-family:'Chakra Petch';margin:6px 0 8px;color:var(--accent)">CORE-СИСТЕМА — ${esc(cs.name)}</h3>
      ${cs.description?`<div class="desc" style="margin-bottom:8px">${rich(cs.description)}</div>`:""}
      ${cs.passive_name?`<div style="margin-bottom:8px"><b>Пассивно — ${esc(cs.passive_name)}:</b> <span class="desc">${rich(cs.passive_effect)}</span></div>`:""}
      ${cs.active_name?`<div><b>CORE-актив — ${esc(cs.active_name)}:</b> <span class="desc">${rich(cs.active_effect)}</span></div>`:""}`:"";
  return (traits?`<h3 style="font-family:'Chakra Petch';margin:6px 0 8px">ОСОБЕННОСТИ</h3>${traits}`:"") + core;
}
/* Full frame detail: meta line + description + stat grid + traits/CORE. */
function frameDetailBodyHTML(f){
  return `
    <div class="meta" style="margin-bottom:8px;color:${srcColor(f.source)}">${esc(SRC_NAME[f.source]||f.source)} · ${f.mechtype.map(tr).join(" / ")} · лицензия LL${f.license_level}</div>
    <div class="desc" style="margin-bottom:14px">${rich(f.description)}</div>
    <div class="statgrid" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">
      ${["hp","armor","evasion","edef","heatcap","repcap","speed","sensor_range","tech_attack","save","size","sp"].map(k=>
        `<div class="stat"><span class="k">${statKeyHTML(k)}</span><span class="v">${f.stats[k]}</span></div>`).join("")}
    </div>
    ${frameTraitsCoreHTML(f)}`;
}

function renderFrame(){
  const d=derived();
  $("#tab").innerHTML = sechead("// 06 · ШАССИ","Выбор меха",
    "Выберите рамную платформу (frame). Её базовые статы складываются с вашими мех-навыками и GRIT. Замок означает, что лицензия ещё не открыта — выбрать можно всё, но проверьте требования на вкладке ЛИЦЕНЗИИ.")
    + (d.frame ? `
      <div class="card" style="margin-bottom:20px">
        <div class="head"><span class="lbl"><b>//</b> ВЫБРАННОЕ ШАССИ — ${esc(dispName(d.frame))}</span>
          <span class="lbl" style="color:${srcColor(d.frame.source)}">${esc(d.frame.source)}</span></div>
        <div class="body">${frameDetailBodyHTML(d.frame)}</div>
      </div>` : "")
    + `<div class="filters" id="frame-filters">
        ${["ALL","GMS","IPS-N","SSC","HORUS","HA"].map(s=>`<button class="chip ${frameFilter===s?'on':''}" data-ff="${s}">${s==="ALL"?"ВСЕ":s}</button>`).join("")}
       </div><div class="grid cards" id="frame-list"></div>`;
  const list=L.frames.filter(f=>frameFilter==="ALL"||f.source===frameFilter)

/* ============ LOADOUT ============ */

          <button class="xbtn expand" data-expw="${key}" title="Показать подробности">${open?'⌄':'›'}</button>
          <button class="xbtn" data-rmw="${key}">✕</button>
        </div>
      </div>`;
      const expand=open?`<div class="expand-detail">${weaponCardBody(w, dk, eqWeaponProfIdx.get(key)||0)}</div>`:"";

      ? `${mt.items.length} / 1 · встроено в шасси`

    const restoreBtn = (isInt && !mt.items.length)

      ${can?`<div class="slot"><button class="ghostbtn" data-addw="${mi}">+ УСТАНОВИТЬ ОРУЖИЕ</button></div>`:""}
      ${restoreBtn}

  eqWeaponExpanded.forEach(key=>{

  });

  $$("#mounts .ghostbtn[data-addw]").forEach(b=>b.onclick=()=>openWeaponPicker(+b.dataset.addw));
  $$("#mounts .ghostbtn[data-restoreint]").forEach(b=>b.onclick=()=>openIntegratedPicker(+b.dataset.restoreint));
  $$("#mounts .xbtn[data-rmw]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const key=b.dataset.rmw, [mi,wi]=key.split(":").map(Number);
    state.mech.mounts[mi].items.splice(wi,1);
    eqWeaponExpanded.delete(key); eqWeaponTagSets.delete(key); eqWeaponProfIdx.delete(key);
    render();
  });
  $$("#mounts .xbtn[data-expw]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const key=b.dataset.expw;
    if(eqWeaponExpanded.has(key)) eqWeaponExpanded.delete(key); else eqWeaponExpanded.add(key);
    renderLoadout();
  });
  $$("#mounts .ei[data-vieww]").forEach(el=>el.onclick=()=>{
    const [mi,wi]=el.dataset.vieww.split(":").map(Number);
    viewEquippedWeapon(mi,wi);
  });
  $("#add-system").onclick=openSystemPicker;
  $$("#syslist .xbtn[data-rms]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const si=+b.dataset.rms;
    state.mech.systems.splice(si,1);
    eqSystemExpanded.delete(si); eqSystemTagSets.delete(si);
    render();
  });
  $$("#syslist .xbtn[data-exps]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const si=+b.dataset.exps;
    if(eqSystemExpanded.has(si)) eqSystemExpanded.delete(si); else eqSystemExpanded.add(si);
    renderLoadout();
  });
  $$("#syslist .info[data-views]").forEach(el=>el.onclick=()=>viewEquippedSystem(+el.dataset.views));
}
/* Strips HTML tags for a plain-text preview, then truncates at a word
   boundary (never mid-word, never mid-tag) with an ellipsis. Used for
   one-line summaries in compact lists — full text is always shown untouched
   in the detail card. */
const stripHTML = html => String(html || "").replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
const truncateWords = (str, max) => {
  if (str.length <= max) return str;
  const cut = str.slice(0, max);
  const lastSpace = cut.lastIndexOf(" ");
  return (lastSpace > max * 0.6 ? cut.slice(0, lastSpace) : cut).trim() + "…";
};

const dmgStr=w=>(w.damage||[]).map(x=>`${x.val} ${tr(x.type)}`).join(", ")||"—";

/* Wires click handlers on .glossary tag chips inside `tagsSel` so clicking
   one toggles a description box (`boxSel`) looked up from the tag glossary
   (data/tags.json + locales/<lang>/tags.json). `rawTags` must be the same
   array used to render the chips, in the same order (data-tgi is the index). */
let tagOpenSet=new Set();
function wireTagGlossary(tagsSel, boxSel, rawTags, tagSet){
  tagSet = tagSet || tagOpenSet;
  const box=$(boxSel);
  const draw=()=>{
    const openIdx=[...tagSet].sort((a,b)=>a-b);
    box.innerHTML = openIdx.map(i=>{
      const raw=rawTags[i];
      const info=describeTag(trTag(raw)) || describeTag(raw);
      return info
        ? `<div class="tagdesc"><b>${esc(info.name)}</b><div style="margin-top:4px">${esc(info.description)}</div></div>`
        : `<div class="tagdesc">Описание этого тега пока не найдено в справочнике.</div>`;
    }).join("");
    $$(`${tagsSel} .glossary`).forEach(el=>el.classList.toggle("open", tagSet.has(+el.dataset.tgi)));
  };
  $$(`${tagsSel} .glossary`).forEach(el=>{
    el.onclick=()=>{
      const i=+el.dataset.tgi;
      if(tagSet.has(i)) tagSet.delete(i); else tagSet.add(i);
      draw();
    };
  });
  draw();
}
const rngStr=w=>(w.range||[]).map(x=>`${tr(x.type)} ${x.val}`).join(", ")||"—";
const onHitText=v=>v==null?"":(typeof v==="string"?v:v.detail);

/* Full weapon detail card markup, shared by the weapon picker's detail view
   and the "view installed weapon" modal opened from the loadout list. */
/* ============ PICKER VIEW MODE (shared: weapon/system/core pickers) ============ */

function viewToggleHTML(){

    <button class="chip ${pickerViewMode==='inline'?'on':''}" data-vm="inline">☰ Разворачивать в списке</button>
    <button class="chip ${pickerViewMode==='card'?'on':''}" data-vm="card">▣ Отдельная карточка</button>
  </div>`;
}
function wireViewToggle(onSwitch){

/* Weapon detail content without the name/header — used for the inline
   in-list expansion. weaponCardHTML() (below) wraps this with a header for
   standalone modal views (view-installed / card-mode picker). */
/* Multi-stage weapons (e.g. Apocalypse Rail, ZF4 SOLIDCORE) carry a
   "profiles" array — different damage/range/effect depending on a
   charge/die value. profileViewIdx is purely a *display* toggle for
   browsing those stages inside the card; it isn't part of the saved build. */
let profileViewIdx=0;
const profDmgStr = p => (p.damage||[]).map(x=>x.type?`${x.val} ${tr(x.type)}`:`${x.val}`).join(", ")||"—";
const profRngStr = p => (p.range||[]).map(x=>x.type?`${tr(x.type)} ${x.val}`:`${x.val}`).join(", ")||"—";
function wireProfileChips(sel, redraw, setIdx){
  setIdx = setIdx || (v=>{profileViewIdx=v;});
  $$(`${sel} .profile-chip`).forEach(b=>b.onclick=()=>{ setIdx(+b.dataset.pi); redraw(); });
}

/* `uid`, when given, namespaces the internal element ids (so several of
   these can be expanded on the same page at once — e.g. several equipped
   weapons in the loadout tab) and `curProfIdx` lets the caller supply its
   own per-instance "which stage is shown" value instead of the shared
   global (used by the single-instance modals/pickers). */
/* Combines base weapon tags with the active profile's own tags (some
   multi-stage weapons, like the Leviathan HAC, only carry certain tags in
   specific modes) into one array — used for both rendering the chips and
   as the `rawTags` index base for wireTagGlossary, so data-tgi stays
   consistent between the two. */
function weaponDisplayTags(w, curProfIdx){
  const hasProfiles = w.profiles && w.profiles.length;
  if(!hasProfiles) return w.tags||[];
  const idx = Math.min(curProfIdx!=null?curProfIdx:profileViewIdx, w.profiles.length-1);
  const prof = w.profiles[idx];
  return [...(w.tags||[]), ...((prof&&prof.tags)||[])];
}
function weaponCardBody(w, uid, curProfIdx){
  const tagsId = uid?`wp-tags-${uid}`:"wp-tags", descId = uid?`wp-tagdesc-${uid}`:"wp-tagdesc", profId = uid?`wp-profiles-${uid}`:"wp-profiles";
  const hasProfiles = w.profiles && w.profiles.length;
  const curIdx = curProfIdx!=null ? curProfIdx : profileViewIdx;
  const idx = hasProfiles ? Math.min(curIdx, w.profiles.length-1) : -1;
  const prof = hasProfiles ? w.profiles[idx] : null;
  const dmg = prof ? profDmgStr(prof) : dmgStr(w);
  const rng = prof ? profRngStr(prof) : rngStr(w);
  const dispTags = weaponDisplayTags(w, curIdx);
  return `${hasProfiles?`<div class="profiles" id="${profId}">${w.profiles.map((p,i)=>
      `<button class="chip profile-chip ${i===idx?'on':''}" data-pi="${i}">${esc(p.name)}</button>`).join("")}</div>`:""}
    <div class="tags" id="${tagsId}">
      <span class="tag dmg">${dmg}</span><span class="tag rng">${rng}</span>
      ${w.sp?`<span class="tag sp">${w.sp} SP</span>`:""}
      ${dispTags.map((tg,i)=>`<span class="tag glossary" data-tgi="${i}">${esc(trTag(tg))}</span>`).join("")}
    </div>
    <div id="${descId}"></div>
    ${w.effect?`<div class="desc" style="margin-top:12px">${rich(w.effect)}</div>`:""}
    ${prof && prof.effect?`<div class="desc" style="margin-top:9px"><b>${esc(prof.name)}:</b> ${rich(prof.effect)}</div>`:""}
    ${w.on_attack?`<div class="desc" style="margin-top:9px"><b>При атаке:</b> ${rich(onHitText(w.on_attack))}</div>`:""}
    ${w.on_hit?`<div class="desc" style="margin-top:9px"><b>При попадании:</b> ${rich(onHitText(w.on_hit))}</div>`:""}
    ${w.on_crit?`<div class="desc" style="margin-top:9px"><b>При критическом ударе:</b> ${rich(onHitText(w.on_crit))}</div>`:""}`;
}
function weaponCardHTML(w){
  const lk=!unlocked(w);
  return `<div class="item static">
    <div class="src" style="background:${srcColor(w.source)}"></div>
    <div class="top"><div class="nm" style="font-size:19px">${esc(w.name)}</div>
      <div class="badge ${lk?'lock':''}">${lk?"🔒 "+esc(w.license)+" "+w.license_level:tr(w.mount)}</div></div>
    <div class="meta" style="margin-top:6px">${tr(w.mount)} · ${tr(w.type)}${w.source?" · "+esc(w.source):""}</div>
    <div style="margin-top:11px">${weaponCardBody(w)}</div>
  </div>`;
}

/* Full system detail card markup, shared by the system picker's detail view
   and the "view installed system" modal opened from the loadout list. */
/* Same split as weaponCardBody/weaponCardHTML, for systems. `uid` namespaces
   ids the same way as weaponCardBody, for independently-expandable rows. */
function systemCardBody(s, uid){
  const tagsId = uid?`sy-tags-${uid}`:"sy-tags", descId = uid?`sy-tagdesc-${uid}`:"sy-tagdesc";
  return `<div class="tags" id="${tagsId}">

function systemCardHTML(s){

/* Opens a read-only-ish detail card for an already-installed weapon, with a
   button to remove it from its mount — triggered by clicking the equipped
   slot in the loadout tab. */



/* weapon picker — inline-expand list (default) or separate detail card,
   toggled via viewToggleHTML()/wireViewToggle(). */
let wpSearch="", wpFilter="ALL", wpExpanded=null;
function openWeaponPicker(mi){
  const mt=state.mech.mounts[mi];
  const sizes=mt.items.map(id=>M.weapon[id]?.mount);
  const allow=allowedNext(mt.type,sizes);
  wpSearch=""; wpFilter="ALL"; wpExpanded=null;

  const install=id=>{ state.mech.mounts[mi].items.push(id); closeModal(); render(); };

  const drawDetail=(id)=>{
    const w=M.weapon[id], lk=!unlocked(w);
    tagOpenSet=new Set(); profileViewIdx=0;
    $("#modal .mhd h3").textContent=w.name;
    $("#modal .mbd").innerHTML=
      `<button class="ghostbtn" id="wp-back" style="margin-bottom:14px">← Назад к списку</button>`
      + weaponCardHTML(w) +
      `<button class="ghostbtn" id="wp-install" style="margin-top:16px;width:100%;text-align:center">
        ${lk?"⚠ Установить всё равно (лицензия не открыта)":"✓ Установить это оружие"}
      </button>`;
    wireTagGlossary("#wp-tags", "#wp-tagdesc", weaponDisplayTags(w, profileViewIdx));
    wireProfileChips("#wp-profiles", ()=>drawDetail(id));
    $("#wp-back").onclick=drawList;
    $("#wp-install").onclick=()=>install(w.id);
  };

  const drawList=()=>{
    const list=L.weapons.filter(w=>allow.includes(w.mount) && w.type!=="???" && w.source!=="")
      .filter(w=>wpFilter==="ALL"||w.source===wpFilter)
      .filter(w=>!wpSearch||(w.name+" "+tr(w.type)+" "+w.source+" "+(w.tags||[]).map(trTag).join(" ")).toLowerCase().includes(wpSearch.toLowerCase()))
      .sort((a,b)=>(sourceOrder(a.source)-sourceOrder(b.source))||(unlocked(b)-unlocked(a))||a.name.localeCompare(b.name));
    $("#modal .mhd h3").textContent=`Установить оружие · ${tr(mt.type)}`;
    $("#modal .mbd").innerHTML=
      `<div class="hint" style="margin-bottom:10px">Допустимый размер: ${allow.map(tr).join(" / ")}</div>
       ${viewToggleHTML()}
       <div class="filters">${["ALL","GMS","IPS-N","SSC","HORUS","HA","EXOTIC"].map(s=>`<button class="chip ${wpFilter===s?'on':''}" data-wpf="${s}">${s==="ALL"?"ВСЕ":s}</button>`).join("")}</div>
       <input class="input" id="wp-search" placeholder="поиск оружия…" style="margin-bottom:14px" value="${esc(wpSearch)}">
       <div class="grid" id="wp-list" style="gap:8px"></div>`;
    $("#wp-list").innerHTML=list.map(w=>{
      const lk=!unlocked(w);
      const open=pickerViewMode==="inline" && wpExpanded===w.id;
      const row=`<div class="listrow clickable ${lk?'locked':''} ${open?'open':''}" data-w="${w.id}">
        <div class="info"><div class="nm">${esc(w.name)}</div>
          <div class="ds">${tr(w.mount)} · ${tr(w.type)} · ${dmgStr(w)} · ${rngStr(w)}</div></div>
        ${lk?`<span class="rowbadge lock">🔒 ${esc(w.license)} ${w.license_level}</span>`:`<span class="chevron">${open?'⌄':'›'}</span>`}
      </div>`;
      const expand=open?`<div class="expand-detail">${weaponCardBody(w)}
        <button class="ghostbtn" id="wp-install-inline" style="margin-top:14px;width:100%;text-align:center">
          ${lk?"⚠ Установить всё равно (лицензия не открыта)":"✓ Установить это оружие"}
        </button></div>`:"";
      return `<div class="pickitem">${row}${expand}</div>`;
    }).join("")||`<div class="hint">// нет подходящего оружия</div>`;

    wireViewToggle(drawList);
    $$(".modal .chip[data-wpf]").forEach(c=>c.onclick=()=>{wpFilter=c.dataset.wpf; drawList();});
    const input=$("#wp-search");
    input.oninput=e=>{wpSearch=e.target.value; drawList(); $("#wp-search").focus();};
    if(wpSearch) input.setSelectionRange(input.value.length,input.value.length);

    $$("#wp-list .listrow").forEach(it=>it.onclick=()=>{
      const id=it.dataset.w;
      if(pickerViewMode==="card"){ drawDetail(id); return; }
      wpExpanded = wpExpanded===id?null:id;
      tagOpenSet=new Set(); profileViewIdx=0;
      drawList();
    });
    if(pickerViewMode==="inline" && wpExpanded){
      const w=M.weapon[wpExpanded];
      wireTagGlossary("#wp-tags", "#wp-tagdesc", weaponDisplayTags(w, profileViewIdx));
      wireProfileChips("#wp-profiles", drawList);
      $("#wp-install-inline").onclick=()=>install(w.id);
    }
  };

  modal(`Установить оружие · ${tr(mt.type)}`, "");
  drawList();
}

/* Restores a frame's integrated weapon after it was removed from its
   Integrated mount. Uses the exact same list→detail flow as the normal
   weapon picker (view toggle, inline expand, tag glossary, profile
   switching all work identically) — the only difference is the list
   contains exactly one weapon: the one built into this frame. */
function openIntegratedPicker(mi){
  const mt=state.mech.mounts[mi];
  const w=M.weapon[FRAME_INTEGRATED_WEAPON[state.mech.frameId]];
  wpExpanded=null;

  const install=()=>{ mt.items=[w.id]; closeModal(); render(); };

  const drawDetail=()=>{
    tagOpenSet=new Set(); profileViewIdx=0;
    $("#modal .mhd h3").textContent=w.name;
    $("#modal .mbd").innerHTML=
      `<button class="ghostbtn" id="wp-back" style="margin-bottom:14px">← Назад к списку</button>`
      + weaponCardHTML(w) +
      `<button class="ghostbtn" id="wp-install" style="margin-top:16px;width:100%;text-align:center">✓ Восстановить это оружие</button>`;
    wireTagGlossary("#wp-tags", "#wp-tagdesc", weaponDisplayTags(w, profileViewIdx));
    wireProfileChips("#wp-profiles", drawDetail);
    $("#wp-back").onclick=drawList;
    $("#wp-install").onclick=install;
  };

  const drawList=()=>{
    const open=pickerViewMode==="inline" && wpExpanded===w.id;
    $("#modal .mhd h3").textContent="Восстановить интегрированное оружие";
    $("#modal .mbd").innerHTML=
      `<div class="hint" style="margin-bottom:10px">Это оружие встроено в шасси — заменить его нельзя, можно только вернуть на место.</div>
       ${viewToggleHTML()}
       <div class="grid" id="wp-list" style="gap:8px"></div>`;
    const row=`<div class="listrow clickable ${open?'open':''}" data-w="${w.id}">
      <div class="info"><div class="nm">${esc(w.name)}</div>
        <div class="ds">${tr(w.mount)} · ${tr(w.type)} · ${dmgStr(w)} · ${rngStr(w)}</div></div>
      <span class="chevron">${open?'⌄':'›'}</span>
    </div>`;
    const expand=open?`<div class="expand-detail">${weaponCardBody(w)}
      <button class="ghostbtn" id="wp-install-inline" style="margin-top:14px;width:100%;text-align:center">✓ Восстановить это оружие</button></div>`:"";
    $("#wp-list").innerHTML=`<div class="pickitem">${row}${expand}</div>`;

    wireViewToggle(drawList);
    $$("#wp-list .listrow").forEach(it=>it.onclick=()=>{
      if(pickerViewMode==="card"){ drawDetail(); return; }
      wpExpanded = wpExpanded===w.id?null:w.id;
      tagOpenSet=new Set(); profileViewIdx=0;
      drawList();
    });
    if(pickerViewMode==="inline" && wpExpanded){
      wireTagGlossary("#wp-tags", "#wp-tagdesc", weaponDisplayTags(w, profileViewIdx));
      wireProfileChips("#wp-profiles", drawList);
      $("#wp-install-inline").onclick=install;
    }
  };

  modal("Восстановить интегрированное оружие", "");
  drawList();
}

/* Full-card modal view for an already-installed weapon — opened by clicking
   the equipped row itself. The separate accordion toggle button (next to ✕)
   handles inline in-list expansion instead; this modal is for a focused,
   full-screen look with the same tag glossary / profile switching. */
function viewEquippedWeapon(mi, wi){

/* Same, for an already-installed system. */
function viewEquippedSystem(si){

/* system picker — same inline/card toggle as weapons, but installing a
   system does NOT close the modal (per request): the list just refreshes
   (the newly-installed system drops out, since it's now in state.mech.systems),
   so several systems can be added in one sitting. */
let syFilter="ALL", sySearch="", syExpanded=null;
function openSystemPicker(){
  syFilter="ALL"; sySearch=""; syExpanded=null;

  const install=id=>{
    state.mech.systems.push(id);
    syExpanded=null;
    render();    // updates the loadout tab/HUD (SP counters) behind the modal
    drawList();  // refresh the picker itself; installed item drops out of the list
  };

  const drawDetail=(id)=>{
    const s=M.system[id], lk=!unlocked(s);
    tagOpenSet=new Set();
    $("#modal .mhd h3").textContent=s.name;
    $("#modal .mbd").innerHTML=
      `<button class="ghostbtn" id="sy-back" style="margin-bottom:14px">← Назад к списку</button>`
      + systemCardHTML(s) +
      `<button class="ghostbtn" id="sy-install" style="margin-top:16px;width:100%;text-align:center">
        ${lk?"⚠ Установить всё равно (лицензия не открыта)":"✓ Установить эту систему"}
      </button>`;
    wireTagGlossary("#sy-tags", "#sy-tagdesc", s.tags||[]);
    $("#sy-back").onclick=drawList;
    $("#sy-install").onclick=()=>install(s.id);
  };

  const drawList=()=>{
    const list=L.systems
      .filter(s=>s.source!=="")
      .filter(s=>syFilter==="ALL"||s.source===syFilter)
      .filter(s=>!state.mech.systems.includes(s.id))
      .filter(s=>!sySearch||(s.name+" "+tr(s.type)+" "+s.source+" "+(s.tags||[]).map(trTag).join(" ")).toLowerCase().includes(sySearch.toLowerCase()))
      .sort((a,b)=>(sourceOrder(a.source)-sourceOrder(b.source))||(unlocked(b)-unlocked(a))||a.name.localeCompare(b.name));
    $("#modal .mhd h3").textContent="Добавить систему";
    $("#modal .mbd").innerHTML=
      `${viewToggleHTML()}
       <div class="filters">${["ALL","GMS","IPS-N","SSC","HORUS","HA","EXOTIC"].map(s=>`<button class="chip ${syFilter===s?'on':''}" data-syf="${s}">${s==="ALL"?"ВСЕ":s}</button>`).join("")}</div>
       <input class="input" id="sy-search" placeholder="поиск систем…" style="margin-bottom:14px" value="${esc(sySearch)}">
       <div class="grid" id="sy-list" style="gap:8px"></div>`;
    $("#sy-list").innerHTML=list.map(s=>{
      const lk=!unlocked(s);
      const open=pickerViewMode==="inline" && syExpanded===s.id;
      const row=`<div class="listrow clickable ${lk?'locked':''} ${open?'open':''}" data-s="${s.id}">
        <div class="info"><div class="nm">${esc(s.name)}</div>
          <div class="ds">${esc(tr(s.type))} · ${s.sp} SP</div></div>
        ${lk?`<span class="rowbadge lock">🔒 ${esc(s.license)} ${s.license_level}</span>`:`<span class="chevron">${open?'⌄':'›'}</span>`}
      </div>`;
      const expand=open?`<div class="expand-detail">${systemCardBody(s)}
        <button class="ghostbtn" id="sy-install-inline" style="margin-top:14px;width:100%;text-align:center">
          ${lk?"⚠ Установить всё равно (лицензия не открыта)":"✓ Установить эту систему"}
        </button></div>`:"";
      return `<div class="pickitem">${row}${expand}</div>`;
    }).join("")||`<div class="hint">// нет систем</div>`;

    wireViewToggle(drawList);
    $$(".modal .chip[data-syf]").forEach(c=>c.onclick=()=>{syFilter=c.dataset.syf; drawList();});
    const input=$("#sy-search");
    input.oninput=e=>{sySearch=e.target.value; drawList(); $("#sy-search").focus();};
    if(sySearch) input.setSelectionRange(input.value.length,input.value.length);

    $$("#sy-list .listrow").forEach(it=>it.onclick=()=>{
      const id=it.dataset.s;
      if(pickerViewMode==="card"){ drawDetail(id); return; }
      syExpanded = syExpanded===id?null:id;
      tagOpenSet=new Set();
      drawList();
    });
    if(pickerViewMode==="inline" && syExpanded){
      const s=M.system[syExpanded];
      wireTagGlossary("#sy-tags", "#sy-tagdesc", s.tags||[]);
      $("#sy-install-inline").onclick=()=>install(s.id);
    }
  };

  modal("Добавить систему", "");
  drawList();
}
