<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LANCER // РЕЕСТР — конструктор меха и пилота</title>
<meta name="description" content="Конструктор пилота и меха для настольной ролевой игры Lancer. Данные: massif-press/lancer-data.">
<!-- The loader runs from scripts at the end of <body>, so nothing would be
     requested until they are fetched and executed. These four files are
     1.5MB of the 2.2MB payload and are always needed; starting them during
     parse overlaps network with parsing instead of queueing behind it. The
     rest are small enough to ride the same wave. -->
<link rel="preload" as="fetch" type="application/json" href="data/lancer-data.json" crossorigin>
<link rel="preload" as="fetch" type="application/json" href="locales/ru/systems.json" crossorigin>
<link rel="preload" as="fetch" type="application/json" href="locales/ru/frames.json" crossorigin>
<link rel="preload" as="fetch" type="application/json" href="locales/ru/talents.json" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/sheet.css">
</head>
<body>

<div id="boot">
  <div class="ring"></div>
  <div class="blog">ИНИЦИАЛИЗАЦИЯ…</div>
  <div class="ttl">LANCER · UNION REGISTRY</div>
</div>

<header class="topbar">
  <div class="brand">
    <span class="sig mono">//</span>
    <span class="name">LANCER <b>РЕЕСТР</b></span>
    <span class="ver mono">COMP/CON v1</span>
  </div>
  <div class="spacer"></div>
  <span class="savestate" id="savestate" aria-live="polite"></span>
  <button class="toolbtn mode" id="t-sheet">▤ ЛИСТ</button>
  <button class="toolbtn" id="t-link" hidden>🔗 ССЫЛКА</button>
  <button class="toolbtn" id="t-print" hidden>🖨 ПЕЧАТЬ</button>
  <button class="toolbtn" id="t-lang" title="Переключить язык контента / Toggle content language">RU / EN</button>
  <button class="toolbtn" id="t-import">⬆ ЗАГРУЗИТЬ</button>
  <button class="toolbtn" id="t-export">⬇ СОХРАНИТЬ</button>
  <button class="toolbtn warn" id="t-reset">⟲ СБРОС</button>
  <input type="file" id="import-file" accept="application/json" hidden>
</header>

<div class="shell">
  <aside class="hud" id="hud"></aside>
  <main>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div id="tab" class="section show" role="tabpanel"></div>
  </main>
</div>

<div id="sheet" class="sheetview" hidden></div>

<div id="print-sheet" style="display:none"></div>

<div class="modal" id="modal">
  <div class="panel" role="dialog" aria-modal="true">
    <div class="mhd"><h3></h3><button class="toolbtn mclose">✕ ЗАКРЫТЬ</button></div>
    <div class="mbd"></div>
  </div>
</div>

<!-- Single global stat-glossary tooltip, kept as a direct child of <body>
     (outside every panel/card). Any tooltip nested inside a card can end up
     clipped or out-stacked by that card's own rendering context in some
     browsers even with position:fixed, if an ancestor sets a property that
     creates a new containing block (filter/transform/etc.) — living at the
     top level sidesteps that class of bug entirely. See wireStatTooltips(). -->
<div class="stattip-box" id="global-stattip"></div>

<!-- Plain (non-module) scripts sharing one global scope, executed in this
     order — it is the order the code had as one inline script, and later files
     use top-level names from earlier ones. Add a file in its place in this
     list, and to SITE_PATHS-covered folders only (css/, js/). js/core/ holds
     the DOM-free logic that tests/unit/ loads under Node. -->
<script src="js/core/i18n.js"></script>
<script src="js/core/build.js"></script>
<script src="js/core/rules.js"></script>
<script src="js/core/share.js"></script>
<script src="js/i18n-loader.js"></script>
<script src="js/app/base.js"></script>
<script src="js/app/state.js"></script>
<script src="js/app/license-ui.js"></script>
<script src="js/app/frame-swap.js"></script>
<script src="js/app/render.js"></script>
<script src="js/tabs/pilot.js"></script>
<script src="js/tabs/skills.js"></script>
<script src="js/tabs/talents.js"></script>
<script src="js/tabs/hase.js"></script>
<script src="js/tabs/licenses.js"></script>
<script src="js/tabs/frame.js"></script>
<script src="js/tabs/loadout.js"></script>
<script src="js/ui/pickers.js"></script>
<script src="js/tabs/summary.js"></script>
<script src="js/tabs/core.js"></script>
<script src="js/ui/modal.js"></script>
<script src="js/app/transfer.js"></script>
<script src="js/sheet.js"></script>
<script src="js/print.js"></script>
<script src="js/main.js"></script>
</body>
</html>
