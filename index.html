<style>/* ============ LANCER // REGISTRY ============ */
/* z-index scale in use across this file (documented, not enforced):
   60 .topbar · 120 .modal · 200 #boot · 1000 .stattip-box (must clear the
   modal, since tooltips inside modal content need to sit above it). */
:root{
  --bg:#080b11;
  --bg-grid:#0b0f17;
  --panel:#0f141d;
  --panel-2:#161d28;
  --panel-3:#1c2532;
  --line:#243040;
  --line-bright:#36485e;
  --ink:#dbe4f0;
  --mute:#7d8ca0;
  --faint:#6b7c94;
  --accent:#37e0c0;      /* COMP/CON teal — brand, focus, positive stat values */
  --accent-deep:#0f4f45;
  --accent-glow:rgba(55,224,192,.16);
  --select:#ffb020;      /* selection/active state — separate from --accent so
                            "chosen" reads distinctly from "brand/positive" */
  --select-glow:rgba(255,176,32,.16);
  --amber:#f4a93a;       /* warning / over-budget */
  --ok:#4fae6e;          /* unlocked license requirement met */
  --amber-glow:rgba(244,169,58,.14);
  --red:#e5604f;
  --gms:#d8604c; --ipsn:#3f8fd6; --ssc:#d8c160; --horus:#52b585; --ha:#9d6fdd; --exotic:#e8398a;
  --shadow:0 18px 50px -20px rgba(0,0,0,.8);
  /* Paper is its own surface, not the dark UI inverted: printed output has
     exactly three values — ink, rule, and the sheet itself. */
  --print-paper:#fff; --print-ink:#000; --print-rule:#666;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Inter",system-ui,sans-serif; font-size:16.5px; line-height:1.55;
  background-image:
    linear-gradient(var(--bg-grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"Chakra Petch",sans-serif; font-weight:600; letter-spacing:.02em; margin:0}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
a{color:var(--accent)}
button{font-family:inherit; cursor:pointer}
::selection{background:var(--accent); color:#04130f}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---- boot overlay ---- */
#boot{position:fixed; inset:0; z-index:200; background:var(--bg);
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:18px;
  transition:opacity .5s ease; font-family:"JetBrains Mono",monospace}
#boot.done{opacity:0; pointer-events:none}
#boot .ring{width:54px;height:54px;border:2px solid var(--line);border-top-color:var(--accent);
  border-radius:50%; animation:spin .8s linear infinite}
#boot .blog{color:var(--accent); font-size:13.5px; min-height:1.4em; letter-spacing:.06em}
#boot .ttl{color:var(--faint); font-size:12px; letter-spacing:.4em}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- header ---- */
.topbar{position:sticky; top:0; z-index:60; backdrop-filter:blur(8px);
  background:linear-gradient(180deg,rgba(8,11,17,.96),rgba(8,11,17,.82));
  border-bottom:1px solid var(--line); padding:11px clamp(14px,3vw,30px);
  display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.brand{display:flex; align-items:baseline; gap:11px}
.brand .sig{font-family:"JetBrains Mono",monospace; color:var(--accent); font-size:14px; letter-spacing:.12em}
.brand .name{font-family:"Chakra Petch"; font-size:clamp(17px,5vw,21px); letter-spacing:.06em}
.brand .name b{color:var(--accent)}
.brand .ver{font-family:"JetBrains Mono",monospace; font-size:11.5px; color:var(--faint);
  border:1px solid var(--line); padding:1px 6px; border-radius:3px; align-self:center}
.topbar .spacer{flex:1}
.toolbtn{background:var(--panel-2); border:1px solid var(--line); color:var(--ink);
  font-family:"JetBrains Mono",monospace; font-size:12.5px; letter-spacing:.05em;
  padding:9px 14px; border-radius:5px; display:inline-flex; gap:7px; align-items:center; transition:.15s;
  min-height:44px; justify-content:center}
/* display:inline-flex above outranks the UA's [hidden]{display:none}, so the
   attribute needs saying again here or nothing ever hides. */
.toolbtn[hidden]{display:none}
.toolbtn:hover{border-color:var(--accent); color:var(--accent); box-shadow:0 0 0 1px var(--accent-glow)}
.toolbtn.warn:hover{border-color:var(--amber); color:var(--amber); box-shadow:none}
/* Save-state readout — the product's only ambient proof that work is kept.
   Sits left of the tool buttons as a plain mono label, never as a badge; it
   goes amber only when a write actually failed (private mode, full quota),
   because that is the one case where the user must reach for СОХРАНИТЬ. */
.savestate{font-family:"JetBrains Mono",monospace; font-size:11.5px; letter-spacing:.06em;
  color:var(--mute); white-space:nowrap}
.savestate .pfx{font-style:normal}
.savestate.err{color:var(--amber)}
/* The header already wraps to several rows on a phone; the word СОХРАНЕНО is
   what pushes it over. The timestamp alone still answers "is my work kept?",
   so only the label goes. The failure state keeps its full wording — that one
   has to be readable at a glance. */
@media(max-width:560px){
  .savestate:not(.err) .pfx{display:none}
}

/* ---- layout ---- */
.shell{display:grid; grid-template-columns:344px 1fr; gap:clamp(16px,2.4vw,32px);
  max-width:1680px; margin:0 auto; padding:clamp(18px,2.6vw,34px)}
@media(max-width:1020px){.shell{grid-template-columns:1fr}}

/* ---- HUD sidebar ---- */
.hud{position:sticky; top:78px; align-self:start; display:flex; flex-direction:column; gap:14px;
  max-height:calc(100vh - 96px); overflow:auto; padding-right:2px}
@media(max-width:1020px){.hud{position:static; max-height:none}}
.hud::-webkit-scrollbar{width:7px}
.hud::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px}

.card{position:relative; background:
    linear-gradient(180deg,var(--panel),var(--panel) 38px,var(--bg-grid) 38px,var(--panel));
  background:var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow)}
.card::before,.card::after{content:""; position:absolute; width:9px; height:9px; pointer-events:none}
.card::before{top:-1px; left:-1px; border-top:2px solid var(--accent); border-left:2px solid var(--accent); border-radius:2px 0 0 0}
.card::after{bottom:-1px; right:-1px; border-bottom:2px solid var(--accent); border-right:2px solid var(--accent); border-radius:0 0 2px 0}
.card .head{display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:10px 14px; border-bottom:1px solid var(--line)}
.card .head .lbl{font-family:"JetBrains Mono",monospace; font-size:12px; letter-spacing:.16em; color:var(--mute)}
.card .head .lbl b{color:var(--accent); font-weight:400}
.card .body{padding:14px}

.hud .pid{font-family:"Chakra Petch"; font-size:23px; line-height:1.15}
.hud .pid small{display:block; font-family:"JetBrains Mono",monospace; font-size:12px;
  color:var(--accent); letter-spacing:.12em; margin-top:3px}
.hud .ll{margin-top:12px; display:flex; align-items:center; gap:10px}
.hud .ll .big{font-family:"Chakra Petch"; font-size:33px; color:var(--accent); line-height:1}
.hud .ll .meta{font-family:"JetBrains Mono",monospace; font-size:11.5px; color:var(--faint); letter-spacing:.08em}

/* budget rows */
.budget{display:flex; flex-direction:column; gap:9px}
.brow{display:grid; grid-template-columns:1fr auto; gap:4px 8px; align-items:center}
.brow .nm{font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--mute); letter-spacing:.04em}
.brow .val{font-family:"JetBrains Mono",monospace; font-size:13px; color:var(--ink)}
.brow .val.over{color:var(--amber)}
.brow .bar{grid-column:1/3; height:4px; background:var(--panel-3); border-radius:3px; overflow:hidden}
.brow .bar i{display:block; height:100%; background:var(--accent); border-radius:3px; transition:width .25s}
.brow .bar i.over{background:var(--amber)}

/* mech stat grid in HUD */
.statgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:7px}
@media(max-width:680px){.statgrid{grid-template-columns:repeat(2,1fr)}}

/* Unified stat-display tile — a bordered box showing a key/icon and a value.
   Four call sites share this one base via modifier classes instead of four
   near-duplicate rule blocks: the plain vertical tile (СВОДКА/CORE tabs),
   .compact (icon+value only, no text key — СВОДКА МЕХА HUD card), .row
   (horizontal icon+key+value — ВЫБРАННОЕ ШАССИ frame detail), and .pg
   (pilot-gear armor tile, its own icon/label/value class names since it
   already had them before consolidation). */
.stattile{position:relative; background:var(--bg-grid); border:1px solid var(--line); border-radius:5px;
  padding:7px 6px 6px; text-align:center}
.stattile .k{font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.07em; color:var(--faint); display:block; min-height:2.2em}
.stattile .v{font-family:"Chakra Petch"; font-size:21px; color:var(--ink); line-height:1}
.stattile.hl .v{color:var(--accent)}

/* Compact icon+value tile (no text label). Value font size intentionally
   matches .stattile.row .v below, so both this and the ВЫБРАННОЕ ШАССИ card
   read at the same visual scale. */
.stattile.compact{display:flex; align-items:center; justify-content:center; gap:9px; padding:11px 8px}
.stattile.compact .v{font-size:26px}

/* Horizontal [icon] LABEL ... value row — used in the ВЫБРАННОЕ ШАССИ card
   (frameDetailBodyHTML) instead of the cramped square vertical tiles. */
.statrows{margin-bottom:16px}
.statrow-line{display:grid; gap:8px; margin-bottom:8px}
.statrow-line:last-child{margin-bottom:0}
.statrow-line.cols3{grid-template-columns:repeat(3,1fr)}
.statrow-line.cols2{grid-template-columns:repeat(2,1fr)}
.stattile.row{display:flex; align-items:center; gap:10px; border-radius:6px; padding:9px 12px; text-align:left}
.stattile.row .k{font-size:13px; letter-spacing:.06em; color:var(--mute); flex:1; display:inline; min-height:0}
.stattile.row .v{font-size:26px; flex-shrink:0}
.hud .nomech{font-family:"JetBrains Mono",monospace; font-size:12.5px; color:var(--faint); text-align:center; padding:14px 4px; letter-spacing:.05em}
/* Pilot armor stat tiles (Armor/HP Bonus/E-Defense/Evasion/Speed) shown on
   a pilot_gear card when it's Armor-type with a bonuses[] array — mirrors
   the reference layout: a row of equal tiles, icon + label above a big
   accent-colored number. */
.pgstats{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px}
.stattile.pg{flex:1; min-width:84px; background:var(--panel-2); border-radius:8px; padding:10px 8px}
@media(max-width:480px){.stattile.pg{min-width:64px}}
.stattile.pg .ico{font-size:16px; margin-bottom:2px; opacity:.85}
.stattile.pg .lbl{font-family:"JetBrains Mono",monospace; font-size:9.5px; letter-spacing:.08em; color:var(--faint)}
.stattile.pg .val{font-family:"Chakra Petch"; font-size:19px; color:var(--accent); line-height:1.3}

/* stat glossary tooltip (hover icon, compcon.app-style).
   position:fixed + JS-computed coordinates (see wireStatTooltips()) instead
   of position:absolute — an absolutely-positioned tooltip gets clipped by
   any scrollable ancestor (e.g. the HUD sidebar has overflow:auto for its
   own scrollbar), fixed positioning escapes that entirely. */
.stattip{position:relative; display:inline-flex; align-items:center; justify-content:center; margin-left:5px; width:16px; height:16px;
  cursor:help; vertical-align:middle; opacity:.8; transition:.15s; font-size:12px; color:var(--faint)}
.stattip:hover{opacity:1; color:var(--accent)}
.stattip.lg{width:38px; height:38px; margin-left:0; flex-shrink:0}
.stattip-icon{width:100%; height:100%; object-fit:contain; display:block}
.stattip-box{display:none; position:fixed;
  width:400px; max-width:80vw; background:var(--panel-2); border:1px solid var(--line-bright); border-radius:9px;
  padding:16px 18px; font-family:"Inter",sans-serif; font-size:16px; line-height:1.5; color:var(--ink);
  text-align:left; text-transform:none; z-index:1000; box-shadow:0 10px 28px rgba(0,0,0,.45); letter-spacing:normal; font-weight:400}
.stattip-box b{display:block; margin-bottom:6px; color:var(--accent); font-family:"Chakra Petch"; font-size:18px; font-weight:500}

/* ---- tabs ---- */
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px}
.tab{background:var(--panel); border:1px solid var(--line); color:var(--mute);
  font-family:"JetBrains Mono",monospace; font-size:12.5px; letter-spacing:.05em;
  padding:10px 15px; border-radius:6px; display:flex; align-items:center; gap:8px; transition:.15s}
.tab .ix{color:var(--faint); font-size:11px}
.tab:hover{color:var(--ink); border-color:var(--line-bright)}
.tab.active{color:var(--select); border-color:var(--select); background:var(--panel-2);
  box-shadow:inset 0 0 0 1px var(--select-glow)}
.tab.active .ix{color:var(--select)}
.tab .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.tab .dot.warn{background:var(--amber)}

/* ---- section ---- */
.section{display:none}
.section.show{display:block; animation:fade .3s ease}
@keyframes fade{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}
.sechead{margin-bottom:16px}
.sechead .mk{font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--accent); letter-spacing:.16em}
.sechead h2{font-size:27px; margin-top:3px}
.sechead p{color:var(--mute); font-size:14.5px; margin:6px 0 0; max-width:62ch}

/* Recurring in-content sub-heading (e.g. "// СНАРЯЖЕНИЕ ПИЛОТА") — margin
   varies by context so it stays a small inline style alongside this class. */
.subhead{font-family:"Chakra Petch"; font-size:17.5px}

/* form fields */
.field{margin-bottom:14px}
.field>label{display:block; font-family:"JetBrains Mono",monospace; font-size:12px;
  letter-spacing:.1em; color:var(--mute); margin-bottom:6px}
.input,select,textarea{width:100%; background:var(--bg-grid); border:1px solid var(--line);
  color:var(--ink); border-radius:6px; padding:9px 11px; font-family:inherit; font-size:15px; transition:.15s}
.input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow)}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}

/* LL slider */
.llpick{display:flex; align-items:center; gap:14px; background:var(--bg-grid);
  border:1px solid var(--line); border-radius:8px; padding:14px 16px}
.llpick input[type=range]{flex:1; accent-color:var(--accent)}
.llpick .num{font-family:"Chakra Petch"; font-size:37px; color:var(--accent); min-width:54px; text-align:center}
.llpick .lab{font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--faint); letter-spacing:.08em}

/* generic item card grid */
.grid{display:grid; gap:12px}
.grid.cards{grid-template-columns:repeat(auto-fill,minmax(288px,1fr))}
.grid.stacked{grid-template-columns:1fr}
.item{position:relative; background:var(--panel); border:1px solid var(--line);
  border-radius:8px; padding:13px 14px; transition:.15s; cursor:pointer}
.item:hover{border-color:var(--line-bright)}
.item.sel{border-color:var(--select); box-shadow:inset 0 0 0 1px var(--select-glow)}
.item.locked{opacity:.55; filter:saturate(.4)}
.item.static{cursor:default}
.item.static:hover{border-color:var(--line)}
.item .src{position:absolute; top:0; left:0; bottom:0; width:5px; border-radius:8px 0 0 8px}
/* Frame portrait thumbnail, hotlinked (never downloaded/stored). Used as a
   flex item (never position:absolute) so it always occupies real space in
   the layout and can't cover text — see the .item markup that wraps it
   together with a flex:1 text column. object-fit:contain keeps the art's
   own aspect ratio. */
.frame-thumb{width:58px; height:58px; object-fit:contain; border-radius:6px;
  opacity:.95; flex-shrink:0; background:var(--panel-2)}
.frame-thumb.lg{width:100px; height:100px}
.item .top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px}
.item .nm{font-family:"Chakra Petch"; font-size:17.5px; line-height:1.2}
.item .badge{font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.06em;
  color:var(--mute); border:1px solid var(--line); padding:2px 6px; border-radius:4px; white-space:nowrap}
.item .badge.lock{color:var(--amber); border-color:var(--amber)}
.item .badge.unlocked{color:var(--ok); border-color:var(--ok)}
/* Manufacturer chip — reads a per-instance color from the inline custom
   property `--src` (set to srcColor(item.source) at the call site) so this
   one rule covers every manufacturer hue without per-source CSS. Low-alpha
   fill keeps text legible across all 6 source colors, including the
   lighter SSC yellow / HORUS green against the dark panel background. */
.item .badge.mfg{font-weight:600; color:var(--src); border-color:var(--src);
  background:color-mix(in srgb, var(--src) 22%, transparent)}
.item .tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:9px}
/* 3-per-row stat grid — frame-list quick stats only (renderFrame()), forces
   a stable 2-row/3-col layout regardless of pill content width, unlike the
   plain flex-wrap .tags used for variable-length glossary tag rows. */
.tags.stat-grid{display:grid; grid-template-columns:repeat(3,1fr)}
.tags.stat-grid .tag{text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tag{font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.03em;
  color:var(--accent); background:var(--accent-deep); border-radius:4px; padding:2px 6px}
/* Headline-stat variant — used for the 2-3 stats worth comparing at a glance
   in a dense card grid (currently only the ШАССИ list, see renderFrame()),
   so they read as a tier above secondary tags (SP, mount type, flavor). */
.tag.stat{font-size:12px; font-weight:600; padding:3px 6px}
.tag.sp{color:var(--amber); background:var(--amber-glow)}
.tag.dmg{color:#ffcaa0; background:rgba(229,96,79,.16)}
.tag.rng{color:#a9c9ff; background:rgba(63,143,214,.16)}
.tag.glossary{cursor:pointer; border-bottom:1px dotted currentColor; transition:.12s}
.tag.glossary:hover{filter:brightness(1.25)}
.tag.glossary.open{outline:1px solid currentColor}
.tagdesc{background:var(--panel-2); border:1px solid var(--line-bright); border-radius:7px;
  padding:10px 12px; margin-top:9px; font-size:13.5px; color:var(--mute)}
.tagdesc b{color:var(--ink); font-family:"Chakra Petch"; font-size:14px}
.desc{color:var(--mute); font-size:13.5px; margin-top:9px}
/* Structured action block — CORE powers and weapon "actions" that have real
   mechanical shape (an activation cost, sometimes a trigger, sometimes
   attack stats) instead of just flowing prose. Left border + badge colored
   per activation type so Quick/Protocol/Full read apart at a glance. */
.action-block{background:var(--panel-2); border:1px solid var(--line); border-left:3px solid var(--line-bright);
  border-radius:8px; padding:12px 14px; margin-top:10px}
.action-block.act-quick{border-left-color:#8b7fe8}
.action-block.act-protocol{border-left-color:var(--accent)}
.action-block.act-full{border-left-color:var(--amber)}
.action-block.act-reaction{border-left-color:#e87f9e}
.action-block.act-free{border-left-color:var(--faint)}
.action-head{display:flex; align-items:center; justify-content:space-between; gap:10px}
.action-nm{font-family:"Chakra Petch"; font-size:14.5px; letter-spacing:.02em}
.action-badge{font-family:"JetBrains Mono",monospace; font-size:10.5px; letter-spacing:.08em; color:var(--mute);
  border:1px solid var(--line-bright); border-radius:4px; padding:2px 7px; flex-shrink:0}
.action-stats{display:flex; gap:16px; margin-top:9px; flex-wrap:wrap}
@media(max-width:480px){.action-stats{gap:10px}}
.action-stat{font-family:"Chakra Petch"; font-size:15px; display:flex; align-items:center; gap:5px}
.action-stat .u{font-family:"JetBrains Mono",monospace; font-size:10px; color:var(--faint); letter-spacing:.05em; margin-left:2px}
.action-row{margin-top:8px}
.action-lbl{display:block; font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.1em; color:var(--faint); margin-bottom:2px}
.item .meta{font-family:"JetBrains Mono",monospace; font-size:11.5px; color:var(--faint);
  letter-spacing:.05em; margin-top:8px; display:flex; gap:10px; flex-wrap:wrap}

/* stepper for skills/talents/hase */
.stepper{display:flex; align-items:center; gap:8px}
.stepbtn{width:44px; height:44px; border-radius:6px; background:var(--panel-2);
  border:1px solid var(--line); color:var(--ink); font-size:18px; line-height:1; display:grid; place-items:center; transition:.12s}
.stepbtn:hover{border-color:var(--accent); color:var(--accent)}
.stepbtn:disabled{opacity:.32; cursor:not-allowed; border-color:var(--line); color:var(--faint)}
.stepval{font-family:"Chakra Petch"; font-size:19.5px; min-width:48px; text-align:center; color:var(--accent)}
.pips{display:flex; gap:3px}
.pip{width:13px;height:6px;border-radius:2px;background:var(--panel-3); border:1px solid var(--line)}
.pip.on{background:var(--select); border-color:var(--select)}
.pip.locked{border-style:dashed; opacity:.45}

.listrow{display:flex; justify-content:space-between; align-items:center; gap:14px;
  background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px}
.listrow .info{min-width:0}
.listrow .info .nm{font-family:"Chakra Petch"; font-size:17.5px}
.listrow .info .ds{color:var(--mute); font-size:13.5px; margin-top:3px}
.listrow.maxed{border-color:var(--select)}
.listrow.clickable{cursor:pointer; transition:.12s}
.listrow.clickable:hover{border-color:var(--line-bright); background:var(--panel-2)}
.listrow.locked{opacity:.68}
.rowbadge{font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.06em;
  color:var(--mute); border:1px solid var(--line); padding:2px 6px; border-radius:4px; white-space:nowrap; flex-shrink:0}
.rowbadge.lock{color:var(--amber); border-color:var(--amber)}
.rowbadge.unlocked{color:var(--ok); border-color:var(--ok)}
.chevron{color:var(--faint); font-size:19px; flex-shrink:0; font-family:"Chakra Petch"}
.viewtoggle{display:flex; gap:8px; margin-bottom:12px}
.profiles{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:11px}
.pickitem{display:block}
.listrow.open{border-color:var(--select); border-bottom-left-radius:0; border-bottom-right-radius:0}
.expand-detail{background:var(--panel-2); border:1px solid var(--accent); border-top:0;
  border-radius:0 0 8px 8px; padding:14px; margin-top:-1px}

/* talent rank descriptions */
.rankbox{margin-top:10px; display:flex; flex-direction:column; gap:7px}
.rankline{display:flex; gap:9px; font-size:13.5px; color:var(--faint); transition:.15s}
.rankline .rk{font-family:"JetBrains Mono",monospace; font-size:11.5px; color:var(--faint);
  border:1px solid var(--line); border-radius:4px; padding:1px 6px; height:fit-content}
.rankline.active{color:var(--ink)}
.rankline.active .rk{color:var(--select); border-color:var(--select)}

/* mount blocks */
.mount{background:var(--panel); border:1px solid var(--line); border-radius:9px; margin-bottom:14px; overflow:hidden}
.mount.integrated{border-color:var(--line-bright)}
.mount .mhead{display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:11px 14px; background:var(--panel-2); border-bottom:1px solid var(--line)}
.mount .mhead .mt{font-family:"Chakra Petch"; font-size:17.5px}
.mount .mhead .cap{font-family:"JetBrains Mono",monospace; font-size:11.5px; color:var(--faint); letter-spacing:.06em}
.mount .slot{padding:15px 16px; border-bottom:1px solid var(--line-bright)}
.mount .slot:last-child{border-bottom:0}
.equipped{display:flex; align-items:center; justify-content:space-between; gap:12px}
.equipped .ei{min-width:0}
.equipped .ei.clickable{cursor:pointer; border-radius:6px; padding:4px 6px; margin:-4px -6px; transition:.12s}
.equipped .ei.clickable:hover{background:var(--panel-3)}
.listrow .info.clickable{cursor:pointer; border-radius:6px; padding:2px 4px; margin:-2px -4px; transition:.12s}
.listrow .info.clickable:hover{background:var(--panel-3)}
.equipped .ei .en{font-family:"Chakra Petch"; font-size:16.5px}
.equipped .ei .em{font-family:"JetBrains Mono",monospace; font-size:11.5px; color:var(--faint); margin-top:2px}
.empty-slot{display:flex; align-items:center; gap:10px; color:var(--faint);
  font-family:"JetBrains Mono",monospace; font-size:13px; letter-spacing:.04em}

.ghostbtn{background:transparent; border:1px dashed var(--line-bright); color:var(--accent);
  font-family:"JetBrains Mono",monospace; font-size:12.5px; letter-spacing:.05em;
  padding:9px 14px; border-radius:6px; transition:.15s}
.ghostbtn:hover{border-style:solid; box-shadow:0 0 0 3px var(--accent-glow)}
.ghostbtn.warn{border-color:var(--red); color:var(--red)}
.ghostbtn.warn:hover{box-shadow:0 0 0 3px rgba(229,96,79,.22)}
/* Full-width centered variant — the recurring install/remove/back action
   button at the bottom (or top) of a modal panel. Margin-top varies by
   context, so it stays a small utility class alongside .block rather than
   being baked into one fixed value. */
.ghostbtn.block{width:100%; text-align:center}
.mt-10{margin-top:10px} .mt-12{margin-top:12px} .mt-14{margin-top:14px} .mt-16{margin-top:16px}
.mb-14{margin-bottom:14px}
.xbtn{background:var(--panel-2); border:1px solid var(--line); color:var(--mute);
  width:44px;height:44px; border-radius:6px; font-size:15px; display:grid; place-items:center; transition:.12s}
.xbtn:hover{border-color:var(--red); color:var(--red)}
.xbtn.expand:hover{border-color:var(--accent); color:var(--accent)}

/* filters */
.filters{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:16px; align-items:center}
/* Labeled filter row — wraps a .filters chip row with a small caption
   (e.g. "ТИП:") so multiple filter dimensions stacked in one picker read
   as distinct categories instead of one undifferentiated wall of chips. */
.filter-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px}
.filter-row .filter-lbl{font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.08em; color:var(--faint); flex-shrink:0}
.filter-row .filters{margin-bottom:0}
/* Sticks a picker's stack of filter rows to the top of the scrolling modal
   body (.modal .mbd) so they stay reachable while the results list below
   scrolls — needs its own opaque background or the list would show through. */
.picker-sticky-filters{position:sticky; top:-18px; z-index:5; background:var(--panel);
  margin:0 -20px 2px; padding:20px 20px 12px; border-bottom:1px solid var(--line)}
.chip{background:var(--panel); border:1px solid var(--line); color:var(--mute);
  font-family:"JetBrains Mono",monospace; font-size:12px; letter-spacing:.04em; padding:7px 13px;
  border-radius:20px; transition:.15s}
.chip:hover{color:var(--ink)}
.chip.on{color:#06140f; background:var(--select); border-color:var(--select); font-weight:600}
.searchwrap{flex:1; min-width:160px}

/* modal */
.modal{position:fixed; inset:0; z-index:120; display:none; align-items:flex-start; justify-content:center;
  background:rgba(4,6,10,.74); backdrop-filter:blur(3px); padding:5vh 16px; overflow:auto; overflow-anchor:none}
.modal.show{display:flex}
.modal .panel{background:var(--panel); border:1px solid var(--line-bright); border-radius:10px;
  width:clamp(880px,72vw,1560px); max-width:94vw; box-shadow:var(--shadow)}
.modal .mhd{display:flex; align-items:center; justify-content:flex-start; gap:14px; padding:16px 20px; border-bottom:1px solid var(--line)}
.modal .mhd h3{flex:0 1 auto; min-width:0; font-size:20px}
.modal .mhd .mclose{margin-left:auto; flex-shrink:0}
.modal .mbd{padding:18px 20px; max-height:70vh; overflow:auto; overflow-anchor:none}
/* Narrow panel for confirmations and notices — the wide picker width would
   make a four-line question look like an empty page. */
.modal .panel.narrow{width:clamp(320px,46vw,620px)}

/* Confirmation dialog. The loss list is the whole point of this component:
   a destructive action must name what disappears before it happens, which is
   exactly what the native confirm() it replaces could never do. */
.dialog p{margin:0 0 12px; font-size:16.5px; line-height:1.55}
.dialog p:last-of-type{margin-bottom:0}
.dialog .losslist{list-style:none; margin:0; padding:12px 14px; background:var(--bg-grid);
  border:1px solid var(--line); border-radius:8px; display:flex; flex-direction:column; gap:6px}
.dialog .losslist li{font-family:"JetBrains Mono",monospace; font-size:12.5px; color:var(--mute);
  letter-spacing:.03em; display:flex; gap:8px}
.dialog .losslist li::before{content:"—"; color:var(--faint); flex-shrink:0}
.dialog .losslist li.keep{color:var(--accent)}
.dialog .losslist li.keep::before{content:"↳"; color:var(--accent)}
.dialog .losslist li.drop::before{content:"✕"; color:var(--amber)}
/* A share URL is data to copy, not a loss to mourn: no marker, and it has to
   be allowed to break anywhere or it pushes the dialog wider than the panel. */
.dialog .losslist li.plain{color:var(--ink); word-break:break-all}
.dialog .losslist li.plain::before{content:none}
.dialog .losslist.scroll{max-height:34vh; overflow:auto}
.dialog-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:18px}
.dialog-actions .ghostbtn{flex:1 1 200px; text-align:center}

/* summary sheet */
.sheet{display:grid; grid-template-columns:1fr 1fr; gap:16px}
@media(max-width:760px){.sheet{grid-template-columns:1fr}}
.sheet .full{grid-column:1/-1}
.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:14.5px}
.kv .k{font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--mute); letter-spacing:.04em}
.sheet h3{font-family:"Chakra Petch"; font-size:18.5px; margin-bottom:10px;
  padding-bottom:7px; border-bottom:1px solid var(--line)}
.sheet h3 .hash{color:var(--accent); font-family:"JetBrains Mono",monospace; font-size:13.5px}
.minilist{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:6px}
.minilist li{font-size:14px; display:flex; gap:8px}
.minilist li .mk{color:var(--accent); font-family:"JetBrains Mono",monospace}
.minilist li.clickable{cursor:pointer; border-radius:5px; padding:2px 4px; margin:-2px -4px; transition:.12s}
.minilist li.clickable:hover{background:var(--panel-2); color:var(--ink)}
.warnbox{background:var(--amber-glow); border:1px solid var(--amber); border-radius:8px;
  padding:11px 14px; color:var(--amber); font-size:13.5px; font-family:"JetBrains Mono",monospace; margin-bottom:14px}

.hint{color:var(--faint); font-size:13px; font-family:"JetBrains Mono",monospace; letter-spacing:.03em}
.spacer-sm{height:8px}
details.note{margin-top:6px}
details.note summary{cursor:pointer; color:var(--accent); font-family:"JetBrains Mono",monospace; font-size:12.5px}
details.note .body{color:var(--mute); font-size:13.5px; margin-top:7px}
details.note .body ul{margin:5px 0; padding-left:18px}

/* ============ SHEET VIEW ============
   The reading mode: a deck of reference cards, not a document of lists. A
   card is the unit a tabletop player already owns — it answers "what does
   this thing do" without reading its neighbours, and on paper it cuts out.
   Nothing in here edits: there is not one control that changes the build. */
body.sheetmode .shell{display:none}
.sheetview{max-width:1680px; margin:0 auto; padding:clamp(18px,2.6vw,34px)}

/* Dossier — the one place the whole build is stated at once. Sticky, because
   the stats are what a player looks back at between cards. */
.dossier{position:sticky; top:60px; z-index:40; background:var(--bg);
  border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:18px}
@media(max-width:760px){.dossier{position:static}}
.dossier-id{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap}
.dossier-id .cs{font-family:"Chakra Petch",sans-serif; font-size:27px; line-height:1.15}
.dossier-id .nm{font-family:"JetBrains Mono",monospace; font-size:12.5px; color:var(--mute); letter-spacing:.06em}
.dossier-id .ll{font-family:"JetBrains Mono",monospace; font-size:12.5px; color:var(--accent); letter-spacing:.08em}
.dossier-frame{font-family:"JetBrains Mono",monospace; font-size:12px; letter-spacing:.1em;
  color:var(--faint); margin-top:4px}
.dossier-frame b{color:var(--ink); font-weight:400}

/* Stat strip — every number carries its monospace key, which is exactly what
   the HUD's icon-only tiles fail to do. This is the reading surface; a number
   nobody can name is not readable. */
.statstrip{display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-top:14px}
@media(max-width:900px){.statstrip{grid-template-columns:repeat(4,1fr)}}
@media(max-width:560px){.statstrip{grid-template-columns:repeat(3,1fr)}}
.statstrip .cell{background:var(--bg-grid); border:1px solid var(--line); border-radius:6px;
  padding:8px 6px; text-align:center}
.statstrip .cell .k{display:block; font-family:"JetBrains Mono",monospace; font-size:12px;
  letter-spacing:.06em; color:var(--faint)}
.statstrip .cell .v{font-family:"Chakra Petch",sans-serif; font-size:27px; line-height:1.1; color:var(--ink)}
.statstrip .cell.up .v{color:var(--accent)}

/* Clearance stamp — the registry's verdict on this build. The product already
   knows every violation; this is where it finally says so. */
.stamp{display:flex; align-items:flex-start; gap:10px; margin-top:14px; padding:10px 14px;
  border:1px solid var(--ok); border-radius:8px; color:var(--ok);
  font-family:"JetBrains Mono",monospace; font-size:12.5px; letter-spacing:.06em}
.stamp.dev{border-color:var(--amber); color:var(--amber); background:var(--amber-glow)}
.stamp .body{flex:1; min-width:0}
.stamp ul{list-style:none; margin:7px 0 0; padding:0; display:flex; flex-direction:column; gap:4px}
.stamp li{color:var(--ink); letter-spacing:.03em}

/* Deck */
.decksec{margin-top:24px}
.decksec > h2{font-family:"Chakra Petch",sans-serif; font-size:17.5px; letter-spacing:.06em; color:var(--ink);
  padding-bottom:7px; border-bottom:1px solid var(--line); margin-bottom:14px}
.decksec > h2 .n{font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--faint);
  letter-spacing:.1em; margin-left:8px}
.deck{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px}
@media(max-width:560px){.deck{grid-template-columns:1fr}}

.dcard{position:relative; background:var(--panel); border:1px solid var(--line);
  border-radius:8px; padding:12px 14px 12px 18px; display:flex; flex-direction:column; gap:8px}
.dcard .src{position:absolute; top:0; left:0; bottom:0; width:5px; border-radius:8px 0 0 8px}
.dcard .hd{display:flex; justify-content:space-between; align-items:flex-start; gap:8px}
.dcard .nm{font-family:"Chakra Petch",sans-serif; font-size:17.5px; line-height:1.2}
.dcard .slot{font-family:"JetBrains Mono",monospace; font-size:12px; letter-spacing:.06em;
  color:var(--faint); white-space:nowrap; flex-shrink:0}
.dcard .row{display:flex; flex-wrap:wrap; gap:5px}
.dcard .eff{font-size:16.5px; line-height:1.5; color:var(--ink)}
.dcard .eff b{color:var(--accent); font-family:"JetBrains Mono",monospace; font-size:12px;
  letter-spacing:.1em; display:block; margin-bottom:2px; font-weight:400}
.dcard .sub{border-top:1px solid var(--line); padding-top:8px}
.dcard.void{border-color:var(--amber)}
/* Numbers a player reads mid-turn get the display face, not the body face. */
.keystat{display:inline-flex; align-items:baseline; gap:5px; font-family:"Chakra Petch",sans-serif; font-size:17.5px}
.keystat .k{font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--faint); letter-spacing:.08em}
.keyline{display:flex; gap:16px; flex-wrap:wrap}

.sheet-empty{border:1px dashed var(--line-bright); border-radius:8px; padding:24px;
  text-align:center; color:var(--faint); font-family:"JetBrains Mono",monospace;
  font-size:12.5px; letter-spacing:.05em}
/* Reading someone else's build: it is not yours and is not being saved. */
.foreign{background:var(--panel-2); border:1px solid var(--line-bright); border-radius:8px;
  padding:10px 14px; margin-bottom:16px; font-family:"JetBrains Mono",monospace;
  font-size:12.5px; color:var(--mute); letter-spacing:.04em}

/* print */
@media print{
  body{background:var(--print-paper); color:var(--print-ink)}
  .topbar,.hud,.tabs,#boot,.filters,.toolbtn{display:none!important}
  .shell{grid-template-columns:1fr; max-width:none; padding:0}
  .section{display:none!important}
  #print-sheet{display:block!important}

  /* A4 layout for the sheet: its own denser composition, not the screen
     shrunk. Two columns of cards with cut lines; nothing splits across a
     page, and the dossier repeats as a running head. */
  @page{size:A4; margin:12mm}
  body.sheetmode{background:var(--print-paper)}
  body.sheetmode .sheetview{display:block!important; max-width:none; padding:0; color:var(--print-ink)}
  .sheetview *{color:var(--print-ink)!important; background:transparent!important}
  .dossier{position:static; border-bottom:1.5pt solid var(--print-ink); padding-bottom:6pt; margin-bottom:8pt}
  .dossier-id .cs{font-size:20pt}
  .statstrip{grid-template-columns:repeat(6,1fr); gap:4pt; margin-top:6pt}
  .statstrip .cell{border:.5pt solid var(--print-rule); border-radius:0; padding:3pt 2pt}
  .statstrip .cell .k{font-size:6.5pt}
  .statstrip .cell .v{font-size:13pt}
  .stamp{border:1pt solid var(--print-ink)!important; border-radius:0; font-size:8pt; padding:4pt 6pt}
  .decksec{margin-top:10pt; break-inside:auto}
  .decksec > h2{font-size:11pt; border-bottom:.5pt solid var(--print-ink); break-after:avoid}
  .deck{display:block; column-count:2; column-gap:6mm}
  .dcard{break-inside:avoid; page-break-inside:avoid; display:block;
    border:.5pt dashed var(--print-rule)!important; border-radius:0; padding:4pt 5pt; margin:0 0 4mm;
    -webkit-column-break-inside:avoid}
  .dcard .src{display:none}
  .dcard .nm{font-size:10.5pt}
  .dcard .slot,.dcard .row,.dcard .eff b,.keystat .k{font-size:6.5pt}
  .dcard .eff{font-size:8.5pt; line-height:1.35; margin-top:3pt}
  .dcard .row{margin-top:2pt}
  .keystat{font-size:10pt}
  .tag{border:.5pt solid var(--print-rule); border-radius:0; padding:0 2pt; font-size:6.5pt}
  .foreign,.sheet-empty{border:.5pt solid var(--print-rule); font-size:8pt}
}
</style>
</head>
<body>

<div id="boot">
  <div class="ring"></div>
  <div class="blog">ИНИЦИАЛИЗАЦИЯ…</div>
  <div class="ttl">LANCER · UNION REGISTRY</div>
</div>

<header class="topbar">
  <div class="brand">
    <span class="sig mono">//</span>
    <span class="name">LANCER <b>РЕЕСТР</b></span>
    <span class="ver mono">COMP/CON v1</span>
  </div>
  <div class="spacer"></div>
  <span class="savestate" id="savestate" aria-live="polite"></span>
  <button class="toolbtn mode" id="t-sheet">▤ ЛИСТ</button>
  <button class="toolbtn" id="t-link" hidden>🔗 ССЫЛКА</button>
  <button class="toolbtn" id="t-print" hidden>🖨 ПЕЧАТЬ</button>
  <button class="toolbtn" id="t-lang" title="Переключить язык контента / Toggle content language">RU / EN</button>
  <button class="toolbtn" id="t-import">⬆ ЗАГРУЗИТЬ</button>
  <button class="toolbtn" id="t-export">⬇ СОХРАНИТЬ</button>
  <button class="toolbtn warn" id="t-reset">⟲ СБРОС</button>
  <input type="file" id="import-file" accept="application/json" hidden>
</header>

<div class="shell">
  <aside class="hud" id="hud"></aside>
  <main>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div id="tab" class="section show" role="tabpanel"></div>
  </main>
</div>

<div id="sheet" class="sheetview" hidden></div>

<div id="print-sheet" style="display:none"></div>

<div class="modal" id="modal">
  <div class="panel" role="dialog" aria-modal="true">
    <div class="mhd"><h3></h3><button class="toolbtn mclose">✕ ЗАКРЫТЬ</button></div>
    <div class="mbd"></div>
  </div>
</div>

<!-- Single global stat-glossary tooltip, kept as a direct child of <body>
     (outside every panel/card). Any tooltip nested inside a card can end up
     clipped or out-stacked by that card's own rendering context in some
     browsers even with position:fixed, if an ancestor sets a property that
     creates a new containing block (filter/transform/etc.) — living at the
     top level sidesteps that class of bug entirely. See wireStatTooltips(). -->
<div class="stattip-box" id="global-stattip"></div>

<script>
/* =================================================================
   LANCER // REGISTRY — I18N DATA LOADER
   -----------------------------------------------------------------
   Loads the canonical (English) game data from data/lancer-data.json
   and, if a translation exists, overlays it with locales/<lang>/*.json.

   IMPORTANT — why some fields are never translated in-place:
   A few fields double as *logic keys*, not just display text:
     - frame.name is used to key licenses (state.licenses[frame.name])
       and to match weapons/systems to their unlocking frame
       (item.license === frame.name). Translating it would silently
       break license unlocking, so it is intentionally left in English.
       Variant frames (frame.variant set, e.g. Enkidu -> "Tokugawa")
       key off frame.variant instead — see licenseKeyFor() — so they
       share their base frame's license rank rather than tracking their
       own; frame.variant is likewise left untranslated for the same
       reason.
     - mount/type/source/tags/mechtype values (e.g. "Main", "Rifle",
       "GMS", "Reliable 2") are compared literally elsewhere in the
       app logic (mount-matching, filters, source colors). These are
       NEVER mutated on the data objects — they are translated only
       at render time via tr()/trTag(), defined below, using the
       shared locales/<lang>/enums.json dictionary.
   Everything else (description, effect, detail, terse, trait/rank
   text, core system text, on_hit/on_attack/on_crit) is pure prose
   and is safely overlaid in place.
   ================================================================= */

let ENUMS = null;                 // parsed locales/<lang>/enums.json
let currentLang = localStorage.getItem("lancer_lang") || "ru";

const LOCALE_CATEGORY_FILES = [
  "enums", "frames", "weapons", "systems", "talents",
  "skills", "core_bonuses", "pilot_gear", "backgrounds", "manufacturers", "tags", "glossary", "stat_labels", "mods"
];

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error("HTTP " + r.status + " for " + url);
  return r.json();
}

/* Additional community/official content packs merged into the core data.
   Each pack file is pre-normalized (see tools/normalize_pack.py) into the
   same flat shape as data/lancer-data.json, so no renderer changes are
   needed. Packs only cover categories the app already has a UI for
   (frames/weapons/systems/talents/pilot_gear/core_bonuses/mods) — pack
   categories with no app support (e.g. reserves, environments) are
   intentionally omitted; see README. */
const CONTENT_PACKS = [
  "data/packs/osr-data.json", "data/packs/wallflower-data.json",
  "data/packs/ows-data.json", "data/packs/long-rim-data.json",
  "data/packs/dustgrave-data.json", "data/packs/ktb-data.json",
  "data/packs/sotw-data.json", "data/packs/ssmr-data.json",
];

async function loadBaseData() {
  try {
    const core = await fetchJSON("data/lancer-data.json");
    core.tags = await fetchJSON("data/tags.json").catch(e => { console.warn("tags.json failed to load:", e); return []; });
    core.glossary = await fetchJSON("data/glossary.json").catch(e => { console.warn("glossary.json failed to load:", e); return {}; });
    core.stat_labels = await fetchJSON("data/stat_labels.json").catch(e => { console.warn("stat_labels.json failed to load:", e); return {}; });
    core.core_stat_mods = await fetchJSON("data/core_bonus_stat_mods.json").catch(e => { console.warn("core_bonus_stat_mods.json failed to load:", e); return {}; });
    core.core_terse = await fetchJSON("data/core_bonus_terse.json").catch(e => { console.warn("core_bonus_terse.json failed to load:", e); return {}; });
    // Map of frame id -> official portrait URL (hosted on Massif Press's own
    // CDN, not bundled in this project — see data/frame_images.json for why
    // these are linked rather than downloaded).
    core.frame_images = await fetchJSON("data/frame_images.json").catch(e => { console.warn("frame_images.json failed to load:", e); return {}; });
    const packs = await Promise.all(
      CONTENT_PACKS.map(p => fetchJSON(p).catch(e => { console.warn("Pack failed to load:", p, e); return null; }))
    );
    for (const pack of packs) {
      if (!pack) continue;
      for (const cat of ["frames", "weapons", "systems", "talents", "pilot_gear", "core_bonuses", "mods"]) {
        if (pack[cat] && pack[cat].length) core[cat] = (core[cat] || []).concat(pack[cat]);
      }
    }
    return core;
  } catch (e) {
    document.body.innerHTML =
      "<div style='padding:40px;font-family:monospace;color:#e5604f'>" +
      "Не удалось загрузить data/lancer-data.json.<br><br>" +
      "Если вы открыли index.html прямо из файловой системы (file://), " +
      "браузер блокирует fetch() локальных файлов. Запустите локальный сервер, например:<br><br>" +
      "<code>python3 -m http.server</code><br><br>" +
      "…в папке проекта и откройте http://localhost:8000/ — подробнее в README.md." +
      "</div>";
    throw e;
  }
}

async function loadLocaleFiles(lang) {
  if (lang === "en") return null; // base data already IS the English text
  const out = {};
  await Promise.all(LOCALE_CATEGORY_FILES.map(async (name) => {
    try { out[name] = await fetchJSON(`locales/${lang}/${name}.json`); }
    catch (e) { out[name] = {}; }
  }));
  return out;
}

/* pick the translation if present & non-empty, otherwise keep the English original */
function pickText(original, pair) {
  if (pair && typeof pair.ru === "string" && pair.ru.trim()) return pair.ru;
  return original;
}

function overlayKeyedPairs(items, overlayMap, fields, opts = {}) {
  items.forEach(item => {
    const t = overlayMap[item.id];
    if (!t) return;
    fields.forEach(f => {
      if (opts.skip && opts.skip.includes(f)) return;
      if (t[f] !== undefined) item[f] = pickText(item[f], t[f]);
    });
  });
}

function overlayNamedSublist(list, overlayNamedMap) {
  (list || []).forEach(sub => {
    const t = (overlayNamedMap || {})[sub.name];
    if (!t) return;
    if (t.name) sub.name = pickText(sub.name, t.name);
    if (t.description !== undefined) sub.description = pickText(sub.description, t.description);
  });
}

/* weapons: on_hit/on_attack/on_crit can be null | string | {detail,...} */
function overlayOnField(item, key, pair) {
  const val = item[key];
  if (val == null || !pair) return;
  const translated = pickText(typeof val === "string" ? val : val.detail, pair);
  if (typeof val === "string") item[key] = translated;
  else item[key] = { ...val, detail: translated };
}

function localizeData(base, locale) {
  const L = JSON.parse(JSON.stringify(base)); // deep clone, never mutate the fetched base
  if (!locale) return L; // "en" — nothing to overlay, English IS the source data

  // frames: fr.name stays English — it's a logic key (state.licenses[fr.name],
  // item.license === fr.name for unlocking). We instead populate fr.display_name
  // with the translation, purely for rendering; see dispName() and its call sites.
  const frOverlay = locale.frames || {};
  L.frames.forEach(fr => {
    fr.display_name = fr.name; // default: no translation yet -> show the English name
    const t = frOverlay[fr.id];
    if (!t) return;
    if (t.name) fr.display_name = pickText(fr.name, t.name);
    if (t.description !== undefined) fr.description = pickText(fr.description, t.description);
    overlayNamedSublist(fr.traits, t.traits);
    if (fr.core_system && t.core_system) {
      const cs = fr.core_system, tcs = t.core_system;
      ["name", "description", "passive_name", "passive_effect", "active_name", "active_effect"]
        .forEach(k => { if (tcs[k] !== undefined) cs[k] = pickText(cs[k], tcs[k]); });
      ["passive_actions", "active_actions"].forEach(actKey => {
        const acts = cs[actKey], tacts = tcs[actKey];
        if (!acts || !tacts) return;
        acts.forEach(a => {
          const ta = tacts[a.name];
          if (!ta) return;
          if (ta.name) a.name = pickText(a.name, ta.name);
          overlayOnField(a, "trigger", ta.trigger);
          overlayOnField(a, "detail", ta.detail);
        });
      });
    }
  });

  overlayKeyedPairs(L.weapons, locale.weapons || {}, ["name", "effect"]);
  (locale.weapons ? L.weapons : []).forEach(w => {
    const t = (locale.weapons || {})[w.id];
    if (!t) return;
    overlayOnField(w, "on_hit", t.on_hit);
    overlayOnField(w, "on_attack", t.on_attack);
    overlayOnField(w, "on_crit", t.on_crit);
    if (w.profiles && t.profiles) {
      w.profiles.forEach(p => {
        const tp = t.profiles[p.name];
        if (!tp) return;
        if (tp.name) p.name = pickText(p.name, tp.name);
        if (p.effect !== undefined && tp.effect) p.effect = pickText(p.effect, tp.effect);
        overlayOnField(p, "on_hit", tp.on_hit);
        overlayOnField(p, "on_attack", tp.on_attack);
        overlayOnField(p, "on_crit", tp.on_crit);
      });
    }
  });

  // mods: weapon-mod cards read name/effect/description + on_hit/on_attack/
  // on_crit exactly like weapons — same overlay shape, see modCardBody().
  overlayKeyedPairs(L.mods || [], locale.mods || {}, ["name", "effect", "description"]);
  (locale.mods ? (L.mods || []) : []).forEach(m => {
    const t = (locale.mods || {})[m.id];
    if (!t) return;
    overlayOnField(m, "on_hit", t.on_hit);
    overlayOnField(m, "on_attack", t.on_attack);
    overlayOnField(m, "on_crit", t.on_crit);
  });

  overlayKeyedPairs(L.systems, locale.systems || {}, ["name", "effect", "description"]);

  const talOverlay = locale.talents || {};
  L.talents.forEach(tl => {

  overlayKeyedPairs(L.pilot_gear, locale.pilot_gear || {}, ["name", "description", "effect"]);
  overlayKeyedPairs(L.backgrounds, locale.backgrounds || {}, ["name", "description"]);
  overlayKeyedPairs(L.manufacturers || [], (locale.manufacturers || {}), ["name", "description"]);
  overlayKeyedPairs(L.tags || [], (locale.tags || {}), ["name", "description"]);

  // array with .id like everything else — overlay it directly.
  if (L.glossary && locale.glossary) {
    for (const key in L.glossary) {
      const t = locale.glossary[key];
      if (!t) continue;
      if (t.name) L.glossary[key].name = pickText(L.glossary[key].name, t.name);
      if (t.description !== undefined) L.glossary[key].description = pickText(L.glossary[key].description, t.description);

  // ВЫБРАННОЕ ШАССИ row layout) — same overlay idea as glossary, but each
  // value is a bare string rather than {name, description}.
  if (L.stat_labels && locale.stat_labels) {

      const t = locale.stat_labels[key];
      if (!t) continue;
      L.stat_labels[key] = pickText(L.stat_labels[key], t);
    }
  }

}

function tr(word) {
  if (currentLang === "en" || !ENUMS || word == null) return word;
  for (const catKey in ENUMS) {
    if (catKey === "_comment") continue;
    const cat = ENUMS[catKey];
    if (cat[word]) return cat[word][currentLang] || word;

}
function trTag(tag) {
  if (currentLang === "en" || !ENUMS || tag == null) return tag;
  const dict = ENUMS.tag_words || {};
  if (dict[tag]) return dict[tag][currentLang] || tag;
  // "N/Round", "N/Turn" — number comes first, word comes after the slash
  const slashM = String(tag).match(/^([\d./+-]+)\/(\w+)$/);
  if (slashM) {
    const word = slashM[2];
    const wordT = dict[word] ? (dict[word][currentLang] || word) : tr(word);
    return slashM[1] + "/" + wordT;
  }
  const m = String(tag).match(/^(.+?)(\s+[\w./+-]+)?(\s*\([^)]*\))?$/);
  if (!m) return tag;
  const base = m[1].trim(), num = m[2] || "", paren = (m[3] || "").trim();
  const baseT = dict[base] ? (dict[base][currentLang] || base) : tr(base);
  const parenT = paren && dict[paren] ? " " + (dict[paren][currentLang] || paren) : (paren ? " " + paren : "");

      }).filter(Boolean),
    }));
    if(!next.mech.mounts.length) next.mech.mounts=buildMounts(M.frame[next.mech.frameId]);
  } else if(m.mounts && arr(m.mounts).length){
    // Frame is gone, so its mounts have nothing to hang on.
    arr(m.mounts).forEach(mt=>arr(mt&&mt.items).forEach(slot=>{
      const id = typeof slot==="string" ? slot : (slot && slot.id);
      if(id && M.weapon[id]) dropped.push(`оружие «${M.weapon[id].name}» (нет шасси)`);
    }));
  }

  Object.assign(state, next);
  migrateLicenseKeys();
  migrateWeaponSlots();
  return dropped;
}

/* One line per non-empty part of the current build, for the "this is what
   disappears" list in every destructive dialog. */
function buildLossSummary(){
  const out=[];
  const n=(x,one,few,many)=>{ const m=x%100, k=x%10;
    if(m>=11&&m<=14) return `${x} ${many}`;
    if(k===1) return `${x} ${one}`;
    if(k>=2&&k<=4) return `${x} ${few}`;
    return `${x} ${many}`; };
  const p=state.pilot;
  if(p.callsign||p.name) out.push(`пилот ${p.callsign||p.name}`);
  if(p.ll) out.push(`лицензионный уровень LL${p.ll}`);
  const sk=Object.keys(state.skills).length; if(sk) out.push(n(sk,"навык","навыка","навыков"));
  const tl=Object.keys(state.talents).length; if(tl) out.push(n(tl,"талант","таланта","талантов"));
  const hs=HASE.filter(h=>state.hase[h.k]).length; if(hs) out.push(n(hs,"мех-навык","мех-навыка","мех-навыков"));
  const lc=Object.keys(state.licenses).filter(k=>state.licenses[k]).length;
  if(lc) out.push(n(lc,"лицензия","лицензии","лицензий"));
  const gr=(state.gear.armor?1:0)+state.gear.weapons.length+state.gear.gear.length;
  if(gr) out.push(n(gr,"предмет снаряжения","предмета снаряжения","предметов снаряжения"));
  if(state.cores.length) out.push(n(state.cores.length,"CORE-бонус","CORE-бонуса","CORE-бонусов"));
  const fr=state.mech.frameId&&M.frame[state.mech.frameId];
  if(fr) out.push(`шасси ${dispName(fr)}`);
  const wp=(state.mech.mounts||[]).reduce((a,mt)=>a+(mt.items||[]).length,0);
  if(wp) out.push(n(wp,"единица оружия","единицы оружия","единиц оружия"));
  if(state.mech.systems.length) out.push(n(state.mech.systems.length,"система","системы","систем"));
  return out;
}

/* ---------------- DERIVED ---------------- */
/* Systems whose effect grants a flat, always-on bonus to a mech stat
   (as opposed to a conditional/reactive bonus, or a bonus to a deployed
   object rather than the mech itself — those stay as descriptive text only,
   since this app doesn't track live combat state). Scanned across the full
   core dataset + all content packs; currently only Personalizations
   qualifies. Extend this map if new content adds more. */
const SYSTEM_STAT_BONUSES = {
  "ms_personalizations": {hp: 2},
};
function systemStatBonusTotal(stat){
  return state.mech.systems.reduce((sum,id)=>{
    const b=SYSTEM_STAT_BONUSES[id];
    return sum + (b && b[stat] ? b[stat] : 0);
  }, 0);
}

/* CORE bonuses' numeric stat effects live in data/core_bonus_stat_mods.json
   (loaded as L.core_stat_mods, see loadBaseData()) instead of being
   hardcoded here — edit that file to add homebrew bonuses, no code changes
   needed. Most entries are a flat {stat: N} add, read generically below.
   The one exception is Size: "increase Size by one increment" isn't a flat
   number, it moves along the fixed 0.5→1→2→3 track — any CORE bonus that
   does this is marked with "size_step":true in the data file instead of a
   normal stat key, and applyFomorianSize() below handles the step/cap. */
function coreStatBonusTotal(stat){
  const mods = L.core_stat_mods || {};
  return state.cores.reduce((sum,id)=>{
    const b=mods[id];
    return sum + (b && typeof b[stat]==="number" ? b[stat] : 0);
  }, 0);
}
const SIZE_STEPS=[0.5,1,2,3];
function applyFomorianSize(size){
  const mods = L.core_stat_mods || {};
  const stepping = state.cores.some(id=>mods[id] && mods[id].size_step);
  if(!stepping) return size;
  const i=SIZE_STEPS.indexOf(size);
  if(i<0) return Math.min(3,size+1); // unrecognized/custom size value: best-effort +1, still capped
  return SIZE_STEPS[Math.min(i+1, SIZE_STEPS.length-1)];
}

function derived(){
  const ll = state.pilot.ll;
  const grit = Math.ceil(ll/2);
  const b = {
    skill:{cap:4+ll}, talent:{cap:3+ll}, hase:{cap:2+ll},
    license:{cap:ll}, core:{cap:Math.floor(ll/3)}
  };
  b.skill.used   = Object.values(state.skills).reduce((a,v)=>a+v/2,0);
  b.talent.used  = Object.values(state.talents).reduce((a,v)=>a+v,0);
  b.hase.used    = Object.values(state.hase).reduce((a,v)=>a+v,0);
  b.license.used = Object.values(state.licenses).reduce((a,v)=>a+v,0);
  b.core.used    = state.cores.length;

  const {hull,agility,systems,engineering} = state.hase;
  const f = state.mech.frameId ? M.frame[state.mech.frameId] : null;
  let mech=null, sp={cap:0,used:0};
  if(f){
    const s=f.stats;
    mech = {
      size:applyFomorianSize(s.size), structure:s.structure, stress:s.stress,
      armor:Math.min(4, s.armor+coreStatBonusTotal("armor")),
      hp:s.hp+grit+2*hull+systemStatBonusTotal("hp")+coreStatBonusTotal("hp"),
      repcap:s.repcap+Math.floor(hull/2),
      evasion:s.evasion+agility+coreStatBonusTotal("evasion"),
      speed:s.speed+Math.floor(agility/2),
      edef:s.edef+systems+coreStatBonusTotal("edef"),
      tech_attack:s.tech_attack+systems,
      heatcap:s.heatcap+engineering+coreStatBonusTotal("heatcap"),
      sensor_range:s.sensor_range,
      save:s.save+grit+coreStatBonusTotal("save"),
      sp:s.sp+Math.floor(systems/2),
      limited_bonus:Math.floor(engineering/2),
      attack:grit,
    };
    sp.cap = mech.sp;
    let used=0;
    state.mech.systems.forEach(id=>{ const sy=M.system[id]; if(sy) used+=sy.sp||0; });
    state.mech.mounts.forEach(mt=>mt.items.forEach(slot=>{
      const w=M.weapon[slot.id]; if(w) used+=w.sp||0;
      if(slot.mod){ const md=M.mod[slot.mod]; if(md) used+=md.sp||0; }
    }));
    sp.used=used;
  }
  return {ll,grit,b,mech,sp,frame:f};
}

/* Max talent rank a pilot can put points into at a given license level.
   At LL0 a pilot picks 3 rank-1 talents; each subsequent LL both grants
   1 more talent point AND unlocks the next rank tier — so rank 3 needs
   LL2, rank 2 needs LL1, capped at the game's rank-3 ceiling. */
function talentRankCap(ll){ return Math.min(3, ll+1); }

/* license helpers */
const licRank = name => state.licenses[name]||0;
/* Canonical license-track key for a frame. Variant frames (frame.variant
   set, e.g. Enkidu -> "Tokugawa") share their base frame's license rank
   instead of tracking their own — ranking up either the base or the variant
   raises the same counter, and both unlock together. Use this everywhere a
   frame's license progress is read or written; never key off frame.name
   directly for licensing (frame.name is still fine for display/traits). */
function licenseKeyFor(f){ return f.variant || f.name; }
/* GMS first, then the rest of the manufacturers grouped together in this
   fixed order, unknown sources last — used to sort weapon/system lists so
   items from the same manufacturer stay together instead of interleaving. */
const SOURCE_ORDER = ["GMS","IPS-N","SSC","HORUS","HA","EXOTIC"];
const sourceOrder = src => { const i=SOURCE_ORDER.indexOf(src); return i<0?999:i; };
/* Highest license rank the pilot has invested among all frames of a given
   manufacturer (e.g. rank 2 in "Minotaur" and rank 2 in "Genghis" both count
   toward HORUS/HA respectively, but neither reaches the 3 needed to unlock
   that manufacturer's CORE Bonuses). GMS has no such requirement. */
function manufacturerRank(source){
  const ranks = L.frames.filter(f=>f.source===source).map(f=>licRank(licenseKeyFor(f)));
  return ranks.length ? Math.max(...ranks) : 0;
}
function coreBonusUnlocked(c){
  return c.source==="GMS" || manufacturerRank(c.source)>=3;
}
function unlocked(item){
  if(item.source==="GMS"||item.license==="GMS"||(item.license_level||0)===0) return true;
  return licRank(item.license) >= (item.license_level||0);
}
/* item.license (and licenseKeyFor(frame)) are always the frame's English
   name/variant — that's the logic key licenses are tracked by, and it must
   never be swapped for translated text (see the frame.name comment near
   loadBaseData). This resolves that English key to the matching frame's
   *localized* display name, purely for showing it in UI text like the
   weapon/system license badges below — falls back to the raw key if no
   matching frame is found (shouldn't normally happen). */
function licenseDisplayName(key){
  const fr = (L.frames||[]).find(f=>licenseKeyFor(f)===key);
  return fr ? dispName(fr) : key;
}
/* Weapons/systems/mods keep showing which license+rank they're tied to even
   after that requirement is met — closed amber lock while locked, open
   green lock once unlocked — instead of the requirement just disappearing
   and being replaced by mount/type/source. Items with no real license gate
   (license_level 0, e.g. GMS) have nothing to show either way, so the
   caller's fallback text (mount/type/source) is used instead. */
function licenseBadge(item, fallback){
  if(!(item.license_level>0)) return {cls:"", text:fallback};
  const lk=!unlocked(item);
  return {cls: lk?"lock":"unlocked", text:(lk?"🔒 ":"🔓 ")+esc(licenseDisplayName(item.license))+" "+item.license_level};
}
function frameUnlocked(f){
  if(f.source==="GMS"||f.license_level===0) return true;
  return licRank(licenseKeyFor(f)) >= f.license_level;
}

/* ---------------- MOUNTS ---------------- */
function allowedNext(type,sizes){
  const n=sizes.length;
  if(type==="Main")  return n<1?["Main","Auxiliary"]:[];
  if(type==="Heavy") return n<1?["Heavy","Main","Auxiliary","Superheavy"]:[];
  if(type==="Aux/Aux") return n<2?["Auxiliary"]:[];
  if(type==="Flex"){
    if(n>=2||sizes.includes("Main")) return [];
    return n===1?["Auxiliary"]:["Main","Auxiliary"];
  }
  if(type==="Main/Aux"){
    const r=[]; if(!sizes.includes("Main")) r.push("Main");
    if(sizes.filter(s=>s==="Auxiliary").length<1) r.push("Auxiliary"); return r;
  }
  return [];
}
function buildMounts(frame){
  const mounts = frame.mounts.map(t=>({type:t,items:[]}));
  const iw = FRAME_INTEGRATED_WEAPON[frame.id];
  if(iw) mounts.push({type:"Integrated", items:[{id:iw, mod:null}]});
  return mounts;
}
/* Frames whose CORE system is (or includes) a built-in weapon that doesn't
   occupy a normal mount slot — e.g. Raleigh's M35 Mjolnir, Barbarossa's
   Apocalypse Rail. These get an automatic "Integrated" mount, pre-filled;
   if removed, it can only be restored via openIntegratedPicker() (below),
   never filled with anything else. */
const FRAME_INTEGRATED_WEAPON = {
  "mf_lancaster": "mw_lancaster_integrated",
  "mf_raleigh": "mw_raleigh_integrated",
  "mf_barbarossa": "mw_barbarossa_integrated",
  "mf_sherman": "mw_sherman_integrated",
  "mf_tokugawa_alt_enkidu": "mw_tokugawa_alt_enkidu_integrated",
  "mf_caliban": "mw_caliban_integrated",
  "mf_emperor": "mw_emperor_integrated",
  "mf_Empakaai_alt_blackbeard": "mw_empakaai_alt_blackbeard_integrated",
  "mf_lycan": "mw_integrated_shock_claws",
};

/* ---------------- FRAME SWAP ----------------
   Choosing a frame rebuilds its mount layout, and that is where an existing
   loadout used to vanish without a word. Weapons that still fit the new
   frame's mounts are carried across; the rest are named before anything is
   destroyed, so the choice is made with the cost visible. */
function equippedSlots(){
  return (state.mech.mounts||[]).flatMap(mt=>mt.items||[]).filter(s=>s&&M.weapon[s.id]);
}
function planFrameSwap(newFrame){
  const mounts=buildMounts(newFrame);
  const integrated=new Set(mounts.filter(m=>m.type==="Integrated").flatMap(m=>(m.items||[]).map(s=>s.id)));
  const carried=[], leftBehind=[];
  equippedSlots().forEach(slot=>{
    const w=M.weapon[slot.id];
    // The new frame's own integrated weapon is already in place.
    if(integrated.has(slot.id)) return;
    const target=mounts.find(mt=>mt.type!=="Integrated"
      && allowedNext(mt.type, mt.items.map(s=>M.weapon[s.id]&&M.weapon[s.id].mount)).includes(w.mount));
    if(target){ target.items.push({id:slot.id, mod:slot.mod||null}); carried.push({w, mount:target.type}); }
    else leftBehind.push(w);
  });
  return {mounts, carried, leftBehind};
}
function pickFrame(id){
  const fr=M.frame[id];
  if(!fr || state.mech.frameId===id) return;
  const commit=mounts=>{ state.mech.frameId=id; state.mech.mounts=mounts; render(); };
  if(!equippedSlots().length){ commit(buildMounts(fr)); return; }

  const plan=planFrameSwap(fr);
  const losses=[
    ...plan.carried.map(c=>({kind:"keep", text:`${c.w.name} → ${tr(c.mount)}`})),
    ...plan.leftBehind.map(w=>({kind:"drop", text:`${w.name} — нет подходящего крепления`})),
  ];
  const actions=[];
  if(plan.carried.length) actions.push({
    label:`↳ Перенести совместимое (${plan.carried.length})`,
    run:()=>commit(plan.mounts),
  });
  actions.push({label:"✕ Снять всё", danger:true, run:()=>commit(buildMounts(fr))});

  const tail = !plan.leftBehind.length ? "Всё вооружение переносится:"
             : !plan.carried.length    ? "Перенести не получится ничего:"
             :                           "Переносится не всё:";
  confirmDialog({
    title:"Смена шасси",
    lead:`У <b>${esc(dispName(fr))}</b> другой набор креплений, поэтому вооружение придётся переставить. ${tail}`,
    losses,
    actions,
  });
}

/* ============ TAB BAR ============ */
const TABS=[
  ["pilot","ПИЛОТ"],["skills","НАВЫКИ"],["talents","ТАЛАНТЫ"],["hase","МЕХ-НАВЫКИ"],
  ["licenses","ЛИЦЕНЗИИ"],["frame","ШАССИ"],["loadout","ВООРУЖЕНИЕ"],["core","CORE"],["summary","ИТОГ"]
];
function tabWarn(id){
  const d=derived();
  if(id==="skills")   return d.b.skill.used>d.b.skill.cap;
  if(id==="talents"){
    return d.b.talent.used>d.b.talent.cap ||
      Object.values(state.talents).some(v=>v>talentRankCap(d.ll));
  }
  if(id==="hase")     return d.b.hase.used>d.b.hase.cap;
  if(id==="licenses") return d.b.license.used>d.b.license.cap;
  if(id==="loadout")  return d.mech && d.sp.used>d.sp.cap;
  if(id==="core")     return d.b.core.cap>0 && state.cores.length>d.b.core.cap;
  return false;
}
function renderTabBar(){
  $("#tabs").innerHTML = TABS.map(([id,nm],i)=>{
    const warn=tabWarn(id);
    const sel=activeTab===id;
    return `<button class="tab ${sel?'active':''}" data-tab="${id}" role="tab"
      aria-selected="${sel}" aria-controls="tab" id="tab-btn-${id}" tabindex="${sel?0:-1}">
      <span class="ix mono">${String(i+1).padStart(2,"0")}</span>${nm}
      ${warn?'<span class="dot warn"></span>':''}</button>`;
  }).join("");
  const btns=$$("#tabs .tab");
  const activate=b=>{activeTab=b.dataset.tab; render(); window.scrollTo({top:0,behavior:"smooth"}); $(`#tab-btn-${activeTab}`).focus();};
  btns.forEach((b,i)=>{
    b.onclick=()=>activate(b);
    b.onkeydown=e=>{
      let ni=null;
      if(e.key==="ArrowRight") ni=(i+1)%btns.length;
      else if(e.key==="ArrowLeft") ni=(i-1+btns.length)%btns.length;
      else if(e.key==="Home") ni=0;
      else if(e.key==="End") ni=btns.length-1;
      if(ni!==null){ e.preventDefault(); activate(btns[ni]); }
    };
  });
}

function renderPilotGearLoadout(){
  const g=state.gear;
  const slotGroup=(label, kind, items, max, isArmorSingle)=>{
    const slots=[];
    for(let i=0;i<max;i++){
      const id = isArmorSingle ? (i===0?items:null) : (items[i]||null);
      if(id){
        const item=M.gear[id];
        const key=`${kind}:${i}`, open=pilotGearOpenSet.has(key);
        slots.push(`<div class="slot">
          <div class="equipped">
            <div class="ei clickable" data-viewpg="${key}"><div class="en">${esc(item.name)}</div>
              <div class="em">${tr(item.type)}${item.damage||item.range?` · ${dmgStr(item)} · ${rngStr(item)}`:""}</div></div>
            <div style="display:flex;align-items:center;gap:8px">
              <button class="xbtn expand" data-exppg="${key}" title="Показать подробности" aria-label="${open?'Свернуть':'Развернуть'} подробности">${open?'⌄':'›'}</button>
              <button class="xbtn" data-rmpg="${key}" aria-label="Убрать снаряжение">✕</button>
            </div>
          </div>
          ${open?`<div class="expand-detail">${pilotGearCardBody(item, key)}</div>`:""}
        </div>`);
      } else {
        slots.push(`<div class="slot"><button class="ghostbtn block" data-addpg="${kind}:${i}">+ УСТАНОВИТЬ ${label.toUpperCase()}</button></div>`);
      }
    }
    return `<div class="mount"><div class="mhead"><span class="mt">${label}</span><span class="cap">${isArmorSingle?(items?1:0):items.length} / ${max}</span></div>${slots.join("")}</div>`;
  };

  $("#pilot-gear-loadout").innerHTML =
    slotGroup("Броня", "armor", g.armor, 1, true) +
    slotGroup("Оружие", "weapon", g.weapons, 2, false) +
    slotGroup("Снаряжение", "gear", g.gear, 3, false);

  $$("#pilot-gear-loadout [data-addpg]").forEach(b=>b.onclick=()=>{
    const [kind,idxStr]=b.dataset.addpg.split(":"), idx=+idxStr;
    const slotKind = kind==="armor"?"Armor":kind==="weapon"?"Weapon":"Gear";
    openPilotGearPicker(slotKind, id=>{
      if(kind==="armor") state.gear.armor=id;
      else if(kind==="weapon") state.gear.weapons[idx]=id;
      else state.gear.gear[idx]=id;
    });
  });
  $$("#pilot-gear-loadout [data-rmpg]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const [kind,idxStr]=b.dataset.rmpg.split(":"), idx=+idxStr;
    if(kind==="armor") state.gear.armor=null;
    else if(kind==="weapon") state.gear.weapons.splice(idx,1);
    else state.gear.gear.splice(idx,1);
    render();
  });
  $$("#pilot-gear-loadout [data-exppg]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const key=b.dataset.exppg;
    if(pilotGearOpenSet.has(key)) pilotGearOpenSet.delete(key); else pilotGearOpenSet.add(key);
    renderPilotGearLoadout();
  });
  $$("#pilot-gear-loadout [data-viewpg]").forEach(el=>el.onclick=()=>{
    const [kind,idxStr]=el.dataset.viewpg.split(":"), idx=+idxStr;
    const id = kind==="armor"?state.gear.armor:kind==="weapon"?state.gear.weapons[idx]:state.gear.gear[idx];
    const item=M.gear[id];
    modal(item.name, pilotGearCardHTML(item));
    wireTagGlossary("#pg-tags","#pg-tagdesc",item.tags||[]);
  });
}

/* Create/edit a custom pilot skill trigger. `id===null` creates a new one;
   otherwise edits the existing custom skill with that id. */
function openCustomSkillEditor(id){
  const existing = id ? (state.customSkills||[]).find(s=>s.id===id) : null;
  modal(existing?"Редактировать свой навык":"Новый навык пилота", `
    <div class="field"><label>НАЗВАНИЕ</label>
      <input class="input" id="csk-name" placeholder="например, «Взломать реальность»" value="${esc(existing?.name||"")}"></div>
    <div class="field" style="margin-top:12px"><label>ОПИСАНИЕ</label>
      <textarea class="input" id="csk-desc" rows="4" placeholder="Что делает этот навык, когда его применяют" style="resize:vertical; font-family:inherit">${esc(existing?.description||"")}</textarea></div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="toolbtn" style="border-color:var(--accent);color:var(--accent)" id="csk-save">${existing?"✓ СОХРАНИТЬ":"✓ СОЗДАТЬ"}</button>
      <button class="toolbtn" id="csk-cancel">ОТМЕНА</button>
    </div>`);
  $("#csk-name").focus();
  $("#csk-cancel").onclick=closeModal;
  $("#csk-save").onclick=()=>{
    const name=$("#csk-name").value.trim();
    if(!name){ $("#csk-name").focus(); return; }
    const description=$("#csk-desc").value.trim();
    if(existing){
      existing.name=name; existing.description=description;
    } else {
      const newId="custom_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      state.customSkills=state.customSkills||[];
      state.customSkills.push({id:newId, name, description});
    }
    closeModal(); render();
  };
}

/* ============ LICENSES ============ */
function stepLicense(name, dir){
  const v=Math.max(0,Math.min(3,(state.licenses[name]||0)+dir));
  if(v===0) delete state.licenses[name]; else state.licenses[name]=v;
}

/* What a rank of this license unlocks: every frame that shares this license
   track (the base frame plus any variants — see licenseKeyFor()) that opens
   at that exact rank, and any weapons/systems tied to the license at that
   rank. Passing a variant's own frame in still shows the base frame's
   unlocks (and vice versa), since they're the same license. */
function licenseRanksHTML(f){
  const key = licenseKeyFor(f);
  const siblingFrames = L.frames.filter(fr=>licenseKeyFor(fr)===key);
  const items=[
    ...L.weapons.filter(it=>it.license===key).map(it=>({...it,_kind:"w"})),
    ...L.systems.filter(it=>it.license===key).map(it=>({...it,_kind:"s"})),
    ...(L.mods||[]).filter(it=>it.license===key).map(it=>({...it,_kind:"m"})),
  ];
  const byRank={1:[],2:[],3:[]};
  items.forEach(it=>{ const r=it.license_level||1; if(byRank[r]) byRank[r].push(it); });
  const line=it=>{
    if(it._kind==="w") return `<li class="clickable" data-viewitem="w:${it.id}"><span class="mk">⚔</span> ${esc(it.name)} <span class="hint">${tr(it.mount)} · ${dmgStr(it)}</span></li>`;
    if(it._kind==="m") return `<li class="clickable" data-viewitem="m:${it.id}"><span class="mk">🔧</span> ${esc(it.name)} <span class="hint">мод · ${it.sp||0} SP</span></li>`;
    return `<li class="clickable" data-viewitem="s:${it.id}"><span class="mk">⚙</span> ${esc(it.name)} <span class="hint">${it.sp} SP</span></li>`;
  };
  return [1,2,3].map(rank=>{
    const framesHere = siblingFrames.filter(fr=>fr.license_level===rank);
    const list = byRank[rank];
    if(!framesHere.length && !list.length) return "";
    return `<div style="margin-bottom:14px">
      <h4 style="font-family:'Chakra Petch';font-size:15px;margin-bottom:6px;color:var(--accent)">РАНГ ${rank}</h4>
      ${framesHere.map(fr=>`<div class="desc" style="margin-bottom:6px">🔓 Открывает само шасси <b>${esc(dispName(fr))}</b>${fr.variant?` <span class="hint">(вариант лицензии ${esc(fr.variant)})</span>`:""}.</div>`).join("")}
      ${list.length?`<ul class="minilist">${list.map(line).join("")}</ul>`:""}
    </div>`;
  }).join("") || `<div class="hint">На эту лицензию не привязано ни оружия, ни систем, ни модов — только шасси.</div>`;
}
function openLicenseDetail(fid){
  const f=M.frame[fid], key=licenseKeyFor(f), v=licRank(key), d=derived();
  const remaining=d.b.license.cap-d.b.license.used;
  const siblings=L.frames.filter(fr=>licenseKeyFor(fr)===key && fr.id!==f.id).map(fr=>dispName(fr));
  const img=frameImageURL(f);
  const imgHTML = img ? `<a href="${img}" target="_blank" rel="noopener" title="Открыть источник изображения">
    <img src="${img}" alt="" loading="lazy" onerror="this.closest('a').remove()"
      style="float:right; width:300px; height:300px; object-fit:contain; margin:0 0 12px 16px; border-radius:8px; background:var(--panel-2); cursor:zoom-in"></a>` : "";
  modal(dispName(f), `
    ${imgHTML}
    <div class="meta" style="margin-bottom:14px;color:${srcColor(f.source)}">${esc(SRC_NAME[f.source]||f.source)} · ${f.mechtype?.map(tr).join(" / ")||""}</div>
    ${siblings.length?`<div class="desc" style="margin-bottom:14px">Эта лицензия общая с ${siblings.map(n=>`<b>${esc(n)}</b>`).join(", ")} — ранг один на всех, поднимая его здесь, вы поднимаете его и там.</div>`:""}
    <div class="stepper" style="margin-bottom:18px">
      <button class="stepbtn" id="lic-minus" ${v<=0?"disabled":""}>−</button>
      <span class="pips">${[1,2,3].map(n=>`<span class="pip ${v>=n?'on':''}"></span>`).join("")}</span>
      <button class="stepbtn" id="lic-plus" ${(v<3&&remaining>=1)?"":"disabled"}>+</button>
      <span class="hint" style="margin-left:10px">ранг ${v}/3</span>
    </div>
    ${licenseRanksHTML(f)}`);
  $("#lic-minus").onclick=()=>{ stepLicense(key,-1); render(); openLicenseDetail(fid); };
  $("#lic-plus").onclick=()=>{ stepLicense(key,1); render(); openLicenseDetail(fid); };
  $$("#modal [data-viewitem]").forEach(el=>el.onclick=()=>{
    const [kind,id]=el.dataset.viewitem.split(":");
    viewLicenseItemPreview(kind, id, ()=>openLicenseDetail(fid));
  });
}

/* Read-only preview of a weapon/system from the license-rank breakdown —
   no install/remove action, since we're on the ЛИЦЕНЗИИ tab, not editing
   the loadout. "← Назад" returns to the license rank detail it came from. */
function viewLicenseItemPreview(kind, id, back){
  tagOpenSet=new Set(); profileViewIdx=0;

    const item = kind==="w" ? M.weapon[id] : kind==="m" ? M.mod[id] : M.system[id];
    const html = kind==="w" ? weaponCardHTML(item) : kind==="m" ? modCardHTML(item) : systemCardHTML(item);
    $("#modal .mhd h3").textContent=item.name;
    setModalBody(
      `<button class="ghostbtn mb-14" id="lip-back">← Назад к лицензии</button>`
      + html);
    if(kind==="w") wireTagGlossary("#wp-tags","#wp-tagdesc",weaponDisplayTags(item, profileViewIdx));
    else if(kind==="m") wireTagGlossary("#md-tags","#md-tagdesc",item.tags||[]);
    else wireTagGlossary("#sy-tags","#sy-tagdesc",item.tags||[]);
    if(kind==="w") wireProfileChips("#wp-profiles", draw);
    $("#lip-back").onclick=back;
  };
  draw();
}
